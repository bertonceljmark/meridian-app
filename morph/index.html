<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2B2723">
<title>Meridian Morph Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   MORPH LAB. One surface that deforms.
   Every form on the page carries ONE number, --h:
     +1  plateau (risen out of the page)      0  flat page      -1  well (pressed into the page)
   Shadows are computed from --h and from the light direction (--lx, --ly),
   so anything can travel continuously between raised, flat and pressed.
   That is the whole trick: nothing slides over the page; the page itself
   rises, flattens, sinks and flows.
   ===================================================================== */
@property --h{syntax:'<number>';inherits:false;initial-value:0}
@property --lx{syntax:'<number>';inherits:true;initial-value:1}
@property --ly{syntax:'<number>';inherits:true;initial-value:1}
:root{
  --surf:#2B2723; --cream:#F3EDE4;
  --t2:rgba(243,237,228,.68); --t3:rgba(243,237,228,.57); --t4:rgba(243,237,228,.30);
  --sun:#FF6B3D; --sun2:#FF8F5E; --night:#98A2FC; --rec:#A39C92;
  --disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ui:"Geist",ui-sans-serif,system-ui,sans-serif;
  --gut:20px; --tabh:84px;
  --ease:cubic-bezier(.2,.8,.2,1); --spr:cubic-bezier(.34,1.45,.55,1); --press:cubic-bezier(.3,.7,.4,1);
  --deb:calc(var(--lx)*-1px) calc(var(--ly)*-1px) 0 rgba(0,0,0,.45),calc(var(--lx)*1px) calc(var(--ly)*1px) 0 rgba(255,238,220,.06);
  --emb:calc(var(--lx)*2px) calc(var(--ly)*2px) 5px rgba(12,9,6,.55),calc(var(--lx)*-1px) calc(var(--ly)*-1px) 1px rgba(255,238,220,.07);
  --groove:linear-gradient(rgba(12,9,6,.5) 0 1px,rgba(255,238,220,.06) 1px 2px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1C1916;color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
.app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--surf);--lx:1;--ly:1}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- the two depth recipes ---------- */
/* regions: plateaus (rows, sheets, bars) and wells (results, Later) */
.f{box-shadow:
  calc(max(var(--h),0)*12px*var(--lx)) calc(max(var(--h),0)*12px*var(--ly)) calc(max(var(--h),0)*28px) rgba(12,9,6,.46),
  calc(max(var(--h),0)*-9px*var(--lx)) calc(max(var(--h),0)*-9px*var(--ly)) calc(max(var(--h),0)*22px) rgba(255,238,220,.052),
  calc(max(var(--h),0)*2px*var(--lx)) calc(max(var(--h),0)*2px*var(--ly)) calc(max(var(--h),0)*5px) rgba(12,9,6,.2),
  inset calc(max(calc(var(--h) * -1),0)*7px*var(--lx)) calc(max(calc(var(--h) * -1),0)*7px*var(--ly)) calc(max(calc(var(--h) * -1),0)*16px) rgba(12,9,6,.46),
  inset calc(max(calc(var(--h) * -1),0)*-6px*var(--lx)) calc(max(calc(var(--h) * -1),0)*-6px*var(--ly)) calc(max(calc(var(--h) * -1),0)*14px) rgba(255,238,220,.045);
  translate:calc(var(--h)*var(--px,0)*1px) calc(var(--h)*var(--py,0)*1px)}
/* keys: smaller, crisper; the thing you press */
.fk{--h:1;box-shadow:
  calc(max(var(--h),0)*5px*var(--lx)) calc(max(var(--h),0)*5px*var(--ly)) calc(max(var(--h),0)*12px) rgba(12,9,6,.58),
  calc(max(var(--h),0)*-4px*var(--lx)) calc(max(var(--h),0)*-4px*var(--ly)) calc(max(var(--h),0)*10px) rgba(255,238,220,.075),
  inset calc(max(calc(var(--h) * -1),0)*4px*var(--lx)) calc(max(calc(var(--h) * -1),0)*4px*var(--ly)) calc(max(calc(var(--h) * -1),0)*10px) rgba(12,9,6,.62),
  inset calc(max(calc(var(--h) * -1),0)*-3px*var(--lx)) calc(max(calc(var(--h) * -1),0)*-3px*var(--ly)) calc(max(calc(var(--h) * -1),0)*9px) rgba(255,238,220,.085);
  background:var(--surf);transition:--h .36s var(--spr),transform .36s var(--spr),color .25s;
  translate:calc(var(--h)*var(--px,0)*.6px) calc(var(--h)*var(--py,0)*.6px)}
.fk.down{--h:-.75;transform:scale(.96);transition:--h .08s var(--press),transform .08s var(--press)}
.fk.on,.fk.done{--h:-1}
.fk.lo{--h:.55}
.fk:disabled{--h:0;color:var(--t4)}
.fk.held{--h:-1.15!important;transition:--h .3s var(--ease)}
:focus{outline:none}
input:focus-visible{outline:none}
:focus-visible{outline:2px solid var(--sun2);outline-offset:3px;border-radius:14px}

/* grain */
.grain{position:absolute;inset:0;z-index:90;pointer-events:none;opacity:.07;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");background-size:160px 160px}

/* ---------- chrome ---------- */
.sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 0 30px;pointer-events:none}
.sbar .clk{font:600 16px/1 var(--ui)}
.sbar .gd{pointer-events:auto;font:500 12.5px/1 var(--ui);color:var(--t2);padding:9px 13px;border-radius:99px;--h:.55;text-shadow:var(--deb)}
.sbar .gd b{color:var(--cream);font-weight:600}
.topbar{position:absolute;top:0;left:0;right:0;height:96px;z-index:35;background:var(--surf);display:flex;align-items:flex-end;justify-content:center;padding-bottom:13px;font:600 16px/1 var(--disp);opacity:0;pointer-events:none;border-radius:0 0 26px 26px}
.topbar span{text-shadow:var(--emb)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:200px;display:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}
.screen.out{opacity:0;transition:opacity .16s linear}
.screen.in{animation:txin .32s var(--ease) both}
@keyframes txin{from{opacity:0}}
.screen.dim{opacity:.5;transition:opacity .3s var(--ease)}

/* header */
.head{position:relative;padding:60px var(--gut) 0;display:flex;align-items:flex-start;justify-content:space-between}
.head h1{font:600 34px/1 var(--disp);font-variation-settings:"wdth" 88;letter-spacing:-.02em;text-shadow:var(--emb);transform-origin:left bottom}
.head .sub{margin-top:7px;font:400 15px/1.2 var(--ui);color:var(--t2);text-shadow:var(--deb)}
.hicons{display:flex;gap:10px;margin-top:-4px}
.ib{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--t2);--h:.6}
.ib svg{filter:drop-shadow(-.6px -.6px 0 rgba(0,0,0,.5)) drop-shadow(.6px .6px 0 rgba(255,238,220,.07))}
.ib .n{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--surf);font:700 10.5px/18px var(--ui);color:var(--cream);text-align:center;box-shadow:2px 2px 5px rgba(12,9,6,.5),-1px -1px 3px rgba(255,238,220,.05)}
.ib .n.pop{animation:pop .5s var(--spr)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:none}}

/* pull to sync */
.pull{position:absolute;top:50px;left:50%;width:150px;height:30px;margin-left:-75px;border-radius:15px;z-index:5;display:grid;place-items:center;font:500 11.5px var(--ui);color:var(--t3);overflow:hidden;opacity:0}
.pull .lt{position:absolute;left:0;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,143,94,.5),transparent);transform:translateX(-120%)}
.pull.sync .lt{animation:sweep 1s var(--ease) infinite}
@keyframes sweep{to{transform:translateX(320%)}}

/* arc placeholder (the studio owns the real arc) */
.arc{position:relative;height:128px;margin-top:4px}
.arc svg{position:absolute;inset:0;width:100%;height:100%}

/* results strip */
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:14px;padding:6px var(--gut) 10px}
.strip::-webkit-scrollbar{display:none}
.panel{position:relative;flex:0 0 76%;scroll-snap-align:start;scroll-margin-left:var(--gut);border-radius:26px;padding:13px 16px 13px;text-align:left;min-height:136px;--h:-1}
.panel .k{display:flex;align-items:center;gap:8px;font:600 13px var(--ui);color:var(--ht,var(--t2))}
.panel .k:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hf,var(--t3));box-shadow:0 0 6px var(--hf,transparent)}
.panel .big{margin-top:8px;font:300 40px/1 var(--disp);letter-spacing:-.02em}
.panel .big small{font:400 17px var(--ui);color:var(--t2);margin-left:4px;letter-spacing:0}
.panel .ln{margin-top:6px;font:400 13.5px/1.32 var(--ui);color:var(--t2)}
.panel .mini{display:flex;gap:4px;align-items:flex-end;height:24px;margin-top:10px}
.panel .mini i{width:7px;border-radius:2px;background:rgba(243,237,228,.24)}
.panel .mini i.hi{background:var(--hf);box-shadow:0 0 8px var(--hf)}
.panel .px{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--t3);--h:.5}
.panel .open{position:absolute;inset:0;border-radius:26px}
.panel > *:not(.open):not(.px){pointer-events:none}

/* sections */
.sec{margin-top:16px}
.sech{display:flex;justify-content:space-between;align-items:center;padding:0 var(--gut);margin-bottom:10px}
.sech h2{font:650 12px/1 var(--ui);letter-spacing:.11em;text-transform:uppercase;color:var(--t2);text-shadow:var(--deb)}
.sech .aside{font:500 13px var(--ui);color:var(--t2);text-shadow:var(--deb)}

/* Now rows: plateaus */
.rows{padding:0 var(--gut)}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 34px;border-radius:24px;margin-bottom:12px;--h:1;min-height:72px}
.row.full{flex-wrap:wrap}
.row .open{position:absolute;inset:0 84px 0 0;border-radius:24px}
.row.full .open{right:0;bottom:60px}
.row .txt{flex:1;min-width:0;pointer-events:none}
.row .nm{font:550 21px/1.1 var(--disp);letter-spacing:-.01em;transition:opacity .3s}
.row.lead .nm{font-size:26px}
.row .st{margin-top:4px;font:400 14px/1.3 var(--ui);color:var(--t2);transition:opacity .3s}
.row .st b{color:var(--cream);font-weight:550;display:inline-block}
.row .st b.roll{animation:roll .42s var(--spr)}
@keyframes roll{from{transform:translateY(70%);opacity:0}}
.row.melt .nm,.row.melt .st{opacity:.45}
.row .ctl{display:flex;gap:8px;align-items:center;position:relative;z-index:2}
.inl{position:absolute;left:14px;top:16px;bottom:16px;width:7px;border-radius:4px;background:color-mix(in oklab,var(--hf,#1d1a17) 18%,var(--surf));box-shadow:inset 1.5px 1.5px 3px rgba(12,9,6,.75),inset -1px -1px 2px rgba(255,238,220,.07);overflow:hidden;pointer-events:none}
.inl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:var(--hf);box-shadow:0 0 10px var(--hf);transition:height .7s var(--ease)}
.row.task .inl{background:var(--surf)}
.more{display:block;margin:2px auto 0;padding:11px 18px;border-radius:99px;font:500 14px var(--ui);color:var(--t2);--h:.55}

/* keys */
.kr{position:relative;width:48px;height:48px;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.kr .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--hf,var(--sun));transition:height .55s var(--ease)}
.kr.done .fill{height:100%;box-shadow:inset 3px 3px 7px rgba(0,0,0,.32),inset -2px -2px 6px rgba(255,255,255,.16)}
.kr svg{position:relative;z-index:1}
.kr .pl{stroke:var(--ht,var(--cream))}
.kr .ck{stroke:#17130F;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s .25s var(--ease)}
.kr.done .pl{opacity:0}
.kr.done .ck{stroke-dashoffset:0}
.kr .ck.ghost{stroke:var(--t3);stroke-dashoffset:0}
.ks{height:48px;padding:0 13px;border-radius:24px;display:flex;gap:5px;align-items:center}
.ks i{position:relative;width:9px;height:24px;border-radius:5px;overflow:hidden;background:color-mix(in oklab,var(--hf,#1d1a17) 14%,var(--surf));box-shadow:inset 1.5px 1.5px 3px rgba(12,9,6,.75),inset -1px -1px 2px rgba(255,238,220,.07)}
.ks i:after{content:"";position:absolute;inset:0;background:var(--hf);transform:scaleY(0);transform-origin:bottom;transition:transform .5s var(--ease);box-shadow:0 0 6px var(--hf)}
.ks i.on:after{transform:none}
.kw{height:44px;padding:0 15px;border-radius:22px;font:500 14px var(--ui);color:var(--t2);--h:.6}
.kw.on{color:var(--cream)}
.kp{height:46px;padding:0 16px 0 13px;border-radius:23px;display:flex;align-items:center;gap:7px;font:550 15px var(--ui);color:var(--cream)}
.kp svg{color:var(--ht)}
.kp.on{color:var(--ht)}
.amt{display:flex;gap:9px;width:100%;margin-top:2px}
.tile{position:relative;flex:1;height:48px;border-radius:16px;overflow:hidden;font:500 16.5px var(--ui)}
.tile span{position:relative;z-index:1}
.tile .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--hf)}
.tile.pour .fill{animation:pour 1.1s var(--ease)}
.tile.pour span{animation:pourtx 1.1s var(--ease)}
@keyframes pour{0%{height:0}38%{height:100%}100%{height:0}}
@keyframes pourtx{0%,10%{color:var(--cream)}30%,55%{color:#17130F}100%{color:var(--cream)}}
.level{position:relative;width:100%;height:7px;border-radius:4px;margin:8px 0 12px;box-shadow:inset 1.5px 1.5px 3px rgba(12,9,6,.75),inset -1px -1px 2px rgba(255,238,220,.07)}
.level i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:3px;background:var(--hf);box-shadow:0 0 10px var(--hf);transition:width .8s var(--spr)}

/* Later: one well, set as type */
.later{margin:0 var(--gut);padding:14px 16px 14px;border-radius:26px;--h:-1}
.lg{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:4px 0}
.lg .h{width:100%;font:500 12.5px var(--ui);color:var(--t3);text-shadow:var(--deb);margin-top:4px}
.tok{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:19px;font:500 15px var(--ui);color:var(--cream);--h:.6}
.tok .hp{width:8px;height:8px;border-radius:50%;background:color-mix(in oklab,var(--hf) 18%,var(--surf));box-shadow:inset 1px 1px 2px rgba(0,0,0,.6);transition:background .4s,box-shadow .4s}
.tok.on{color:var(--ht)}
.tok.on .hp{background:var(--hf);box-shadow:0 0 7px var(--hf)}

/* suggestion */
.sug{margin:0 var(--gut);padding:15px 16px 14px;border-radius:26px;--h:1}
.sug .sn{display:flex;align-items:center;gap:9px;font:550 20px var(--disp)}
.sug .sn:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hf);box-shadow:0 0 7px var(--hf)}
.sug .sr{margin-top:5px;font:400 14px/1.35 var(--ui);color:var(--t2)}
.sug .sb{display:flex;gap:10px;margin-top:13px}

/* settled */
.settled{padding:4px var(--gut) 0;display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--t2);font:500 14px var(--ui);text-shadow:var(--deb)}
.settled span{display:inline-flex;align-items:center;gap:7px}
.settled span i{width:7px;height:7px;border-radius:50%;background:var(--hf);box-shadow:0 0 6px var(--hf)}
.settled span.new{animation:settle .7s var(--ease)}
@keyframes settle{0%{opacity:0;filter:blur(2px)}100%{opacity:1}}
.settled span.new i{animation:lightup 1.1s var(--ease)}
@keyframes lightup{0%{box-shadow:0 0 0 var(--hf);transform:scale(.3)}40%{box-shadow:0 0 16px var(--hf);transform:scale(1.4)}100%{box-shadow:0 0 6px var(--hf)}}

/* empty */
.empty{padding:40px var(--gut) 0;text-align:center}
.empty p{font:400 15px/1.45 var(--ui);color:var(--t2);text-shadow:var(--deb);max-width:280px;margin:0 auto 20px}
.empty h3{font:550 26px var(--disp);text-shadow:var(--emb);margin-bottom:8px}

/* buttons */
.btn{height:50px;padding:0 20px;border-radius:25px;font:550 15.5px var(--ui);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn.primary{color:var(--ht,var(--cream))}
.btn.primary:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hf,var(--sun2))}
.btn.ghost{--h:0;color:var(--t2)}
.btn.ghost.down{--h:-.6}
.btn.wide{width:100%}
.btns{display:flex;gap:12px;padding:6px var(--gut) 0}
.btns .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:2px var(--gut)}
.chip{height:40px;padding:0 15px;border-radius:20px;font:500 14px var(--ui);color:var(--t2);display:inline-flex;align-items:center;gap:8px;--h:.6}
.chip.on{color:var(--cream)}
.chip.on:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--hf,var(--sun2))}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);z-index:50;background:var(--surf);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:8px 8px 0}
.tabbar:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--groove)}
.tw{position:absolute;top:8px;height:54px;border-radius:17px;--h:-1;pointer-events:none}
.tab{position:relative;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11px var(--ui);color:var(--t3);border-radius:17px;transition:color .3s}
.tab svg{filter:drop-shadow(-.6px -.6px 0 rgba(0,0,0,.5)) drop-shadow(.6px .6px 0 rgba(255,238,220,.06));transition:color .3s}
.tab.on{color:var(--cream)}
.tab.on svg{color:var(--sun2);filter:none}
.logkey{justify-self:center;width:60px;height:60px;border-radius:50%;margin-top:-14px;display:grid;place-items:center;color:var(--sun2);--h:1.25}
.logkey.held{--h:-1!important}

/* morph layers (sheets, pages, bars, fields grow out of whatever you touched) */
.mo{position:absolute;z-index:60;background:var(--surf);overflow:hidden;will-change:left,top,width,height}
.mo .mghost,.mo .inner{position:absolute;left:0;top:0}
.mo .mghost{pointer-events:none;box-shadow:none!important;margin:0!important;translate:none!important}
.mo .inner{opacity:0}
.mo.page{z-index:40}
.mo.bar{z-index:44}
.mo.field{z-index:36}
.catch{position:absolute;inset:0;z-index:55}
.sheetin{display:flex;flex-direction:column}
.sheetin .body{overflow-y:auto;flex:1;padding-bottom:40px;scrollbar-width:none}
.sheetin .body::-webkit-scrollbar{display:none}
.grab{height:30px;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.grab i{width:42px;height:6px;border-radius:3px;box-shadow:inset 1.5px 1.5px 3px rgba(12,9,6,.75),inset -1px -1px 2px rgba(255,238,220,.07)}
.sh{display:flex;align-items:flex-start;justify-content:space-between;padding:4px var(--gut) 12px;touch-action:none}
.sh h3{font:600 26px/1.1 var(--disp);letter-spacing:-.01em;text-shadow:var(--emb)}
.sh .s2{margin-top:5px;font:400 14px var(--ui);color:var(--t2)}
.close{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--t2);flex:none;--h:.6}
.lab{padding:16px var(--gut) 9px;font:650 12px/1 var(--ui);letter-spacing:.11em;text-transform:uppercase;color:var(--t2);text-shadow:var(--deb)}
.well{margin:0 var(--gut);border-radius:22px;padding:14px 16px;--h:-1}
.li{position:relative;display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 0}
.li+.li:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--groove)}
.li .tm{font:500 14px var(--ui);color:var(--t2);width:46px}
.li .v{flex:1;font:500 16px var(--ui)}
.li .rm{height:36px;padding:0 13px;border-radius:18px;font:500 13px var(--ui);color:var(--t2);--h:.55}
.bars{display:flex;gap:10px;align-items:flex-end;height:96px;padding-top:6px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;font:500 11px var(--ui);color:var(--t3)}
.bars .c b{position:relative;width:100%;height:70px;border-radius:7px;box-shadow:inset 1.5px 1.5px 3px rgba(12,9,6,.7),inset -1px -1px 2px rgba(255,238,220,.06);overflow:hidden}
.bars .c b i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--hf);box-shadow:0 0 8px var(--hf);border-radius:6px;transition:height .7s var(--spr)}
.para{padding:2px var(--gut);font:400 15px/1.5 var(--ui);color:var(--t2)}
.para b{color:var(--cream);font-weight:550}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 15px;color:var(--t2)}
.search input{flex:1;font:500 16px var(--ui);color:var(--cream)}
.search input::placeholder{color:var(--t3)}

/* switch: a bead that flows under the surface; the hue fills in behind it */
.sw{position:relative;width:56px;height:32px;border-radius:16px;flex:none;--h:-1;overflow:visible}
.sw .liq{position:absolute;left:3px;top:3px;bottom:3px;width:26px;border-radius:13px;background:var(--hf,var(--sun));opacity:0;transition:width .38s var(--ease),opacity .25s}
.sw .bead{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--surf);--h:1;
  transition:left .42s var(--spr),width .2s var(--ease)}
.sw.mv .bead{width:34px}
.sw.on .bead{left:28px}
.sw.on.mv .bead{left:18px}
.sw.on .liq{width:50px;opacity:1}
.set{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 0}
.set+.set{position:relative}
.set+.set:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--groove)}
.set .sl{flex:1}
.set .sl b{display:block;font:500 16px var(--ui)}
.set .sl small{display:block;margin-top:3px;font:400 13px var(--ui);color:var(--t2)}

/* segmented: the chosen well flows */
.seg{position:relative;display:flex;margin:0 var(--gut);padding:5px;border-radius:22px;--h:.7}
.seg .sw2{position:absolute;top:5px;bottom:5px;border-radius:17px;--h:-1;pointer-events:none}
.seg button{position:relative;flex:1;height:40px;font:500 14px var(--ui);color:var(--t3);transition:color .3s}
.seg button.on{color:var(--cream)}

/* stepper */
.stepper{display:flex;align-items:center;gap:14px;padding:8px;border-radius:30px;--h:-1}
.stepper button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:500 22px/1 var(--ui);color:var(--cream)}
.stepper .num{min-width:36px;height:44px;overflow:hidden;position:relative;text-align:center;font:500 22px/44px var(--disp)}
.stepper .num span{position:absolute;left:0;right:0}
.stepper .num .up-in{animation:upin .38s var(--spr)}
.stepper .num .up-out{animation:upout .3s var(--ease) forwards}
.stepper .num .dn-in{animation:dnin .38s var(--spr)}
.stepper .num .dn-out{animation:dnout .3s var(--ease) forwards}
@keyframes upin{from{transform:translateY(100%);opacity:0}}
@keyframes upout{to{transform:translateY(-100%);opacity:0}}
@keyframes dnin{from{transform:translateY(-100%);opacity:0}}
@keyframes dnout{to{transform:translateY(100%);opacity:0}}

/* time wheel: the chosen hour sits in a well; neighbours rise away from it */
.wheel{position:relative;height:150px;margin:0 var(--gut);border-radius:24px;--h:.6;overflow:hidden}
.wheel .band{position:absolute;left:10px;right:10px;top:53px;height:44px;border-radius:14px;--h:-1;pointer-events:none}
.wheel .wl{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:53px 0}
.wheel .wl::-webkit-scrollbar{display:none}
.wheel .wi{height:44px;display:grid;place-items:center;scroll-snap-align:center;font:500 20px var(--disp);color:var(--cream);will-change:transform,opacity}

/* swatches */
.swatches{display:flex;gap:12px;padding:2px var(--gut);flex-wrap:wrap}
.sw8{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;--h:.6}
.sw8 i{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 1px 1px 2px rgba(0,0,0,.35)}
.sw8.on i{box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--c),0 0 10px var(--c)}

/* skeleton: the surface breathes while it waits */
.skel{height:18px;border-radius:9px;margin:12px 0;animation:breathe 1.6s ease-in-out infinite}
.skel:nth-child(2){animation-delay:.18s;width:76%}
.skel:nth-child(3){animation-delay:.36s;width:58%}
@keyframes breathe{0%,100%{--h:.05}50%{--h:.55}}

/* toast: a blister that swells out of the surface */
.toast{position:absolute;left:50%;height:58px;border-radius:29px;background:var(--surf);z-index:58;overflow:hidden;translate:-50% 0}
.toast .tin{position:absolute;top:0;left:50%;height:58px;display:flex;align-items:center;gap:12px;padding:0 9px 0 20px;transform:translateX(-50%);opacity:0;transition:opacity .2s}
.toast .tx{flex:1;font:500 14.5px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .tx b{font-weight:600}
.toast .undo{height:40px;padding:0 15px;border-radius:20px;font:600 14px var(--ui);color:var(--sun2);--h:.6}
.toast .tg{position:absolute;left:24px;right:24px;bottom:6px;height:3px;border-radius:2px;box-shadow:inset 1px 1px 2px rgba(12,9,6,.7)}
.toast .tg i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:2px;background:var(--t4)}

/* live bar inner */
.live{display:flex;align-items:center;gap:10px;height:64px;padding:0 10px 0 18px}
.live .ln2{flex:1}
.live .ln2 b{display:block;font:550 16px var(--ui)}
.live .ln2 small{font:500 13px var(--ui);color:var(--ht);font-variant-numeric:tabular-nums}
.live .kw{height:40px}
.live .lp{position:absolute;left:18px;right:18px;bottom:7px;height:4px;border-radius:2px;box-shadow:inset 1px 1px 2px rgba(12,9,6,.7)}
.live .lp i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--hf);box-shadow:0 0 8px var(--hf);transition:width 1s linear}

/* Time */
.mon{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;padding:0 var(--gut)}
.mon .wd{font:600 11px var(--ui);color:var(--t3);text-align:center;letter-spacing:.06em}
.dc{position:relative;aspect-ratio:1;border-radius:14px;--h:-.7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 13px var(--ui);color:var(--t2)}
.dc.today{color:var(--cream)}
.dc.fut{color:var(--t4)}
.dc .ds{display:flex;gap:2px;pointer-events:none}
.dc .ds i{width:4px;height:4px;border-radius:50%;background:var(--c);box-shadow:0 0 4px var(--c)}
.dc > span{pointer-events:none}

/* Routines */
.rrow{position:relative;display:flex;align-items:center;gap:12px;margin:0 var(--gut) 12px;padding:14px 14px 14px 34px;border-radius:22px;--h:1;text-align:left;width:calc(100% - 2*var(--gut))}
.rrow .nm{font:550 19px var(--disp)}
.rrow .st{margin-top:3px;font:400 13.5px var(--ui);color:var(--t2)}
.rrow > div{flex:1;pointer-events:none}
.rrow svg{color:var(--t3);pointer-events:none}
.pagein{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:0 0 60px}
.pagein::-webkit-scrollbar{display:none}
.pagehead{padding:58px var(--gut) 8px;display:flex;align-items:center;gap:12px}
.pagehead h2{font:600 32px/1 var(--disp);letter-spacing:-.02em;text-shadow:var(--emb)}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--t2);--h:.6}

/* guide */
.gi{position:relative;margin:0 var(--gut) 10px;border-radius:20px;--h:.8;overflow:hidden}
.gi > button{display:flex;width:100%;align-items:center;gap:12px;padding:13px 14px;text-align:left}
.gi .gn{flex:1;font:550 16px var(--ui)}
.gi .gs{font:500 11.5px var(--ui);color:var(--t3);letter-spacing:.04em}
.gi .gs.b{color:var(--sun2)}
.gi .gd2{height:0;overflow:hidden;transition:height .38s var(--ease)}
.gi .gd2 > div{padding:0 14px 14px}
.gi .gd2 p{font:400 14px/1.45 var(--ui);color:var(--t2)}
.gi .gd2 code{display:block;margin-top:8px;font:500 12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--t3);white-space:pre-wrap}
.gi .gd2 .btn{margin-top:12px;height:42px}
.gi.open{--h:-.8}
.dl{display:flex;gap:10px;padding:4px var(--gut) 16px}
.dl .btn{flex:1;height:44px;font-size:14px}

@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.rm-on *,.rm-on *:before,.rm-on *:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="pull f" id="pull"><span class="lt"></span><span id="pullt">Pull to sync from Health</span></div>

  <!-- TODAY -->
  <section class="screen on" id="s-today" data-title="Tuesday, 27 October"></section>
  <!-- TIME -->
  <section class="screen" id="s-time" data-title="October"></section>
  <!-- ROUTINES -->
  <section class="screen" id="s-routines" data-title="Routines"></section>
  <!-- YOU -->
  <section class="screen" id="s-you" data-title="You"></section>

  <div class="topbar f" id="topbar"><span id="toptitle">Tuesday, 27 October</span></div>
  <div class="sbar"><span class="clk">08:40</span><button class="gd fk" id="guidebtn" data-act="guide"><b>Guide</b>, 34 interactions</button></div>

  <nav class="tabbar" id="tabbar">
    <span class="tw f" id="tw"></span>
    <button class="tab on" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17h18"/><path d="M6 17a6 6 0 0 1 12 0"/></svg>Today</button>
    <button class="tab" data-tab="time"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M10 19V6M15 19v-9M20 19V8"/></svg>Time</button>
    <button class="logkey fk" data-act="log" aria-label="Log"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="routines"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Routines</button>
    <button class="tab" data-tab="you"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>You</button>
  </nav>
  <div class="grain"></div>
</div>
<script>
/* The inventory: every interactive or transitional element, how it morphs, how it feels, and its native route.
   status: Built = working in this lab, Spec = written down only. try = a TRY key in app.js. */
const GUIDE=[
/* ---- the surface ---- */
{id:'scroll',group:'The surface',name:'Scrolling folds the page',status:'Built',try:'scroll',
 how:'Rows rise out of the page as they come up from the tab bar and sink back flat as they reach the top. A fast flick flattens everything slightly, as if the surface were moving under your finger, and it all rises again when you stop.',
 feel:'No haptic. The motion is the feedback.',
 native:'ScrollView + .scrollTransition(.interactive) { c, phase in c.neuDepth(rest * (1 - abs(phase.value))) }. Flick dip: onScrollGeometryChange + onScrollPhaseChange (iOS 18, context.velocity) feeding one @State dip.'},
{id:'title',group:'The surface',name:'Day name folds into the top bar',status:'Built',try:'scroll',
 how:'As you scroll, the big day name shrinks and fades while a low ridge forms across the top of the page with the short title on it. Nothing slides in; the bar rises out of the same surface.',
 native:'onScrollGeometryChange(for: CGFloat.self) { $0.contentOffset.y } -> progress; bar = surface shape with .neuDepth(0.45 * progress); title .opacity(progress).'},
{id:'strip',group:'The surface',name:'Results deepen as they reach the centre',status:'Built',try:'report',
 how:'In the swipeable results row, the reading in front is a full hollow; the ones at the edge are shallow and deepen as you swipe them in.',
 native:'Horizontal ScrollView + .scrollTargetBehavior(.viewAligned) + .scrollTransition(axis: .horizontal) driving depth.'},
{id:'pull',group:'The surface',name:'Pull to sync',status:'Built',try:'pull',
 how:'Pull Today down and a hollow forms above the header, deepening with your pull. Past the point of no return you feel a tick and the label turns to Release. A line of light sweeps inside the hollow while Health syncs, then it heals flat.',
 feel:'One tick at the threshold, one when done.',
 native:'Custom, not .refreshable (its spinner cannot be restyled): onScrollGeometryChange reads negative contentOffset; .sensoryFeedback(.impact(weight: .light), trigger: armed); HealthKit HKObserverQuery refresh. In this lab the pull only works on iPhone (Safari reports the bounce); Try it plays the sync.'},
{id:'tilt',group:'The surface',name:'Layers pop: light follows the phone',status:'Built',try:'tilt',
 how:'Every shadow and highlight is drawn from one light. Tilt the phone and the light swings: shadows lengthen on one side, highlights move, and raised things drift a few points against the page (parallax by height). Wells drift the other way. This is what makes it read as real depth rather than a drawing.',
 feel:'Subtle: at most 2-3 pt of drift; never on by default for motion-sensitive users.',
 native:'CoreMotion CMMotionManager.deviceMotion (attitude.roll/pitch) at 30 Hz, smoothed, into an @Observable Light {x, y}; NeuDepth reads it for shadow offsets and .offset(x: h * px). Respect accessibilityReduceMotion. On the web lab: turn on in You (asks motion permission on iPhone); a mouse moves the light on desktop.'},
{id:'edges',group:'The surface',name:'Content passes under the tab bar',status:'Built',try:'scroll',
 how:'The tab bar is the same page divided by one groove. Rows reaching it flatten into it rather than sliding under a floating bar.',
 native:'Same scrollTransition as above; tab bar = .safeAreaInset(edge: .bottom) with the surface colour and a 2 pt groove.'},

/* ---- keys and logging ---- */
{id:'key',group:'Keys and logging',name:'A key sinks and springs back',status:'Built',try:'key',
 how:'Touch down: the key sinks into the page in 80 ms and shrinks to 96 %. Release: it springs back up with a little overshoot. Raised means you can press it; pressed in means chosen or done.',
 feel:'Light impact on touch down: the mechanical-key moment.',
 native:'ButtonStyle reading configuration.isPressed -> depth -0.75, .scaleEffect(0.96), .animation(.spring(response: 0.28, dampingFraction: 0.6)); .sensoryFeedback(.impact(weight: .light), trigger: isPressed).'},
{id:'done',group:'Keys and logging',name:'Done: the key stays in and fills',status:'Built',try:'key',
 how:'On a one-tap routine the key stays pressed in, its routine colour rises from the bottom like liquid, and the check draws over it. Its groove on the left of the row fills to the new level.',
 feel:'Success haptic for routines. Records (coffee, doses) get a plain tick, never a reward.',
 native:'Rectangle masked by the key Circle with animated height; Path trim for the check; .sensoryFeedback(.success, trigger: done).'},
{id:'count',group:'Keys and logging',name:'Count: the next slot fills',status:'Built',try:'count',
 how:'Meals has one slot per meal set into the key. Each tap fills the next slot from the bottom. The figure in the status rolls up to the new number.',
 native:'HStack of slot Capsules; fill via .scaleEffect(y:, anchor: .bottom); figure with .contentTransition(.numericText()).'},
{id:'pour',group:'Keys and logging',name:'Amount: the tile pours',status:'Built',try:'pour',
 how:'Tap 250: the tile presses in, light pours up inside it and drains, and the level groove above fills with a springy overshoot.',
 native:'Tile ButtonStyle + PhaseAnimator([0, 1, 0]) for the pour; level width .animation(.spring(response: 0.5, dampingFraction: 0.6)).'},
{id:'hold',group:'Keys and logging',name:'Hold: the key sinks deeper, then options grow out of it',status:'Built',try:'hold',
 how:'Keep holding a key and it keeps sinking past normal pressed depth, like a key with a second stage. At the bottom you feel a tick and the options sheet grows out of the key itself.',
 feel:'Tick at the second stage.',
 native:'.onLongPressGesture(minimumDuration: 0.55, perform:, onPressingChanged:) driving depth over time; sheet via matchedGeometryEffect / .matchedTransitionSource + .navigationTransition(.zoom) (iOS 18).'},
{id:'leave',group:'Keys and logging',name:'Completed row melts into the page',status:'Built',try:'key',
 how:'After you finish something, the row holds still for 0.75 s (so no tap lands on a row that moved), then sinks flat into the page, the gap flows closed, and its light appears in Settled.',
 native:'Custom Transition (iOS 17 Transition protocol): removal = depth -> 0 then .frame(height: 0); withAnimation(.spring(response: 0.35, dampingFraction: 1)) after a 0.75 s Task.sleep.'},
{id:'undo',group:'Keys and logging',name:'Undo: the row rises back where it was',status:'Built',try:'key',
 how:'Undo in the toast reverses it exactly: the gap opens, the row rises out of the page in its old place, and the key comes back up.',
 native:'Same Transition, insertion = height opens then depth 0 -> 1 with .spring(response: 0.46, dampingFraction: 0.62).'},
{id:'toast',group:'Keys and logging',name:'Toast swells out like a blister',status:'Built',try:'toast',
 how:'The confirmation starts as a small bump above the tab bar, swells sideways into a slab, shows the running total and Undo, drains a groove for 4 s, then sinks back flat. A new toast replaces the old one by flattening it first.',
 native:'Overlay in .safeAreaInset(edge: .bottom); width + depth driven by one spring; TimelineView(.animation) for the draining groove.'},
{id:'onit',group:'Keys and logging',name:'On it stays pressed in',status:'Built',try:'onit',
 how:'A dated task can be marked On it: the word key stays pressed in until done, and its status says so. Tap again to lift it.',
 native:'Toggle with a custom ToggleStyle mapping isOn -> depth -1.'},
{id:'tok',group:'Keys and logging',name:'Later words are small keys',status:'Built',try:'tok',
 how:'In the Later hollow, each routine name is a small raised key. Tap and it presses in and its pit lights in its colour.',
 native:'Same ButtonStyle at a smaller scale inside a flow layout (Layout protocol).'},
{id:'live',group:'Keys and logging',name:'Session: the live bar lifts out of the row',status:'Built',try:'live',
 how:'Start Reading: a bar lifts out of the row and travels down to dock above the tab bar with the live time. End sinks it back into the row, which then melts into Settled.',
 native:'matchedGeometryEffect(id: "live-\\(id)") between the row and a .safeAreaInset(edge: .bottom) bar; Live Activity (ActivityKit) for the lock screen.'},

/* ---- appear and disappear ---- */
{id:'more',group:'Appearing and disappearing',name:'More: hidden rows rise one by one',status:'Built',try:'more',
 how:'Tap 2 more: the page opens a gap and each row rises out of it, one after another. Fewer melts them back.',
 native:'ForEach with the custom rise/melt Transition and .animation(.spring.delay(i * 0.09)).'},
{id:'dismiss',group:'Appearing and disappearing',name:'Hidden result: the hollow heals',status:'Built',try:'dismiss',
 how:'Tap the x on a reading: its content fades, the hollow fills back up to flat page, then the row of readings flows closed. Undo reopens the gap and sinks the hollow back in.',
 native:'Same Transition, with depth -1 -> 0 for wells.'},
{id:'arrive',group:'Appearing and disappearing',name:'New reading arrives: a hollow forms',status:'Built',try:'arrive',
 how:'When a walk comes in from the Watch, a gap opens at the front of the readings, a hollow presses into the page, and then the reading appears inside it.',
 native:'HKObserverQuery -> model insert; insertion Transition for wells (width opens, depth 0 -> -1, then content .opacity).'},
{id:'notnow',group:'Appearing and disappearing',name:'Not now: the suggestion melts',status:'Built',try:'notnow',
 how:'The suggestion sinks into the page and the space closes. No scolding, no badge left behind.',
 native:'Removal Transition as above.'},
{id:'filter',group:'Appearing and disappearing',name:'Filters: rows melt and rise',status:'Built',try:'filter',
 how:'In Routines, pick Body and the other rows melt away while the gap flows closed; pick All and they rise back.',
 native:'Filtered ForEach + the rise/melt Transition inside withAnimation.'},
{id:'reveal',group:'Appearing and disappearing',name:'A setting reveals more',status:'Built',try:'wheel',
 how:'Turning Remind me on opens the page and the time wheel rises into it. Turning it off melts it back.',
 native:'if reminder { TimeWheel().transition(.neuRise) } in a Form-free VStack.'},
{id:'loading',group:'Appearing and disappearing',name:'Loading: the surface breathes',status:'Built',try:'loading',
 how:'No shimmer. While Health syncs, a few faint ridges slowly rise and settle in a wave across the hollow. When data lands, they flatten into the real lines.',
 native:'PhaseAnimator over depth 0.05 <-> 0.55 with staggered delays; .redacted is not used.'},
{id:'empty',group:'Appearing and disappearing',name:'Empty (day one): the page melts, one invitation rises',status:'Built',try:'empty',
 how:'Everything flattens into the page, then a single hollow forms with Start with one thing and one key.',
 native:'Root view switches on model.isEmpty with the melt/rise Transition.'},
{id:'badge',group:'Appearing and disappearing',name:'Counts and badges',status:'Built',try:'held',
 how:'Bring back the held item: the row in the sheet closes, the sheet sinks back into the flag key, and the badge count rolls then sinks away.',
 native:'.contentTransition(.numericText()) + scale/opacity Transition on the badge.'},

/* ---- navigation ---- */
{id:'tabs',group:'Moving around',name:'Tabs: the well flows, screens melt and rise',status:'Built',try:'tabs',
 how:'The current tab is a pressed well. Pick another and the well flows across, leading edge first, like a dent travelling under the surface. The old screen melts flat and fades; the new one rises out of the page from the top down.',
 feel:'Selection tick.',
 native:'Custom tab bar (not TabView chrome): matchedGeometryEffect for the well with two edge springs; content swap with the rise Transition, delays by row index. .sensoryFeedback(.selection, trigger: tab).'},
{id:'push',group:'Moving around',name:'Open a routine: the row grows into the page',status:'Built',try:'push',
 how:'Tap a routine and its plateau rises a little higher, then spreads to fill the screen and settles flat, becoming the new page. Back shrinks it home. Swipe from the left edge to scrub it back by hand.',
 native:'NavigationStack + .matchedTransitionSource(id:in:) on the row and .navigationTransition(.zoom(sourceID:in:)) (iOS 18), which also gives the interactive edge swipe.'},
{id:'log',group:'Moving around',name:'Log key: the sheet grows out of +',status:'Built',try:'log',
 how:'The + key sinks and stays pressed in while the Log sheet grows out of it. Closing sinks the sheet back into the key, and the key springs up.',
 native:'.matchedTransitionSource on the key + .sheet with .navigationTransition(.zoom). Key depth bound to isPresented.'},
{id:'sheet',group:'Moving around',name:'Details grow out of the row',status:'Built',try:'details',
 how:'Tap a row and the row itself lifts and becomes the sheet. Where it was, a shallow dent stays in the page. The page behind flattens and dims; there is no black overlay. Drag the top down and the sheet shrinks back toward its row as you pull.',
 native:'.matchedTransitionSource(id: row.id) + .sheet(item:) { Details().navigationTransition(.zoom(sourceID:in:)) }; .presentationBackground(.surface); dent = source row depth -0.35 while presented.'},
{id:'report',group:'Moving around',name:'Report: a hollow fills and rises',status:'Built',try:'report',
 how:'Opening a reading runs the morph in reverse: the hollow fills up, passes through flat, and keeps rising into the report sheet.',

const MORPH_MD="# Meridian morph lab: one surface that deforms\n\nLive: https://bertonceljmark.github.io/meridian-app/morph/ (source: evolve/base7/neu-morph/src, `node src/build.js`).\nOwner of the arc and of static depth: Meridian studio. This lab owns motion: how things rise, flatten, sink and flow.\n\n## The idea in one paragraph\nNothing is a card laid on the page, and nothing slides over it. Every form carries ONE number, its height `--h`: +1 is a plateau risen out of the page, 0 is flat page, -1 is a well pressed into it. The shadows are computed from that number and from one light direction, so any form can travel continuously from raised, through flat, to pressed. Every interaction below is a change of that number, of a shape's outline, or of the light. A sheet is not a layer that slides up: the thing you touched rises and becomes the sheet, leaving a dent where it was, and sinks back into it when you close it.\n\n## Rules\n1. **Depth is state.** Raised: you can press it. Pressed in: chosen or done. Flat: not a control, or gone.\n2. **Whatever you touch is what changes.** A row becomes its sheet, a key becomes its options, the search disc becomes the field, a day cell becomes its day. No generic slide-up panel.\n3. **Things leave by melting, arrive by rising.** Removal: height to 0, then the gap flows closed. Arrival: the gap opens, then the form rises. Never a fade on its own.\n4. **No black overlay.** Behind a sheet the page flattens and dims; it recedes, it is not covered.\n5. **One light.** Shadows, highlights and parallax all come from one light (top left). Tilting the phone moves it; that is what makes the layers read as real depth.\n6. **Springs, not curves.** Every motion is a spring given as response and damping, the same numbers SwiftUI uses. Presses: 0.08 s down, spring back (0.28, 0.6). Rises: (0.46, 0.62). Melts: (0.34, 1.0). Sheets open (0.5, 0.8), close (0.4, 0.92).\n7. **Hold still before moving.** A finished row waits 0.75 s before it melts, so no tap lands on a row that moved (OP-04).\n8. **Reduce motion** turns every change instant; state still reads by depth, glyph and position.\n\n## The engine (for whoever ports it)\n- CSS: `@property --h {syntax:'<number>'}` per form; `--lx/--ly` (light) on the app root. Two shadow recipes, regions (`.f`) and keys (`.fk`), each a list of outer shadows scaled by max(h,0) and inset shadows scaled by max(-h,0), offsets multiplied by the light vector.\n- JS: one rAF loop sets each form's h = rest x fold(position on screen) x (1 - flick dip) x page energy x its own multiplier. Springs are integrated from (response, damping fraction).\n- **SwiftUI**: one `NeuDepth(h: Double, light: Light)` ViewModifier that draws the paired outer shadows when h > 0 and `.fill(.surface.shadow(.inner(...)))` when h < 0 (iOS 17 ShapeStyle inner shadows), interpolating through 0. Make h an `Animatable` value so springs drive it. Light is an @Observable from CoreMotion. Morphs use `.matchedTransitionSource` + `.navigationTransition(.zoom)` (iOS 18) and matchedGeometryEffect.\n\n## Every interactive and transitional element (47)\n\n### The surface\n\n**Scrolling folds the page** (built)\n- How: Rows rise out of the page as they come up from the tab bar and sink back flat as they reach the top. A fast flick flattens everything slightly, as if the surface were moving under your finger, and it all rises again when you stop.\n- Feel: No haptic. The motion is the feedback.\n- SwiftUI: ScrollView + .scrollTransition(.interactive) { c, phase in c.neuDepth(rest * (1 - abs(phase.value))) }. Flick dip: onScrollGeometryChange + onScrollPhaseChange (iOS 18, context.velocity) feeding one @State dip.\n\n**Day name folds into the top bar** (built)\n- How: As you scroll, the big day name shrinks and fades while a low ridge forms across the top of the page with the short title on it. Nothing slides in; the bar rises out of the same surface.\n- SwiftUI: onScrollGeometryChange(for: CGFloat.self) { $0.contentOffset.y } -> progress; bar = surface shape with .neuDepth(0.45 * progress); title .opacity(progress).\n\n**Results deepen as they reach the centre** (built)\n- How: In the swipeable results row, the reading in front is a full hollow; the ones at the edge are shallow and deepen as you swipe them in.\n- SwiftUI: Horizontal ScrollView + .scrollTargetBehavior(.viewAligned) + .scrollTransition(axis: .horizontal) driving depth.\n\n**Pull to sync** (built)\n- How: Pull Today down and a hollow forms above the header, deepening with your pull. Past the point of no return you feel a tick and the label turns to Release. A line of light sweeps inside the hollow while Health syncs, then it heals flat.\n- Feel: One tick at the threshold, one when done.\n- SwiftUI: Custom, not .refreshable (its spinner cannot be restyled): onScrollGeometryChange reads negative contentOffset; .sensoryFeedback(.impact(weight: .light), trigger: armed); HealthKit HKObserverQuery refresh. In this lab the pull only works on iPhone (Safari reports the bounce); Try it plays the sync.\n\n**Layers pop: light follows the phone** (built)\n- How: Every shadow and highlight is drawn from one light. Tilt the phone and the light swings: shadows lengthen on one side, highlights move, and raised things drift a few points against the page (parallax by height). Wells drift the other way. This is what makes it read as real depth rather than a drawing.\n- Feel: Subtle: at most 2-3 pt of drift; never on by default for motion-sensitive users.\n- SwiftUI: CoreMotion CMMotionManager.deviceMotion (attitude.roll/pitch) at 30 Hz, smoothed, into an @Observable Light {x, y}; NeuDepth reads it for shadow offsets and .offset(x: h * px). Respect accessibilityReduceMotion. On the web lab: turn on in You (asks motion permission on iPhone); a mouse moves the light on desktop.\n\n**Content passes under the tab bar** (built)\n- How: The tab bar is the same page divided by one groove. Rows reaching it flatten into it rather than sliding under a floating bar.\n- SwiftUI: Same scrollTransition as above; tab bar = .safeAreaInset(edge: .bottom) with the surface colour and a 2 pt groove.\n\n### Keys and logging\n\n**A key sinks and springs back** (built)\n- How: Touch down: the key sinks into the page in 80 ms and shrinks to 96 %. Release: it springs back up with a little overshoot. Raised means you can press it; pressed in means chosen or done.\n- Feel: Light impact on touch down: the mechanical-key moment.\n- SwiftUI: ButtonStyle reading configuration.isPressed -> depth -0.75, .scaleEffect(0.96), .animation(.spring(response: 0.28, dampingFraction: 0.6)); .sensoryFeedback(.impact(weight: .light), trigger: isPressed).\n\n**Done: the key stays in and fills** (built)\n- How: On a one-tap routine the key stays pressed in, its routine colour rises from the bottom like liquid, and the check draws over it. Its groove on the left of the row fills to the new level.\n- Feel: Success haptic for routines. Records (coffee, doses) get a plain tick, never a reward.\n- SwiftUI: Rectangle masked by the key Circle with animated height; Path trim for the check; .sensoryFeedback(.success, trigger: done).\n\n**Count: the next slot fills** (built)\n- How: Meals has one slot per meal set into the key. Each tap fills the next slot from the bottom. The figure in the status rolls up to the new number.\n- SwiftUI: HStack of slot Capsules; fill via .scaleEffect(y:, anchor: .bottom); figure with .contentTransition(.numericText()).\n\n**Amount: the tile pours** (built)\n- How: Tap 250: the tile presses in, light pours up inside it and drains, and the level groove above fills with a springy overshoot.\n- SwiftUI: Tile ButtonStyle + PhaseAnimator([0, 1, 0]) for the pour; level width .animation(.spring(response: 0.5, dampingFraction: 0.6)).\n\n**Hold: the key sinks deeper, then options grow out of it** (built)\n- How: Keep holding a key and it keeps sinking past normal pressed depth, like a key with a second stage. At the bottom you feel a tick and the options sheet grows out of the key itself.\n- Feel: Tick at the second stage.\n- SwiftUI: .onLongPressGesture(minimumDuration: 0.55, perform:, onPressingChanged:) driving depth over time; sheet via matchedGeometryEffect / .matchedTransitionSource + .navigationTransition(.zoom) (iOS 18).\n\n**Completed row melts into the page** (built)\n- How: After you finish something, the row holds still for 0.75 s (so no tap lands on a row that moved), then sinks flat into the page, the gap flows closed, and its light appears in Settled.\n- SwiftUI: Custom Transition (iOS 17 Transition protocol): removal = depth -> 0 then .frame(height: 0); withAnimation(.spring(response: 0.35, dampingFraction: 1)) after a 0.75 s Task.sleep.\n\n**Undo: the row rises back where it was** (built)\n- How: Undo in the toast reverses it exactly: the gap opens, the row rises out of the page in its old place, and the key comes back up.\n- SwiftUI: Same Transition, insertion = height opens then depth 0 -> 1 with .spring(response: 0.46, dampingFraction: 0.62).\n\n**Toast swells out like a blister** (built)\n- How: The confirmation starts as a small bump above the tab bar, swells sideways into a slab, shows the running total and Undo, drains a groove for 4 s, then sinks back flat. A new toast replaces the old one by flattening it first.\n- SwiftUI: Overlay in .safeAreaInset(edge: .bottom); width + depth driven by one spring; TimelineView(.animation) for the draining groove.\n\n**On it stays pressed in** (built)\n- How: A dated task can be marked On it: the word key stays pressed in until done, and its status says so. Tap again to lift it.\n- SwiftUI: Toggle with a custom ToggleStyle mapping isOn -> depth -1.\n\n**Later words are small keys** (built)\n- How: In the Later hollow, each routine name is a small raised key. Tap and it presses in and its pit lights in its colour.\n- SwiftUI: Same ButtonStyle at a smaller scale inside a flow layout (Layout protocol).\n\n**Session: the live bar lifts out of the row** (built)\n- How: Start Reading: a bar lifts out of the row and travels down to dock above the tab bar with the live time. End sinks it back into the row, which then melts into Settled.\n- SwiftUI: matchedGeometryEffect(id: \"live-\\(id)\") between the row and a .safeAreaInset(edge: .bottom) bar; Live Activity (ActivityKit) for the lock screen.\n\n### Appearing and disappearing\n\n**More: hidden rows rise one by one** (built)\n- How: Tap 2 more: the page opens a gap and each row rises out of it, one after another. Fewer melts them back.\n- SwiftUI: ForEach with the custom rise/melt Transition and .animation(.spring.delay(i * 0.09)).\n\n**Hidden result: the hollow heals** (built)\n- How: Tap the x on a reading: its content fades, the hollow fills back up to flat page, then the row of readings flows closed. Undo reopens the gap and sinks the hollow back in.\n- SwiftUI: Same Transition, with depth -1 -> 0 for wells.\n\n**New reading arrives: a hollow forms** (built)\n- How: When a walk comes in from the Watch, a gap opens at the front of the readings, a hollow presses into the page, and then the reading appears inside it.\n- SwiftUI: HKObserverQuery -> model insert; insertion Transition for wells (width opens, depth 0 -> -1, then content .opacity).\n\n**Not now: the suggestion melts** (built)\n- How: The suggestion sinks into the page and the space closes. No scolding, no badge left behind.\n- SwiftUI: Removal Transition as above.\n\n**Filters: rows melt and rise** (built)\n- How: In Routines, pick Body and the other rows melt away while the gap flows closed; pick All and they rise back.\n- SwiftUI: Filtered ForEach + the rise/melt Transition inside withAnimation.\n\n**A setting reveals more** (built)\n- How: Turning Remind me on opens the page and the time wheel rises into it. Turning it off melts it back.\n- SwiftUI: if reminder { TimeWheel().transition(.neuRise) } in a Form-free VStack.\n\n**Loading: the surface breathes** (built)\n- How: No shimmer. While Health syncs, a few faint ridges slowly rise and settle in a wave across the hollow. When data lands, they flatten into the real lines.\n- SwiftUI: PhaseAnimator over depth 0.05 <-> 0.55 with staggered delays; .redacted is not used.\n\n**Empty (day one): the page melts, one invitation rises** (built)\n- How: Everything flattens into the page, then a single hollow forms with Start with one thing and one key.\n- SwiftUI: Root view switches on model.isEmpty with the melt/rise Transition.\n\n**Counts and badges** (built)\n- How: Bring back the held item: the row in the sheet closes, the sheet sinks back into the flag key, and the badge count rolls then sinks away.\n- SwiftUI: .contentTransition(.numericText()) + scale/opacity Transition on the badge.\n\n### Moving around\n\n**Tabs: the well flows, screens melt and rise** (built)\n- How: The current tab is a pressed well. Pick another and the well flows across, leading edge first, like a dent travelling under the surface. The old screen melts flat and fades; the new one rises out of the page from the top down.\n- Feel: Selection tick.\n- SwiftUI: Custom tab bar (not TabView chrome): matchedGeometryEffect for the well with two edge springs; content swap with the rise Transition, delays by row index. .sensoryFeedback(.selection, trigger: tab).\n\n**Open a routine: the row grows into the page** (built)\n- How: Tap a routine and its plateau rises a little higher, then spreads to fill the screen and settles flat, becoming the new page. Back shrinks it home. Swipe from the left edge to scrub it back by hand.\n- SwiftUI: NavigationStack + .matchedTransitionSource(id:in:) on the row and .navigationTransition(.zoom(sourceID:in:)) (iOS 18), which also gives the interactive edge swipe.\n\n**Log key: the sheet grows out of +** (built)\n- How: The + key sinks and stays pressed in while the Log sheet grows out of it. Closing sinks the sheet back into the key, and the key springs up.\n- SwiftUI: .matchedTransitionSource on the key + .sheet with .navigationTransition(.zoom). Key depth bound to isPresented.\n\n**Details grow out of the row** (built)\n- How: Tap a row and the row itself lifts and becomes the sheet. Where it was, a shallow dent stays in the page. The page behind flattens and dims; there is no black overlay. Drag the top down and the sheet shrinks back toward its row as you pull.\n- SwiftUI: .matchedTransitionSource(id: row.id) + .sheet(item:) { Details().navigationTransition(.zoom(sourceID:in:)) }; .presentationBackground(.surface); dent = source row depth -0.35 while presented.\n\n**Report: a hollow fills and rises** (built)\n- How: Opening a reading runs the morph in reverse: the hollow fills up, passes through flat, and keeps rising into the report sheet.\n- SwiftUI: Same zoom transition; depth interpolated from -1 to +1.25 in the presented view.\n\n**Search: the key spreads into a field** (built)\n- How: The search disc sinks and spreads across the header into a pressed field, the page melts, and results rise beneath it. Cancel draws it back into the disc.\n- SwiftUI: matchedGeometryEffect between the disc and a TextField container, depth +0.6 -> -1; .searchable is not used (its chrome cannot morph).\n\n**Small sheets from header keys** (built)\n- How: Context and Held open from their small keys the same way: the key stays pressed in while its sheet is out.\n- SwiftUI: As the Log key.\n\n**A day in the month grows into its sheet** (built)\n- How: In Time, each day is a small hollow. Tap one and it fills and rises into that day.\n- SwiftUI: LazyVGrid cells with .matchedTransitionSource; .sheet with .navigationTransition(.zoom).\n\n**Drag to dismiss scrubs the morph** (built)\n- How: Dragging a sheet down does not just slide it: it runs the morph backwards under your finger, shrinking it toward where it came from. Let go past the line and it finishes; otherwise it springs back up.\n- SwiftUI: Built into the zoom transition interactive dismissal (iOS 18).\n\n### Controls\n\n**Switch: a bead flows under the surface** (built)\n- How: The knob is a raised bead. Flip it and it stretches as it travels, then settles, while the colour fills in behind it like liquid. Off drains it.\n- Feel: Tick on settle.\n- SwiftUI: Custom ToggleStyle: Capsule well + bead Capsule whose width animates 24 -> 34 -> 24 via PhaseAnimator while offset springs; fill = Capsule width animation.\n\n**Segmented choice: the well flows** (built)\n- How: The chosen option is a pressed well. Pick another and it flows there, leading edge first, the same motion as the tab bar.\n- SwiftUI: HStack of buttons + one well with matchedGeometryEffect; two springs for the edges (or a single .spring with a stretch PhaseAnimator).\n\n**Stepper: the number rolls** (built)\n- How: The +/- keys press like any key; the number rolls up or down out of a small window.\n- SwiftUI: .contentTransition(.numericText(countsDown:)) + .sensoryFeedback(.increase/.decrease).\n\n**Time wheel: the hour sits in a well** (built)\n- How: A short wheel with one pressed band across the middle. The chosen hour sits in the well; neighbours fade and lift away from it. A tick for every hour you pass.\n- Feel: Selection tick per detent: the most mechanical-key moment in the app.\n- SwiftUI: ScrollView + .scrollTargetBehavior(.viewAligned) + .scrollPosition(id:) and .scrollTransition per row; .sensoryFeedback(.selection, trigger: hour). (Picker(.wheel) cannot be restyled to match.)\n\n**Colour: the chosen swatch sinks, the page changes light** (built)\n- How: The old swatch rises back up as the new one sinks in, and the routine page carries its new colour.\n- SwiftUI: Buttons with depth bound to selection; routine hue in the environment so dependants animate.\n\n**Chips: raised until chosen** (built)\n- How: Options like times or contexts are small raised keys; the chosen one stays pressed in with a dot, so the state reads without colour.\n- SwiftUI: Same ButtonStyle with a selected flag.\n\n**Text field: a well ansition(.numericText()); ActivityKit for the session.\n\n\n## Taste calls (logged, not asked)\n- **The tab bar does not hide on scroll.** Hiding it saves 84 pt but moves the one stable anchor; for an ADHD user a fixed home base beats the extra space.\n- **No black scrim.** A dimmed, flattened page reads as one surface; a dark overlay reads as a layer on top.\n- **Parallax is capped at 2-3 pt.** More starts to look like a 2013 iOS 7 wallpaper effect, which is the gimmick Mark rejects.\n- **Loading never shimmers.** Shimmer is the most recognisable template tell; the breathing ridge belongs to this surface.\n- **No system alert or confirmation dialog anywhere.** Their chrome cannot morph; everything is undoable or uses a two-stage key.\n\n## Limits of the web lab\n- The arc is a flat placeholder; the studio owns it.\n- Haptics: real ticks only on iPhone with iOS 18 or later, through the Safari switch trick; one strength only. Native has the full map.\n- Tilt light asks for motion permission on iPhone (You > Light follows the phone).\n- Animated box-shadows are heavier on the web than native; if it stutters on an older phone, that is the web, not the design.\n";

<script>
'use strict';
/* Meridian morph lab. One surface; everything is a change of --h on it. */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
let RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));

/* ---------- haptics ----------
   iOS 18+ Safari gives a real system tick when a <input switch> is toggled.
   We toggle a hidden one from inside user gestures. Elsewhere: vibrate if present. */
let HAPT=true;
const hapL=document.createElement('label');hapL.setAttribute('aria-hidden','true');
hapL.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0';
const hapI=document.createElement('input');hapI.type='checkbox';hapI.setAttribute('switch','');hapI.tabIndex=-1;hapL.appendChild(hapI);
hapL.addEventListener('click',e=>e.stopPropagation());document.body.appendChild(hapL);
function tick(){if(!HAPT)return;try{if(navigator.vibrate)navigator.vibrate(8);else hapL.click()}catch(e){}}

/* ---------- springs (response in s, damping fraction), same parameters as SwiftUI .spring(response:dampingFraction:) ---------- */
const sp=(resp=.42,z=.8)=>({k:(2*Math.PI/resp)**2,c:4*Math.PI*z/resp});
function spring(from,to,cfg,on,done){
  if(RM){on(to);done&&done();return{stop(){}}}
  let x=from,v=cfg.v||0,last=null,stopped=false;const span=Math.max(Math.abs(to-from),.02);
  function f(now){
    if(stopped)return;if(last==null)last=now;const dt=Math.min(.034,(now-last)/1000);last=now;
    for(let i=0;i<4;i++){const h=dt/4,a=-cfg.k*(x-to)-cfg.c*v;v+=a*h;x+=v*h}
    if(Math.abs(x-to)<span*.002&&Math.abs(v)<span*.03){on(to);done&&done();return}
    on(x);requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
  return{stop(){stopped=true},get v(){return v}};
}

/* ---------- the surface engine ----------
   Every form with data-b (its resting height) is re-evaluated each frame:
   h = rest x fold(position) x (1 - speed dip) x page energy x its own multiplier.
   fold: things rise out of the page from under the tab bar and sink back

/* height collapse / expand: the gap flows closed, or opens */
function collapse(el,dur=340){return new Promise(res=>{
  if(RM){el.style.display='none';return res()}

  Object.assign(el.style,{height:h+'px',overflow:'hidden',marginBottom:cs.marginBottom,paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,flexBasis:el.offsetWidth+'px'});
  el.offsetHeight;

  if(el.dataset.horiz){Object.assign(el.style,{flexBasis:'0px',minWidth:'0px',paddingLeft:'0px',paddingRight:'0px',marginRight:'-14px',opacity:'0'})}
  else Object.assign(el.style,{height:'0px',minHeight:'0px',marginBottom:'0px',paddingTop:'0px',paddingBottom:'0px',opacity:'0'});

})}
function expand(el,dur=360){return new Promise(res=>{
  el.style.display='';el.style.transition='none';

    Object.assign(el.style,{flexBasis:'0px',minWidth:'0px',paddingLeft:'0px',paddingRight:'0px',marginRight:'-14px',opacity:'0',overflow:'hidden'});el.offsetHeight;
    el.style.transition=`flex-basis ${dur}ms var(--ease),padding ${dur}ms var(--ease),margin ${dur}ms var(--ease),opacity ${dur}ms`;
    Object.assign(el.style,{flexBasis:'',paddingLeft:'',paddingRight:'',marginRight:'',opacity:''});

    el.style.transition=`height ${dur}ms var(--ease),margin ${dur}ms var(--ease),padding ${dur}ms var(--ease),opacity ${dur}ms`;
    Object.assign(el.style,{height:H+'px',marginBottom:mb,paddingTop:pt,paddingBottom:pb,opacity:'1'});

const L={x:1,y:1,tx:1,ty:1,on:false};
function lightTo(tx,ty){L.tx=clamp(tx,-.3,2.1);L.ty=clamp(ty,-.3,2.1);if(!L.raf)L.raf=requestAnimationFrame(lightStep)}
function lightStep(){L.raf=0;L.x+=(L.tx-L.x)*.14;L.y+=(L.ty-L.y)*.14;
  app.style.setProperty('--lx',L.x.toFixed(3));app.style.setProperty('--ly',L.y.toFixed(3));
  app.style.setProperty('--px',((1-L.x)*2.4).toFixed(2));app.style.setProperty('--py',((1-L.y)*2.4).toFixed(2));

  if(o.kind==='sheet'){inner.style.width=W+'px';inner.classList.add('sheetin');app.appendChild(mo);const ch=inner.scrollHeight;const top=Math.max(H*.12,H-ch-24);D={x:0,y:top,w:W,h:H-top+40,r:34};inner.style.height=(H-top)+'px'}

  const screen=cur();let t=0,s=null;

    mo.style.left=lerp(S.x,D.x,c)+'px';mo.style.top=lerp(S.y,D.y,c)+'px';mo.style.width=Math.max(8,lerp(S.w,D.w,c))+'px';mo.style.height=Math.max(8,lerp(S.h,D.h,c))+'px';
    mo.style.borderRadius=lerp(S.r,D.r,clamp(c))+'px';mo.style.setProperty('--h',hFn(c).toFixed(3));

    close(v=0){if(ctl.closing)return;ctl.closing=true;o.onClosing&&o.onClosing(ctl);inner.style.pointerEvents='none';catcher&&catcher.remove();
      const done=()=>{mo.remove();o.src._lift=false;o.src.classList.remove('lifting','held');screen.style.opacity='';if(o.dim)G.E=1;req();o.onClosed&&o.onClosed()};
