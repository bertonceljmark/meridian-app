<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1019">
<title>Meridian Today: Light Studies</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/200.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.0.20/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.0.15/400.css">
<style>
:root{
  --bg:#0B1019; --rule:rgba(255,255,255,.085);
  --t1:#EEF0F4; --t2:#8E97A8; --t3:#566074; --now:#FFF1DC;
  --safe-t:max(env(safe-area-inset-top),14px); --safe-b:max(env(safe-area-inset-bottom),10px);
  --row:44px;
  --hero:calc(var(--safe-t) + var(--row) + 292px);
  --sans:"IBM Plex Sans",-apple-system,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
body.full{--row:0px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t1);height:100%;overflow-x:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
.screen{position:relative;min-height:100%;padding-bottom:calc(var(--safe-b) + 84px)}
#hero{position:absolute;left:0;top:0;width:100%;height:var(--hero);display:block;touch-action:manipulation}

/* prototype chrome: idea switcher + data toggle (not part of the design) */
.proto{position:absolute;z-index:6;top:calc(var(--safe-t) + 2px);left:12px;right:12px;display:flex;gap:6px;align-items:center}
.proto .seg{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;background:rgba(18,23,34,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--rule);border-radius:99px;padding:3px}
.proto .seg::-webkit-scrollbar{display:none}
.proto button{all:unset;cursor:pointer;font:500 11.5px/1 var(--sans);color:var(--t2);padding:8px 8px;border-radius:99px;white-space:nowrap}
.proto button.on{background:#E9ECF2;color:#0B1019}
.proto .solo{background:rgba(18,23,34,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--rule);padding:9px 10px}
body.full .proto .seg{display:none}
body.full .proto{left:auto;right:12px;opacity:.55}
body.shot.full .proto{display:none}

.head{position:relative;z-index:2;padding:calc(var(--safe-t) + var(--row) + 6px) 20px 0;pointer-events:none}
.head .k{font:400 13px/1.2 var(--sans);color:var(--t2);letter-spacing:.01em}
.head h1{font:500 30px/1.15 var(--sans);letter-spacing:-.02em;margin-top:2px}
.axis{position:absolute;left:0;width:100%;top:calc(var(--hero) - 34px);height:16px;z-index:2;pointer-events:none;transition:opacity .3s}
.axis span{position:absolute;transform:translateX(-50%);font:400 10.5px/1 var(--mono);color:var(--t3)}
.axis span.now{color:var(--now)}

.below{position:relative;z-index:2;margin-top:calc(var(--hero) - var(--safe-t) - var(--row) - 50px);padding:0 20px}
/* the readout: one big figure, one fact beside it, a plain sentence of news */
.readout{display:grid;grid-template-columns:auto 1fr auto;align-items:end;column-gap:14px}
.readout .n{font:200 76px/.8 var(--sans);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.readout .lab{font:400 14px/1.25 var(--sans);color:var(--t2);padding-bottom:2px}
.readout .last{text-align:right;padding-bottom:2px}
.readout .last .t{font:400 20px/1 var(--mono);letter-spacing:-.02em}
.readout .last .w{font:400 13px/1.3 var(--sans);color:var(--t2);margin-top:5px}
.readout .last.flash .t{color:var(--now)}
.news{font:400 14px/1.4 var(--sans);color:var(--t2);margin-top:16px}
.news:empty{display:none}
.news b{font-weight:500;color:var(--t1)}
/* open items: a ruled table, not cards. time | name | a real key */
.open{margin-top:22px;border-top:1px solid var(--rule)}
.open h2{font:400 12px/1 var(--sans);color:var(--t3);letter-spacing:.02em;padding:14px 0 4px}
.it{display:grid;grid-template-columns:82px 1fr auto;align-items:center;min-height:62px;border-bottom:1px solid var(--rule)}
.it .tm{font:400 14px/1.2 var(--mono);color:var(--t2)}
.it .tm small{display:block;font-size:11px;color:var(--t3);margin-top:3px}
.it .nm{font:400 19px/1.2 var(--sans);letter-spacing:-.01em}
.key{all:unset;cursor:pointer;position:relative;width:58px;height:38px;border-radius:9px;
  background:linear-gradient(180deg,#252c3a 0%,#1b2130 100%);
  box-shadow:0 3px 0 #06080d,0 6px 12px -4px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.35);
  transition:transform .07s ease-out,box-shadow .07s ease-out;display:flex;align-items:center;justify-content:center;gap:7px;
  font:500 12px/1 var(--sans);color:var(--t2)}
.key i{width:5px;height:5px;border-radius:50%;background:#323a4b;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);transition:background .25s,box-shadow .25s}
.key:active,.key.down{transform:translateY(3px);box-shadow:0 0 0 #06080d,0 2px 4px -2px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.35)}
.key.latched{transform:translateY(2px);box-shadow:0 1px 0 #06080d,0 3px 6px -3px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);color:var(--t1)}
.key.latched i{background:#ffe6c2;box-shadow:0 0 8px 1px rgba(255,214,160,.55)}
.it.done .nm,.it.done .tm{color:var(--t3)}
.none{font:400 15px/1.4 var(--sans);color:var(--t2);padding:16px 0;border-bottom:1px solid var(--rule)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 26px calc(var(--safe-b) + 6px);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(11,16,25,0),rgba(11,16,25,.96) 34%)}
.tabs a{font:500 10px/1 var(--sans);color:var(--t3);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:50px}
.tabs a.on{color:var(--t1)}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.tabs .logk{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#fff,#dde2ea);box-shadow:0 8px 20px -6px rgba(0,0,0,.7),inset 0 -2px 0 rgba(0,0,0,.12);display:grid;place-items:center}
.tabs .logk svg{width:20px;height:20px;stroke:#0B1019;stroke-width:2.2;fill:none}
</style>
</head>
<body>
<div class="screen">
  <canvas id="hero" role="img" aria-label=""></canvas>
  <div class="proto" id="proto">
    <div class="seg" id="seg"></div>
    <button class="solo" id="data" type="button">Different data</button>
    <button class="solo" id="full" type="button">Full</button>
  </div>
  <header class="head">
    <div class="k" id="kicker">Thursday 22 October</div><h1>Today</h1>
  </header>
  <div class="axis" id="axis"></div>
  <main class="below">
    <div class="readout">
      <div class="n" id="num">8</div>
      <div class="lab" id="unit">logged<br>today</div>
      <div class="last" id="last"><div class="t"></div><div class="w"></div></div>
    </div>
    <p class="news" id="news"></p>
    <section class="open"><h2 id="openh">Still open</h2><div id="rows"></div></section>
  </main>
  <nav class="tabs">
    <a class="on" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>Today</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>Routines</a>
    <span class="logk"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span>
    <a href="#"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16"/></svg>Time</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>You</a>
  </nav>
</div>

<script>
/* ---------------------------------------------------------------
   DATA: one source feeds every idea, the readout, the open list and
   the accessibility text. All routines equal; medication quieter.
   --------------------------------------------------------------- */
const RT = {
  meditation:{c:'#9fc2ff',name:'Meditation'}, water:{c:'#5fd0e0',name:'Water'}, meal:{c:'#ffb76a',name:'Meal'},
  sketching:{c:'#ff8576',name:'Sketching'}, reading:{c:'#c3a2ff',name:'Reading'}, run:{c:'#ff8a5c',name:'Run'},
  stretch:{c:'#7fe8a8',name:'Stretch'}, journaling:{c:'#8f9cff',name:'Journaling'}, medication:{c:'#c9ced8',name:'Medication',neutral:true},
};
const hm=(h,m)=>h+m/60;
const DAYS=[
 {kicker:'Thursday 22 October',now:hm(14,20),news:'Yesterday you ran <b>6.2 km</b>, your longest this month.',
  logs:[['meditation',hm(7,10),12,'min'],['water',hm(8,32),300,'ml'],['meal',hm(8,45),1,'breakfast'],['medication',hm(9,0),1,'dose'],
        ['sketching',hm(10,0),25,'min'],['water',hm(11,15),250,'ml'],['meal',hm(12,40),1,'lunch'],['water',hm(13,50),300,'ml']],
  next:[['stretch',hm(18,0),hm(19,0)],['reading',hm(21,0),hm(22,30)],['water',null,hm(22,0)]]},
 {kicker:'Sunday 18 October',now:hm(11,5),news:'',
  logs:[['water',hm(9,40),250,'ml']],
  next:[['meal',hm(12,0),hm(14,0)],['reading',hm(21,0),hm(23,0)]]},
 {kicker:'Tuesday 20 October',now:hm(21,40),news:'You slept <b>7 h 40</b> last night.',
  logs:[['meditation',hm(6,50),15,'min'],['run',hm(7,30),34,'min'],['water',hm(8,10),400,'ml'],['medication',hm(8,15),1,'dose'],['meal',hm(8,30),1,'breakfast'],
        ['water',hm(10,5),250,'ml'],['water',hm(10,40),250,'ml'],['water',hm(10,55),200,'ml'],['meal',hm(12,30),1,'lunch'],['sketching',hm(15,0),40,'min'],
        ['water',hm(15,50),300,'ml'],['meal',hm(18,45),1,'dinner'],['stretch',hm(19,10),15,'min'],['medication',hm(20,0),1,'dose'],['reading',hm(21,0),30,'min'],['journaling',hm(21,15),10,'min']],
  next:[]},
 {kicker:'Saturday 17 October',now:hm(17,30),news:'',
  logs:[['meal',hm(10,30),1,'brunch'],['water',hm(10,45),500,'ml'],['reading',hm(11,0),50,'min'],['sketching',hm(14,10),90,'min'],['water',hm(16,0),300,'ml']],
  next:[['meal',hm(18,30),hm(20,30)],['stretch',hm(20,0),hm(21,0)]]},
];
const IDEAS=[
  {id:'reeds', name:'Reeds',  axis:true},
  {id:'aurora',name:'Aurora', axis:true},
  {id:'ink',   name:'Ink',    axis:true, tint:.75},
  {id:'focus', name:'Focus',  axis:true},
];
const T0=5, T1=24.5;
const fmt=t=>{const h=Math.floor(t+1e-6),m=Math.round((t-h)*60);return String(h%24).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const amountEq=l=>l.u==='min'?l.v:l.u==='ml'?l.v/20:l.r==='medication'?8:20;
const amountTxt=l=>l.u==='min'?l.v+' min':l.u==='ml'?l.v+' ml':l.u==='dose'?'taken':l.u;
const describe=l=>`${fmt(l.t)} ${RT[l.r].name}, ${amountTxt(l)}`;
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255).map(v=>Math.pow(v,2.2));
const WARM=hex('#fff0dc');
const Q=new URLSearchParams(location.search);
const SHOT=Q.has('shot');
const TINT=+(Q.get('tint')||.45);
const tintK=(rt,K)=>{const c=hex(rt.c), k=rt.neutral?0:K; return c.map((v,i)=>WARM[i]*(1-k)+v*k);};
const tint=rt=>{const c=hex(rt.c), k=rt.neutral?0:TINT; return c.map((v,i)=>WARM[i]*(1-k)+v*k);};
let ideaIx=Math.max(0,Math.min(IDEAS.length-1,(+(Q.get('idea')||1))-1));
let dayIx=+(Q.get('sample')||0)%DAYS.length;
if(Q.has('full'))document.body.classList.add('full');
if(SHOT)document.body.classList.add('shot');
let day, logs, nowT, lights=[];

function loadDay(i,animate){
  day=DAYS[i]; nowT=day.now;
  logs=day.logs.map(([r,t,v,u])=>({r,t,v,u}));
  const now=performance.now();
  lights.forEach(L=>{L.dying=now});
  lights=lights.filter(L=>animate&&L.i>0.01).concat(logs.map((l,k)=>mkLight(l, animate? now+260+k*55 : -1e9)));
  renderText(); kick();
}
function mkLight(l,born){
  const eq=Math.min(amountEq(l),90);
  return {log:l,t:l.t,dur:l.u==='min'?l.v/60:0,eq:amountEq(l),
    hT:0.30+0.62*Math.sqrt(eq/90), iT:RT[l.r].neutral?0.55:1.0, c:tint(RT[l.r]), raw:RT[l.r],
    seed:Math.abs(Math.sin(l.t*127.1+eq*3.7)*43758.5453)%1, born, i:0};
}
function setLast(t,w,flash){
  const el=document.getElementById('last'); el.querySelector('.t').textContent=t; el.querySelector('.w').textContent=w;
  el.classList.toggle('flash',!!flash);
}
let lastTimer;
function lastDefault(){
  const past=logs.filter(l=>l.t<=nowT+1e-6), last=past.at(-1);
  if(last)setLast(fmt(last.t),RT[last.r].name+', last logged'); else setLast('—','nothing yet');
}
function showLog(l){ setLast(fmt(l.t),RT[l.r].name+', '+amountTxt(l),true); clearTimeout(lastTimer); lastTimer=setTimeout(lastDefault,3500); }
function renderText(){
  const n=logs.length;
  document.getElementById('kicker').textContent=day.kicker;
  document.getElementById('num').textContent=n;
  document.getElementById('news').innerHTML=day.news;
  lastDefault();
  const rows=document.getElementById('rows'); rows.innerHTML='';
  document.getElementById('openh').style.display=day.next.length?'':'none';
  if(!day.next.length) rows.innerHTML='<p class="none">Nothing else planned. The evening is yours.</p>';
  day.next.forEach(([r,a,b])=>{
    const el=document.createElement('div'); el.className='it';
    const tm=a==null?`now<small>to ${fmt(b)}</small>`:`${fmt(a)}<small>to ${fmt(b)}</small>`;
    el.innerHTML=`<div class="tm">${tm}</div><div class="nm">${RT[r].name}</div><button class="key" aria-label="Log ${RT[r].name}"><i></i><span>Log</span></button>`;
    const k=el.querySelector('.key');
    k.addEventListener('pointerdown',()=>{k.classList.add('down'); if(navigator.vibrate)navigator.vibrate(6);});
    k.addEventListener('pointerup',()=>k.classList.remove('down'));
    k.addEventListener('pointerleave',()=>k.classList.remove('down'));
    k.onclick=()=>{ if(k.classList.contains('latched'))return; k.classList.add('latched'); k.querySelector('span').textContent='Done'; el.classList.add('done'); logNow(r); };
    rows.appendChild(el);
  });
  renderAxis();
  document.getElementById('hero').setAttribute('aria-label',`${n} logged today. `+logs.map(describe).join('; '));
}
function renderAxis(){
  const idea=IDEAS[ideaIx], ax=document.getElementById('axis'); ax.innerHTML=''; ax.style.opacity=idea.axis?1:0;
  [6,9,12,15,18,21,24].forEach(h=>{ if(Math.abs(h-nowT)<1.1)return; const s=document.createElement('span'); s.style.left=((h-T0)/(T1-T0)*100)+'%'; s.textContent=String(h).padStart(2,'0'); ax.appendChild(s); });
  const s=document.createElement('span'); s.className='now'; s.style.left=((nowT-T0)/(T1-T0)*100)+'%'; s.textContent=fmt(nowT); ax.appendChild(s);
}
function logNow(r){
  const l={r,t:nowT,v:r==='water'?250:20,u:r==='water'?'ml':(r==='meal'?'meal':'min')};
  logs.push(l); lights.push(mkLight(l,performance.now()+80));
  document.getElementById('num').textContent=logs.length;
  showLog(l); kick();
}

/* ---------------------------------------------------------------
   SHADERS. One full-width fragment pass per idea; the same uniforms
   for all. Native: the same code as a Metal [[stitchable]] function
   used with SwiftUI .layerEffect / .colorEffect (iOS 17), or an MTKView.
   uL / uM meaning per idea is documented beside each scene().
   --------------------------------------------------------------- */
const MAXL=24;
const HEAD=`precision highp float;
uniform vec2 uRes; uniform float uDpr,uTime,uNowX,uBase,uTop,uReed;
uniform vec4 uL[${MAXL}]; uniform vec4 uM[${MAXL}]; uniform vec3 uC[${MAXL}];
uniform int uN; uniform vec3 uBg;
float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int k=0;k<4;k++){s+=a*noise(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
`;
const SCENES={
/* 1. REEDS: light behind reeded glass. uL=(x, halfwidth, height, intensity). One reed = half an hour. */
reeds:`
vec3 field(float x,float y,float bx){
  vec3 acc=vec3(0.);
  for(int i=0;i<${MAXL};i++){ if(i>=uN)break; vec4 L=uL[i]; if(L.w<.002)continue;
    float d=max(0.,abs(x-L.x)-L.y), s=sqrt(9.+bx*bx);
    float g=exp(-.5*d*d/(s*s)), halo=exp(-.5*d*d/(9.*s*s));
    float h=L.z, top=uBase-h, soft=8.+h*.3;
    float col=smoothstep(top-soft,top+soft,y)*step(y,uBase);
    float grad=.18+.82*pow(clamp((y-top)/max(h,1.),0.,1.),2.2);
    float core=exp(-pow((y-uBase)/5.,2.));
    float refl=step(uBase,y)*exp(-(y-uBase)/14.)*.32;
    acc+=uC[i]*L.w*(col*grad*g+core*g*.9+refl*g+halo*.03*smoothstep(top-60.,uBase,y)*exp(-max(0.,y-uBase)/10.));
  }
  return acc;
}
vec3 scene(float x,float y){
  float w=uReed, fi=floor(x/w), u=(x-(fi+.5)*w)/(.5*w), cx=(fi+.5)*w, M=.9, bx=w*.3;
  float sh=sin(y*.045+uTime*.6+fi*1.9)*.6*SHIM;
  vec3 c;
  c.r=field(cx-u*w*M*1.06+sh,y,bx).r; c.g=field(cx-u*w*M+sh,y,bx).g; c.b=field(cx-u*w*M*.94+sh,y,bx).b;
  c+=field(x,y,34.)*.08*smoothstep(uTop-40.,uBase,y);
  float au=abs(u); c*=mix(.4,1.,smoothstep(1.,.72,au));
  vec3 local=field(cx,y,w*2.); float lum=dot(local,vec3(.3,.5,.2));
  float calm=smoothstep(uTop-50.,uTop+70.,y);
  float spec=exp(-pow((u+.42)/.10,2.));
  c+=spec*(vec3(.75,.82,1.)*(.022*exp(-(y-uTop)/160.)+.008)*calm+local*.18);
  c+=pow(au,6.)*(.006*calm+lum*.05)*vec3(.8,.85,1.);
  c*=mix(1.,.78,smoothstep(uNowX-2.,uNowX+6.,x));
  return c;
}`,
/* 2. AURORA: each log a curtain of light standing on the horizon at its hour; taller = more.
      uL=(x, halfwidth, height, intensity), uM.z = seed. Reflected in still water below. */
aurora:`
vec3 aur(float x,float y){
  vec3 acc=vec3(0.); float t=uTime*.04;
  for(int i=0;i<${MAXL};i++){ if(i>=uN)break; vec4 L=uL[i]; if(L.w<.002)continue;
    float h=max(L.z,1.), up=max(0.,uBase-y), sd=uM[i].z*6.2831;
    float k=min(up/h,1.2);
    float sway=up*.05*sin(sd+t*2.+up*.02)+2.5*sin(y*.03+sd+t*4.)*k;
    float d=max(0.,abs(x-L.x-sway)-L.y);
    float wdt=2.6+up*.035;
    float g=exp(-.5*d*d/(wdt*wdt));
    float rays=.25+.75*pow(noise(vec2((x-sway)*.16+sd*10.,y*.005+t)),1.4);
    float edge=uBase-2.-2.5*noise(vec2(x*.05+sd,t*3.));
    float v=smoothstep(edge+1.5,edge-3.,y)*exp(-max(0.,edge-y)/(h*.45+6.))*smoothstep(h*1.25,h*.6,up)*rays+exp(-pow((y-edge)/2.,2.))*.55;
    float halo=exp(-.5*d*d/400.)*exp(-up/(h*.4+10.))*.012;
    acc+=uC[i]*L.w*(g*v*1.25+halo);
  }
  return acc;
}
vec3 scene(float x,float y){
  vec3 c=vec3(0.);
  if(y<=uBase) c=aur(x,y);
  else { float r=(y-uBase); c=aur(x+1.2*sin(y*.9+uTime),uBase-r*1.6)*.28*exp(-r/16.); }
  c+=vec3(.0012,.0018,.0032)*smoothstep(uTop-30.,uBase,y)*step(y,uBase);
  return c;
}`,
/* 3. INK: each log a drop of luminous ink released at its hour. It blooms, rises and diffuses
      as the day goes on, so the morning has softened by evening. uL=(cx,cy,radius,intensity), uM.x=age h. */
ink:`
vec3 scene(float x,float y){
  vec2 p=vec2(x,y); float t=uTime*.025;
  vec2 w=vec2(fbm(p*.016+vec2(t,0.)),fbm(p*.016+vec2(5.2,1.3-t)))-.5;
  vec2 w2=vec2(fbm(p*.05+w*2.5+9.),fbm(p*.05+w*2.5+3.))-.5;
  float D=0.,Dl=0.; vec3 C=vec3(0.);
  for(int i=0;i<${MAXL};i++){ if(i>=uN)break; vec4 L=uL[i]; if(L.w<.002)continue;
    float age=uM[i].x, r=max(L.z,1.);
    vec2 q=p+(w*70.+w2*26.)*(.12+min(age,8.)*.11)*clamp(r/22.,.4,1.4);
    vec2 sc=vec2(r*1.05,r*1.25);
    vec2 d=(q-L.xy)/sc; vec2 d2=(q+vec2(-1.6,-2.4)-L.xy)/sc;
    float m=L.w*clamp(10./r,.28,1.)*.8;
    float k=exp(-dot(d,d)*1.3)*m, k2=exp(-dot(d2,d2)*1.3)*m;
    D+=k; Dl+=k2; C+=uC[i]*k;
  }
  float wisp=.35+1.25*pow(fbm(p*.075+w*6.+w2*3.),1.3)*1.3;
  vec3 hue=C/max(D,1e-4);
  float dens=1.-exp(-D*wisp*1.7);
  float lit=clamp((D-Dl)*4.+.55,0.,1.6);
  vec3 c=hue*dens*(.30+.85*lit)*1.15+hue*dens*dens*.35;
  return c*smoothstep(uBase+3.,uBase-6.,y);
}`,
/* 4. FOCUS: each log a point of light seen through a lens. The latest is in focus; earlier ones
      drift out of focus, so the moment you just logged is the sharpest thing on screen.
      Height = amount. uL=(cx,cy,radius,intensity), uM.z = seed. */
focus:`
vec3 scene(float x,float y){
  vec2 p=vec2(x,y); vec3 c=vec3(0.);
  for(int i=0;i<${MAXL};i++){ if(i>=uN)break; vec4 L=uL[i]; if(L.w<.002)continue;
    float r=max(L.z,1.), dd=length(p-L.xy);
    vec3 rr=vec3(r*1.035,r,r*.965);
    float e=.7+r*.035;
    vec3 disc=vec3(smoothstep(rr.r+e,rr.r-e,dd),smoothstep(rr.g+e,rr.g-e,dd),smoothstep(rr.b+e,rr.b-e,dd));
    float rim=.62+.38*smoothstep(r*.45,r*.98,dd);
    float tex=.9+.1*noise(p*.28+uM[i].z*91.);
    float energy=L.w*pow(clamp(3.2/r,0.,1.),1.15)*2.2;
    c+=uC[i]*disc*rim*tex*energy;
    c+=uC[i]*exp(-dd*dd/(2.*pow(r*1.3+3.,2.)))*energy*.035;
    c+=uC[i]*exp(-dd*dd/2.)*L.w*smoothstep(4.,2.,r)*1.4;
  }
  c+=vec3(.0012,.0018,.0032)*smoothstep(uTop-30.,uBase,y)*step(y,uBase);
  return c;
}`
};
const TAIL=`
void main(){
  vec2 px=vec2(gl_FragCoord.x,uRes.y*uDpr-gl_FragCoord.y)/uDpr; float x=px.x,y=px.y;
  vec3 c=scene(x,y);
  c=1.-exp(-c*1.5);
  vec3 bg=uBg*(1.+.18*smoothstep(uBase+40.,uTop-40.,y));
  vec3 col=bg+c*(1.-bg);
#if NOWMARK
  col+=vec3(.9,.95,1.)*.05*exp(-pow((y-uBase-1.)/.6,2.));
  float dn=abs(x-uNowX);
  float line=(1.-smoothstep(.35,1.1,dn))*pow(smoothstep(uTop+20.,uBase,y),1.3)*step(y,uBase);
  float bead=1.-smoothstep(2.2,3.4,length(vec2(dn,y-uBase-.5)));
  col=mix(col,vec3(1.,.94,.84),line*.7);
  col+=vec3(1.,.85,.62)*exp(-(dn*dn+(y-uBase)*(y-uBase))/40.)*.35;
  col=mix(col,vec3(1.,.95,.88),bead);
#endif
  col=mix(uBg,col,smoothstep(uRes.y,uRes.y-56.,y));
  col=pow(clamp(col,0.,1.),vec3(1./2.2));
  col+=(hash(gl_FragCoord.xy+fract(uTime))-.5)/255.;
  gl_FragColor=vec4(col,1.);
}`;

const cv=document.getElementById('hero');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,premultipliedAlpha:false,powerPreference:'low-power'});
const VS=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
const vs=sh(gl.VERTEX_SHADER,VS);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const PROGS={};
function prog(id){
  if(PROGS[id])return PROGS[id];
  const src=HEAD+'#define SHIM '+(SHOT?'0.0':'1.0')+'\n#define NOWMARK 1\n'+SCENES[id]+TAIL;
  const pr=gl.createProgram(); gl.attachShader(pr,vs); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,src)); gl.linkProgram(pr);
  const U={pr}; ['uRes','uDpr','uTime','uNowX','uBase','uTop','uReed','uL','uM','uC','uN','uBg'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
  return PROGS[id]=U;
}

let W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  gl.viewport(0,0,cv.width,cv.height);
  kick();
}
const liquid=k=>k<=0?0:k>=1?1:1-Math.exp(-6.2*k)*Math.cos(4.2*k)*(1-k*.15);
const ease=k=>k<=0?0:k>=1?1:1-Math.pow(1-k,3);
let raf=0,lastActive=0,geo={};
function kick(){lastActive=performance.now(); if(!raf)raf=requestAnimationFrame(frame);}
function layout(){
  const hd=document.querySelector('.head'); const pt=parseFloat(getComputedStyle(hd).paddingTop);
  const base=H-58, top=pt+60, avail=base-top; return {base,top,avail};
}
function frame(){
  raf=0; if(!W)return;
  const now=performance.now(), idea=IDEAS[ideaIx], U=prog(idea.id);
  gl.useProgram(U.pr);
  const ap=gl.getAttribLocation(U.pr,'p');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
  const xs=t=>(t-T0)/(T1-T0)*W, hourPx=W/(T1-T0);
  const {base,top,avail}=layout();
  let moving=false;
  lights=lights.filter(L=>!(L.dying&&now-L.dying>700));
  const act=lights.slice(-MAXL);
  const aL=new Float32Array(MAXL*4), aM=new Float32Array(MAXL*4), aC=new Float32Array(MAXL*3);
  const order=act.map((L,k)=>k);
  geo={idea:idea.id,items:[]};
  order.forEach(k=>{
    const L=act[k];
    let a=SHOT?1:Math.min(1,Math.max(0,(now-L.born)/1300)), h=liquid(a), i=Math.min(1,a*2.2);
    if(L.dying){const d=Math.min(1,(now-L.dying)/600); h*=1-d*d; i*=1-d; moving=true;}
    if(a<1)moving=true;
    L.i=i;
    const age=Math.max(0,nowT-L.t), x=xs(L.t+L.dur/2), hw=L.dur/2*hourPx;
    let v;
    if(idea.id==='reeds'){
      const r0=Math.floor((L.t-T0)*2), r1=Math.max(r0,Math.ceil((L.t+L.dur-T0)*2)-1), rw=W/39;
      v=[(r0+r1+1)/2*rw,(r1-r0)/2*rw,avail*L.hT*h,L.iT*i];
    } else if(idea.id==='aurora'){
      v=[x,hw,avail*L.hT*h,L.iT*i];
    } else if(idea.id==='ink'){
      const r=(5+11*Math.sqrt(Math.min(L.eq,90)/90)+Math.min(age,9)*2.4)*(0.35+0.65*ease(a));
      const cy=base-10-r*.85;
      v=[x,cy,r,L.iT*i];
    } else if(idea.id==='focus'){
      const r=2.6+Math.min(age,10)*2.5+(1-ease(a))*10;
      const cy=base-12-(avail-34)*((L.hT-.3)/.62)*h;
      v=[x,cy,r,L.iT*i];
    }
    aL.set(v,k*4); aM.set([age,a,L.seed,RT[L.log.r].neutral?1:0],k*4); aC.set(idea.tint?tintK(L.raw,idea.tint):L.c,k*3);
    geo.items.push({log:L.log,v});
  });
  gl.uniform2f(U.uRes,W,H); gl.uniform1f(U.uDpr,dpr); gl.uniform1f(U.uTime,SHOT?0:now/1000);
  gl.uniform1f(U.uNowX,xs(nowT)); gl.uniform1f(U.uBase,base); gl.uniform1f(U.uTop,top); gl.uniform1f(U.uReed,W/39);
  gl.uniform4fv(U.uL,aL); gl.uniform4fv(U.uM,aM); gl.uniform3fv(U.uC,aC); gl.uniform1i(U.uN,act.length);
  gl.uniform3fv(U.uBg,hex('#0B1019'));
  gl.drawArrays(gl.TRIANGLES,0,3);
  if(!SHOT && (moving || now-lastActive<8000)){
    if(moving) raf=requestAnimationFrame(frame);
    else setTimeout(()=>{if(!raf)raf=requestAnimationFrame(frame)},50);
  } else window.__ready=true;
}
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  let best=null;
  if(geo.idea==='reeds'||geo.idea==='aurora'){
    const t=T0+x/r.width*(T1-T0); let bd=.75; logs.forEach(l=>{const d=Math.abs(l.t-t); if(d<bd){bd=d;best=l}});
  } else {
    let bd=1e9; geo.items.forEach(g=>{const d=Math.hypot(x-g.v[0],y-g.v[1])-g.v[2]; if(d<bd&&d<18){bd=d;best=g.log}});
  }
  if(best)showLog(best);
});
// prototype chrome
const seg=document.getElementById('seg');
IDEAS.forEach((d,k)=>{const b=document.createElement('button'); b.textContent=d.name; b.onclick=()=>setIdea(k); seg.appendChild(b);});
function setIdea(k){
  ideaIx=k; [...seg.children].forEach((b,j)=>b.classList.toggle('on',j===k));
  const u=new URL(location.href); u.searchParams.set('idea',k+1); history.replaceState(null,'',u);
  renderAxis(); kick();
}
document.getElementById('data').onclick=()=>{dayIx=(dayIx+1)%DAYS.length; loadDay(dayIx,true);};
document.getElementById('full').onclick=()=>{document.body.classList.toggle('full'); document.getElementById('full').textContent=document.body.classList.contains('full')?'Ideas':'Full'; requestAnimationFrame(resize);};
if(document.body.classList.contains('full'))document.getElementById('full').textContent='Ideas';
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kick()});
window.addEventListener('resize',resize);
loadDay(dayIx,!SHOT);
setIdea(ideaIx);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{resize(); if(SHOT)requestAnimationFrame(()=>requestAnimationFrame(()=>{window.__ready=true}));});
window.__state=()=>({idea:IDEAS[ideaIx].id,day:dayIx,logs:logs.length});
</script>
