  if (U.sugState === 'show' && c) body = `<div class="sug" data-suggest${hs(c.id)}><button class="sn" data-act="sheet" data-s="item" data-id="${c.id || ''}">${esc(c.name)}</button><div class="sr">${esc(c.reason)}</div><div class="sb"><button class="primary" data-act="sug-do">${esc(c.verb)}</button><button class="sec2" data-act="sug-not">Not now</button><button class="dots" data-act="sheet" data-s="sugmore" aria-label="More choices"><svg width="18" height="4" viewBox="0 0 18 4" fill="currentColor"><circle cx="2" cy="2" r="1.7"/><circle cx="9" cy="2" r="1.7"/><circle cx="16" cy="2" r="1.7"/></svg></button></div></div>`;

  return `<section class="sec"><div class="sech"><h2>If you have a moment</h2><button class="aside" data-act="sheet" data-s="sugwhy" aria-label="How suggestions are chosen">Why these</button></div>${body}</section>`;
}

// ---------- live session ----------
function renderLive() {
  if (!S.live) { liveEl.classList.remove('on'); return; }
  const x = byId(S.live.id) || { name: S.live.name, usual: S.live.plan };
  const plan = S.live.plan || x.usual;
  liveEl.setAttribute('style', (hs(S.live.id).match(/"(.*)"/) || [, ''])[1]); liveEl.innerHTML = `<div class="lt"><div class="a">${esc(x.name || x.title)}</div><div class="b tnum"><span data-liveclock>${liveClock()}</span>${S.live.pausedAt ? ', paused' : plan ? `, usually ${plan} min` : ''}</div></div><button data-act="live-pause">${S.live.pausedAt ? 'Resume' : 'Pause'}</button><button class="end" data-act="live-end">End</button><div class="lp"><i data-liveprog style="width:${liveProg(plan)}%"></i></div>`;
  liveEl.classList.add('on');
}
const liveProg = plan => plan ? Math.min(100, 100 * ((S.live.pausedAt || Date.now()) - S.live.start) / 60000 / plan) : 0;
setInterval(() => { if (!S || !S.live || STILL) return; document.querySelectorAll('[data-liveclock]').forEach(e => e.textContent = liveClock()); document.querySelectorAll('[data-livetxt]').forEach(e => e.textContent = liveTxt()); const p = document.querySelector('[data-liveprog]'); if (p) { const x = byId(S.live.id); p.style.width = liveProg(S.live.plan || (x && x.usual)) + '%'; } }, 1000);
function startLive(x, plan) {
  if (S.live) endLive(true);
  S.live = { id: x.id, start: Date.now(), plan: plan || null, name: x.name };
  haptic(12); U.fx.key = x.id; render();
  toast(`${x.name} started`, plan ? `${plan} min, the bar below keeps time` : 'The bar below keeps time', () => { S.live = null; render(); });

<script type="module">
// Meridian Today, soft v2: the day carved into the surface. A height field (grooves, a well, domes, bumps, pits)
// lit by the page's one top-left light, with warm light pooled only in the lived part of the groove and in the sun.
// One full-hero fragment shader over the flat arc's exact composition (app.js arcModel/arcSvg -> data).
// Front-on, no geometry: the arc is computed per pixel from the same X(t)/Y(t) the SVG uses, so every
// position, count and label matches the flat arc. The SVG keeps its text labels; no WebGL -> the flat SVG stays whole.
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MAXL = 48, MAXR = 12, MAXS = 4, TOPX = 64, BOTX = 24; // canvas bleeds 64 px up (behind the date) and 24 px down

const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS = `
precision highp float;
uniform vec2 uRes; uniform float uDpr, uTime, uTop;
uniform vec4 uA;   // pad, NW, DW, hz
uniform vec4 uB;   // start, wake, end, bed
uniform vec4 uC;   // amp, dep, now, noData
uniform vec4 uL[${MAXL}]; uniform vec4 uLW[${MAXL}]; uniform int uNL; // logs: x, y, r, warmth / flash
uniform vec4 uR[${MAXR}]; uniform int uNR;   // records: x, y, r, new
uniform vec4 uS[${MAXS}]; uniform int uNS;   // sessions: x0, x1
uniform float uPulse, uFlow, uShim;

float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
// the same curve as app.js arcModel
float tOf(float x){ float pad=uA.x,NW=uA.y,DW=uA.z; return x<=pad+NW ? uB.x+(x-pad)/NW*(uB.y-uB.x) : uB.y+(x-pad-NW)/DW*(uB.z-uB.y); }
float yOf(float t){ float hz=uA.w, st=uB.x, wk=uB.y, en=uB.z, bd=uB.w, PI=3.14159265;
  t=clamp(t,st,en);

float fx(float x){ return yOf(tOf(x)); }
float X(float t){ float pad=uA.x,NW=uA.y,DW=uA.z; t=clamp(t,uB.x,uB.z); return t<=uB.y ? pad+(t-uB.x)/(uB.y-uB.x)*NW : pad+NW+(t-uB.y)/(uB.z-uB.y)*DW; }
float slope(float x){ return (fx(x+.75)-fx(x-.75))/1.5; }
float dist(vec2 p){ float s=slope(p.x); return abs(p.y-fx(p.x))/sqrt(1.+s*s); }
float seg(vec2 p,float x0,float x1){ float xc=clamp(p.x,x0,x1); return xc==p.x ? dist(p) : length(p-vec2(xc,fx(xc))); }

// profiles, all smooth at their rims so nothing has an edge line: the surface bends, it is never cut
float bowl(float d,float w){ return d<w ? .5+.5*cos(3.14159265*d/w) : 0.; }      // a groove or pit cross-section
float dome(float r,float R){ float k=max(0.,1.-r*r/(R*R)); return k*k*(3.-2.*k); } // a moulded bump
float dots(vec2 p,float x0,float x1,float gap,float R){ // a row of small pits along the curve
  if(p.x<x0-R||p.x>x1+R) return 0.;
  float sl=sqrt(1.+pow(slope(p.x),2.)), ph=fract((p.x-x0)/gap);
  return bowl(length(vec2((ph-.5)*gap*sl,dist(p))),R);
}

// the height of the surface at p, in px. 0 is the page; negative is carved in, positive is moulded up
float H(vec2 p, bool near, out float fill){
  float hz=uA.w, xw=X(uB.y), xn=X(uC.z), xb=X(uB.w), xs=X(uB.x), xe=X(uB.z);
  bool noData=uC.w>.5;

  // last night: a well under the horizon, deepest along the night's own line

    if(p.x>xs-8. && p.x<xw+8.){
      float y=fx(clamp(p.x,xs,xw));

    }

  if(p.y>ym+10. && p.y<hz-2.) h-=.4*bowl(length(vec2(p.x-xm,(fract(p.y/5.)-.5)*5.)),1.);

  if(near) for(int i=0;i<${MAXL};i++){ if(i>=uNL)break; vec4 L=uL[i]; float r=length(p-L.xy); if(r<L.z+1.5) h+=2.2*dome(r,L.z+1.1); }

void main(){

  float yn=yOf(uC.z); vec2 sun=vec2(xn,yn);
  bool noData=uC.w>.5;
  vec3 WARM=vec3(1.,.42,.17), CREAM=vec3(1.,.9,.78), COOL=vec3(.56,.58,.98), SUNC=vec3(1.,.55,.3), LT=vec3(1.,.93,.86);

  float f0,f1,f2,f3,f4,f5;
  bool near=dist(p)<42. && p.x>X(uB.y)-12. && p.x<X(uC.z)+12.;

  float hy=(H(p+vec2(0.,e),near,f3)-H(p-vec2(0.,e),near,f4))/(2.*e);
  vec3 n=normalize(vec3(-hx,-hy,1.));
  vec3 Ld=normalize(vec3(-.62,-.62,.48));
  float diff=dot(n,Ld)-Ld.z;               // 0 on the flat page, so the page shows through untouched
  // a soft cast shadow: anything higher toward the light shades this point (domes throw down-right, grooves shade their top-left wall)
  vec2 tl=normalize(Ld.xy);

  float lift=max(diff,0.)*.36;              // warm light on faces turned to the light: the same tint as the page's light shadows
  float dark=clamp(max(-diff,0.)*.78+shad*.26+cav,0.,.62);

  // emitted light. Only the lived part of the day and the sun give light; the rest is shape
  vec3 E=vec3(0.);
  if(uC.z>uB.y){
    float xl=min(xn,xb), d=seg(p,xw,xl);
    float k=clamp((p.x-xw)/max(1.,xl-xw),0.,1.), heat=pow(k,2.2);

    float y=fx(clamp(p.x,xs,xw)); float inside=step(hz,p.y)*step(p.y,y)*step(xs,p.x)*step(p.x,xw);
    E+=COOL*inside*.06*pow(clamp((p.y-hz)/max(1.,y-hz),0.,1.),1.4); }
  // logs: the tops of the bumps are a lighter, warmer material near now; a new one flashes
  if(near) for(int i=0;i<${MAXL};i++){ if(i>=uNL)break; vec4 L=uL[i]; float r=length(p-L.xy), fl=uLW[i].x;
    float m=dome(r,L.z+1.1);
    vec3 hc=uLW[i].yzw; bool hued=dot(hc,hc)>.001;
    vec3 tint=hued ? hc : mix(CREAM*.8,WARM+CREAM*.2,L.w*.6);          // each log glows in its routine's own hue
    E+=tint*smoothstep(.0,.6,m)*(.5+.15*L.w)*(1.+2.*fl) + tint*exp(-r/2.4)*.05 + CREAM*exp(-r/2.)*.6*fl; }
  for(int i=0;i<${MAXR};i++){ if(i>=uNR)break; vec4 R=uR[i]; float r=length(p-R.xy); E+=vec3(.5,.47,.43)*bowl(r,R.z+.2)*(.16+.5*R.w); }
  // the sun: the dome glows from within, hottest at its crown; its light falls on the page around it
  float r=length(p-sun), dim=(noData && uC.z<uB.y) ? .55 : 1., pul=1.+.6*uPulse;
  float sd=dome(r,10.);
  vec3 sunL=mix(SUNC*.6,vec3(1.,.8,.62)*.95,smoothstep(.3,1.,sd))*smoothstep(0.,.1,sd)
    + SUNC*(exp(-r/4.)*.16+exp(-r*r/(2.*256.))*.14*pul+exp(-r*r/(2.*2500.))*.05*pul);

  // premultiplied: page * (1 - a) + add
  gl_FragColor=vec4(max(add,0.),clamp(a,0.,1.));
}`;

    const L = new Float32Array(MAXL * 4); this.LW = new Float32Array(MAXL * 4); this.HC = new Float32Array(MAXL * 4); this.fx = [];

      const t = A.T(m.x), y = A.Y(t), [nx, ny] = A.N(t), off = 4.6 + m.n * 6.4;

  frame(ts) {

  }
  kick() { if (!this.raf) this.raf = requestAnimationFrame(t => this.frame(t)); }
}

if (probe() && !new URLSearchParams(location.search).has('flat')) {
  try {
    const a = new ArcLight();
    window.Arc3D = { attach: (el, d, still) => a.attach(el, d, still) };
    window.__meridian && window.__meridian.render();
  } catch (e) { window.Arc3D = null; }
}
