<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Today, soft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0D0C; --ink2:#161513; --ink3:#1F1D1A; --line:rgba(var(--tx),.09); --line2:rgba(var(--tx),.16);
  --cream:#F3EDE4; --t2:rgba(var(--tx),.62); --t3:rgba(var(--tx),.40); --t4:rgba(var(--tx),.22);
  --sun:#FF6B3D; --sun2:#FF8F5E; --sunInk:#2A0E04; --night:#8E93E8; --rec:#8F887E;
  --sky:#FF8A5B;
  --disp:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --ui:"Geist", ui-sans-serif, system-ui, sans-serif;
  --gut:20px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--ink)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:180px;scroll-padding:100px 0 170px}
.scroll::-webkit-scrollbar{display:none}
.tnum{font-variant-numeric:tabular-nums}

/* status bar + scrolled bar */
.sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:6px 22px 0 34px;pointer-events:none}
.sbar .clk{font:600 16px/1 var(--ui);letter-spacing:-.01em}
.sbar .ddata{pointer-events:auto;font:500 12px/1 var(--ui);color:var(--t2);padding:7px 10px;border-radius:99px;background:rgba(var(--tx),.07);border:1px solid var(--line)}
.sbar .ddata b{color:var(--cream);font-weight:600}
.topbar{position:absolute;top:0;left:0;right:0;height:92px;z-index:20;background:rgba(var(--surfRGB),.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font:600 16px/1 var(--disp);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.topbar.on{opacity:1;transform:none}

/* sky: a flat light at the sun's place, coloured by the hour */
.sky{position:absolute;left:0;right:0;top:0;height:520px;pointer-events:none;opacity:.9;transition:background .6s}

/* header */
.head{position:relative;padding:58px var(--gut) 0;display:flex;align-items:flex-start;justify-content:space-between}
.head h1{font:600 34px/1 var(--disp);font-variation-settings:"wdth" 88;letter-spacing:-.02em}
.head .sub{margin-top:6px;font:400 15px/1.2 var(--ui);color:var(--t2)}
.head .sub .ctx{color:var(--cream)}
.hicons{display:flex;gap:2px;margin-top:-4px;margin-right:-10px}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--t2)}
.ib:active{background:rgba(var(--tx),.06)}
.ib.on{color:var(--cream)}
.ib .n{position:absolute;top:6px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--cream);color:var(--ink);font:700 10px/16px var(--ui);text-align:center}
.ctxchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font:500 13px/1 var(--ui);color:var(--cream)}
.ctxchip i{width:6px;height:6px;border-radius:50%;background:var(--night)}

/* the day arc */
.arc{position:relative;margin-top:0;height:160px;cursor:pointer}
.arc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc .cap{position:absolute;left:var(--gut);right:var(--gut);bottom:2px;display:flex;justify-content:space-between;font:400 12px/1 var(--ui);color:var(--t3)}
.arc .lbl{font:500 11.5px var(--ui);fill:var(--t3)}
.arc .lbl.now{fill:var(--sun2);font-weight:600}
.arc .lbl.nt{fill:var(--night)}
.arc .lbl.miss{fill:var(--t3)}
.arc .ray{stroke:var(--cream);stroke-linecap:round;stroke-width:3.6}
.arc .ray.new{stroke:var(--sun2);animation:ray .7s var(--spring) both, rayc 2.2s .7s ease forwards}
@keyframes ray{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}
@keyframes rayc{to{stroke:var(--cream)}}
.arc .sess{stroke:var(--cream);stroke-width:6;stroke-linecap:round;fill:none}
.arc .rec{fill:var(--rec)}
.arc .halo{fill:var(--sun);opacity:.16;transform-box:fill-box;transform-origin:center}
.arc .halo.pulse{animation:halo .9s var(--ease)}
@keyframes halo{0%{transform:scale(1);opacity:.16}35%{transform:scale(1.9);opacity:.3}100%{transform:scale(1);opacity:.16}}
.arc.is3d svg > :not(text){display:none}
.arc .arc3d{position:absolute;left:0;top:-64px;display:block;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 20px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 40px,#000 calc(100% - 20px),transparent 100%)}
.l3{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:500 11.5px var(--ui);color:var(--t3);will-change:transform}
.l3.now{color:var(--sun2);font-weight:600}
.l3.nt{color:var(--night)}
.arcnote{position:absolute;right:var(--gut);top:132px;text-align:right;font:400 14px/1.35 var(--ui);color:var(--t3);pointer-events:none}

/* results strip */
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:10px;padding:0 0 4px}
.strip::-webkit-scrollbar{display:none}
.panel{position:relative;flex:0 0 78%;scroll-snap-align:start;padding:2px 22px 4px var(--gut);border-right:1px solid var(--line);text-align:left;min-height:0;display:flex;flex-direction:column}
.panel:last-child{border-right:0;flex-basis:86%}
.panel.solo{flex-basis:100%}
.panel .k{font:500 13px/1 var(--ui);color:var(--t2);display:flex;gap:6px;align-items:center}
.panel .k .just{color:var(--sun2)}
.panel .big{margin-top:8px;font:300 40px/1 var(--disp);font-variation-settings:"wdth" 90;letter-spacing:-.03em}
.panel .big small.u{margin:0 6px 0 3px;font-size:16px}
.panel .big small{font:400 17px var(--ui);letter-spacing:0;color:var(--t2);margin-left:6px}
.panel .ttl{margin-top:8px;font:500 21px/1.15 var(--disp);letter-spacing:-.01em}
.panel .ln{margin-top:8px;font:400 14px/1.35 var(--ui);color:var(--t2)}
.panel .ln b{color:var(--cream);font-weight:500}
.panel .mini{margin-top:auto;padding-top:10px}
.panel .x{position:absolute;top:-8px;right:4px;width:36px;height:36px;display:grid;place-items:center;color:var(--t4);border-radius:12px}
.nights{display:flex;align-items:flex-end;gap:5px;height:34px}
.nights i{width:7px;border-radius:2px;background:rgba(var(--tx),.22)}
.nights i.on{background:var(--night)}
.nights i.gap{height:6px!important;background:none;border:1px dashed var(--t4)}
.splits{display:flex;align-items:flex-end;gap:5px;height:30px}
.splits i{width:9px;border-radius:2px 2px 0 0;background:rgba(var(--tx),.22)}
.splits i.best{background:var(--cream)}
.prange{display:grid;gap:7px}
.prange .r{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:8px;font:400 12.5px var(--ui);color:var(--t2)}
.prange .t{position:relative;height:10px}
.prange .t:before{content:"";position:absolute;left:0;right:0;top:4.5px;height:1px;background:var(--line)}
.prange .t .s{position:absolute;top:3px;height:4px;border-radius:2px;background:rgba(var(--tx),.3)}
.prange .t .m{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--cream)}
.prange .r.b .t .m{background:var(--sun2)}
.prange .v{text-align:right;color:var(--cream)}
.weekd{display:flex;gap:10px;align-items:flex-end;height:40px}
.weekd .c{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;width:18px}
.weekd .c i{width:6px;height:3px;border-radius:1px;background:rgba(var(--tx),.5)}
.weekd .c span{font:500 10px var(--ui);color:var(--t3);margin-top:3px}
.weekd .c.sick span{color:var(--night)}
.weekd .c.now i{background:var(--sun2)}
.panel .act{margin-top:12px;align-self:flex-start;height:40px;padding:0 16px;border-radius:12px;background:var(--cream);color:var(--ink);font:600 14px var(--ui)}

/* sections */
.welcome{margin:22px var(--gut) 0;font:400 15px/1.4 var(--ui);color:var(--t2)}
.welcome b{color:var(--cream);font-weight:500}
.sec{margin-top:24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--gut);margin-bottom:4px}
.sech h2{font:600 15px/1 var(--disp);color:var(--t2);letter-spacing:.005em}
.sech .aside{font:500 13px var(--ui);color:var(--t2);padding:10px 0 10px 12px;margin:-10px 0}
.none{padding:10px var(--gut) 0;font:400 15px/1.4 var(--ui);color:var(--t3)}

/* Now rows */
.rows{padding:0 var(--gut)}
.row{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:14px;padding:15px 0 15px;border-top:1px solid var(--line);transition:opacity .3s}
.row:first-child{border-top:0}
.row .open{position:absolute;inset:0 76px 0 0;border-radius:6px}
.row .nm{position:relative;pointer-events:none;font:500 21px/1.1 var(--disp);font-variation-settings:"wdth" 94;letter-spacing:-.012em}
.row.lead .nm{font-size:27px;font-weight:500}
.row .st{position:relative;pointer-events:none;margin-top:5px;font:400 14px/1.35 var(--ui);color:var(--t2)}
.row .st b{color:var(--cream);font-weight:500}
.row .st .pv{color:var(--sun2);font-weight:500}
.row .first{position:relative;pointer-events:none;margin-top:8px;font:400 13.5px/1.4 var(--ui);color:var(--t3);max-width:30ch}
.row .first em{font-style:normal;color:var(--t2)}
.row.full{grid-template-columns:1fr}
.row.full .open{right:0;bottom:56px}
.row .tag{font:500 12px var(--ui);color:var(--sun2)}
.row.completing .nm{color:var(--sun2);transition:color .25s}
.row.leaving{animation:leave .42s var(--ease) forwards;overflow:hidden}
@keyframes leave{0%{max-height:160px;opacity:1}100%{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-color:transparent}}
.row.arrive{animation:arrive .5s var(--ease) both}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}}
.rows.locked .keyw{pointer-events:none}
.more{display:block;margin:6px var(--gut) 0;height:44px;font:500 14px var(--ui);color:var(--t2);text-align:left}
.more b{color:var(--cream);font-weight:500}

/* keys: flat forms; the feel is in the motion */
.keyw{position:relative;display:flex;align-items:center;justify-content:flex-end;min-width:56px;min-height:52px}
.key{position:relative;display:grid;place-items:center;transition:transform .07s ease-out}
.key.down{transform:translateY(2px) scale(.93)}
.key.rel{animation:rel .38s var(--spring)}
@keyframes rel{0%{transform:translateY(2px) scale(.93)}100%{transform:none}}
.k-round{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(var(--tx),.34);overflow:hidden}
.k-round .fill{position:absolute;left:-2px;right:-2px;bottom:-2px;height:0;background:var(--sun)}
.k-round.done{border-color:var(--sun)}
.k-round.done .fill{height:calc(100% + 4px)}
.k-round.done.anim .fill{animation:rise .55s var(--ease)}
@keyframes rise{0%{height:0;border-radius:50% 50% 0 0/14px 14px 0 0}70%{border-radius:50% 50% 0 0/6px 6px 0 0}100%{height:calc(100% + 4px);border-radius:0}}
.k-round svg{position:relative;z-index:1}
.k-round .ck{stroke:var(--sunInk);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22}
.k-round.done .ck{stroke-dashoffset:0}
.k-round .ck.ghost{stroke:rgba(var(--tx),.28);stroke-dashoffset:0}
.k-round.done.anim .ck{animation:ck .35s .32s var(--ease) both}
@keyframes ck{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.k-round .pl{stroke:var(--cream);stroke-width:2;stroke-linecap:round}
.k-seg{height:46px;padding:0 9px;gap:4px;display:flex;align-items:center;border-radius:15px;border:1.5px solid rgba(var(--tx),.34)}
.k-seg i{position:relative;width:9px;height:22px;border-radius:3px;background:rgba(var(--tx),.13);overflow:hidden}
.k-seg i.on:after{content:"";position:absolute;inset:0;background:var(--sun);border-radius:3px}
.k-seg i.on.anim:after{animation:segrise .5s var(--ease) both}
@keyframes segrise{from{transform:translateY(100%)}to{transform:none}}
.k-pill{height:46px;padding:0 16px 0 13px;gap:7px;display:flex;align-items:center;border-radius:15px;border:1.5px solid rgba(var(--tx),.34);font:600 15px var(--ui)}
.k-pill.on{border-color:var(--sun);color:var(--sun2)}
.k-pill .tm{font-variant-numeric:tabular-nums}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--sun);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.k-word{height:46px;padding:0 14px;display:flex;align-items:center;border-radius:15px;border:1.5px solid rgba(var(--tx),.34);font:600 14px var(--ui);margin-right:8px}

/* amount row */
.amt{margin-top:12px;display:flex;gap:7px;grid-column:1/-1}
.amt .key{flex:1;height:44px;border-radius:13px;background:rgba(var(--tx),.07);font:500 16px/1 var(--disp);font-variant-numeric:tabular-nums;overflow:hidden}
.amt .key span{position:relative;z-index:1}
.amt .key.last{box-shadow:inset 0 0 0 1.5px rgba(var(--tx),.28)}
.amt .key .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sun);opacity:0}
.amt .key.pour .fill{animation:pour .7s var(--ease)}
@keyframes pour{0%{height:0;opacity:.95}45%{height:100%;opacity:.95}100%{height:100%;opacity:0}}
.amt .key.pour span{animation:pourtx .7s var(--ease)}
@keyframes pourtx{0%,45%{color:var(--sunInk)}100%{color:var(--cream)}}
.level{position:relative;margin-top:9px;height:2px;border-radius:2px;background:rgba(var(--tx),.1);max-width:220px;pointer-events:none}
.level i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--sun);transition:width .7s var(--ease)}
.roll{display:inline-block;animation:roll .45s var(--spring)}
@keyframes roll{from{transform:translateY(.45em);opacity:0}}

/* Later as set type */
.later{padding:0 var(--gut)}
.lg{padding:10px 0 4px}
.lg .h{font:400 13px/1 var(--ui);color:var(--t3);margin-bottom:6px}
.para{display:flex;flex-wrap:wrap;column-gap:20px;row-gap:2px;align-items:center}
.tok{display:inline-flex;align-items:center;gap:4px;min-height:48px}
.tok .tn{font:400 19px/1.1 var(--disp);font-variation-settings:"wdth" 92;color:rgba(var(--tx),.86);padding:12px 0;text-align:left}
.tok .tf{font:400 13.5px/1 var(--ui);color:var(--t3);margin-left:5px;pointer-events:none}
.tok .tk{width:36px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(var(--tx),.08);color:var(--cream);font:600 12px var(--ui);margin-left:4px;position:relative}
.tok .tk:before{content:"";position:absolute;inset:-6px}
.tok .tk.w{width:auto;padding:0 10px}
.tok .tk.down{background:rgba(255,107,61,.25)}
.tok.done .tn{color:var(--sun2)}

/* By a date, tonight, settled */
.dateline{display:flex;align-items:center;gap:12px;margin:8px var(--gut) 0;min-height:48px;text-align:left;font:400 15px/1.3 var(--ui);color:var(--t2);width:calc(100% - 40px)}
.dateline b{color:var(--cream);font-weight:500}
.dateline svg{flex:none;color:var(--t2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px var(--gut) 0}
.chip{height:40px;padding:0 15px;border-radius:13px;border:1px solid var(--line2);font:500 14px var(--ui);color:var(--cream)}
.chip.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.chip.sm{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.settled{padding:4px var(--gut) 0;display:flex;flex-wrap:wrap;column-gap:16px;row-gap:0}
.settled button{display:inline-flex;align-items:center;gap:8px;min-height:40px;font:400 16px var(--disp);color:var(--t2)}
.settled button i{width:7px;height:7px;border-radius:50%;background:var(--sun)}
.settled button.pop{animation:pop .6s var(--spring)}
@keyframes pop{0%{transform:scale(.6);opacity:0;color:var(--sun2)}60%{color:var(--sun2)}100%{transform:none;opacity:1}}

/* suggestion */
.sug{margin:6px var(--gut) 0;padding:16px 16px 14px;border-radius:22px;background:rgba(var(--tx),.045)}
.sug .sn{font:500 21px/1.15 var(--disp);letter-spacing:-.01em;text-align:left;display:block}
.sug .sr{margin-top:5px;font:400 14px var(--ui);color:var(--t2)}
.sug .sb{display:flex;gap:8px;margin-top:14px}
.sug .sb .primary{flex:1;height:44px;border-radius:13px;background:var(--cream);color:var(--ink);font:600 14.5px var(--ui)}
.sug .sb .sec2{height:44px;padding:0 16px;border-radius:13px;background:rgba(var(--tx),.08);font:500 14.5px var(--ui)}
.sug .sb .dots{width:44px;height:44px;border-radius:13px;background:rgba(var(--tx),.08);display:grid;place-items:center}
.sughold{padding:2px var(--gut) 0;font:400 14.5px/1.45 var(--ui);color:var(--t3)}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px var(--gut) 0;height:52px;width:calc(100% - 40px);border-radius:16px;background:var(--cream);color:var(--ink);font:600 15.5px var(--ui)}
.foot{margin:36px var(--gut) 0;display:flex;justify-content:center}
.foot button{font:500 13px var(--ui);color:var(--t3);height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px}

/* tab bar, live bar, toast */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;z-index:25;background:rgba(var(--surfRGB),.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;padding:6px 6px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;font:500 10.5px var(--ui);color:var(--t3);height:50px}
.tab.on{color:var(--cream)}
.logkey{justify-self:center;width:58px;height:58px;margin-top:-4px;border-radius:50%;background:var(--cream);color:var(--ink);display:grid;place-items:center;transition:transform .08s}
.logkey:active{transform:scale(.92)}
.livebar{position:absolute;left:10px;right:10px;bottom:94px;z-index:24;height:62px;border-radius:20px;background:#22201D;border:1px solid var(--line2);display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;transform:translateY(130%);opacity:0;transition:transform .45s var(--spring),opacity .25s}
.livebar.on{transform:none;opacity:1}
.livebar .lt{flex:1;min-width:0}
.livebar .lt .a{font:500 16px var(--disp)}
.livebar .lt .b{font:400 13px var(--ui);color:var(--t2);margin-top:2px}
.livebar .lp{position:absolute;left:16px;right:16px;bottom:0;height:2px;background:rgba(var(--tx),.08);border-radius:2px;overflow:hidden}
.livebar .lp i{position:absolute;left:0;top:0;bottom:0;background:var(--sun)}
.livebar button{height:44px;padding:0 14px;border-radius:13px;background:rgba(var(--tx),.08);font:600 14px var(--ui)}
.livebar button.end{background:var(--cream);color:var(--ink)}
.toast{position:absolute;left:10px;right:10px;top:8px;z-index:35;min-height:58px;border-radius:24px;background:#26231F;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(var(--sd),calc(.45 * var(--sda)));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;transform:translateY(-130%) scale(.9);opacity:0;transition:transform .45s var(--spring),opacity .2s;transform-origin:top center}
.toast.on{transform:none;opacity:1}
.toast .tt{flex:1;min-width:0}
.toast .a{font:500 16px/1.2 var(--disp)}
.toast .b{font:400 13px/1.3 var(--ui);color:var(--t2);margin-top:2px}
.toast .undo{height:44px;padding:0 16px;border-radius:16px;font:600 14.5px var(--ui);color:var(--sun2);background:rgba(255,107,61,.1)}
.toast .bar{position:absolute;left:24px;right:24px;bottom:0;height:2px;background:var(--sun);transform-origin:left;opacity:.5}
.toast.on .bar{animation:tbar 5s linear forwards}
@keyframes tbar{to{transform:scaleX(0)}}

/* sheets */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(var(--sd),calc(.5 * var(--sda)));opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow-y:auto;scrollbar-width:none;background:#191816;border-radius:28px 28px 0 0;border-top:1px solid var(--line2);padding:10px 0 40px;transform:translateY(105%);transition:transform .45s var(--spring)}
.sheet.on{transform:none}
.sheet::-webkit-scrollbar{display:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--t4);margin:0 auto 14px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;padding:0 var(--gut)}
.sh h3{font:600 26px/1.1 var(--disp);letter-spacing:-.015em;font-variation-settings:"wdth" 92}
.sh .k{font:500 13px var(--ui);color:var(--t2);margin-bottom:6px}
.sh .close{width:44px;height:44px;margin:-8px -10px 0 0;display:grid;place-items:center;color:var(--t2)}
.sp{padding:0 var(--gut)}
.sp p,.sline{font:400 15px/1.45 var(--ui);color:var(--t2)}
.sline b{color:var(--cream);font-weight:500}
.slab{margin:24px var(--gut) 8px;font:600 14px var(--disp);color:var(--t2)}
.slist{padding:0 var(--gut)}
.slist .li{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);font:400 15.5px var(--ui);width:100%;text-align:left}
.slist .li:first-child{border-top:0}
.slist .li .tm{width:48px;color:var(--t3);font-variant-numeric:tabular-nums;font-size:14px}
.slist .li .tx{flex:1}
.slist .li .tx small{display:block;color:var(--t3);font-size:13px;margin-top:2px}
.slist .li .rm{font:500 13.5px var(--ui);color:var(--t2);padding:10px 0 10px 10px}
.slist .li .dot{width:7px;height:7px;border-radius:50%;background:var(--cream)}
.slist .li .dot.q{background:var(--rec)}
.bigfig{font:300 56px/1 var(--disp);letter-spacing:-.03em;font-variation-settings:"wdth" 90;margin-top:6px}
.bigfig small{font:400 18px var(--ui);color:var(--t2);margin-left:6px;letter-spacing:0}
.btns{display:grid;gap:8px;padding:0 var(--gut)}
.btn{height:52px;border-radius:16px;background:rgba(var(--tx),.08);font:500 15.5px var(--ui);width:100%}
.btn.primary{background:var(--cream);color:var(--ink);font-weight:600}
.btn.ghost{background:none;color:var(--t2)}
.scrub{display:flex;gap:8px;padding:6px var(--gut) 0;overflow-x:auto;scrollbar-width:none}
.scrub button{flex:0 0 auto;min-width:72px;height:72px;border-radius:18px;background:rgba(var(--tx),.07);font:400 22px/1 var(--disp);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.scrub button small{font:400 11.5px var(--ui);color:var(--t3)}
.stepper{display:flex;align-items:center;justify-content:space-between;margin:14px var(--gut) 0;padding:8px;border-radius:18px;background:rgba(var(--tx),.05)}
.stepper button{width:52px;height:52px;border-radius:14px;background:rgba(var(--tx),.08);font:400 24px var(--ui)}
.stepper .v{font:400 30px var(--disp);font-variant-numeric:tabular-nums}
.hyp{position:relative;height:96px;margin:10px var(--gut) 0}
.hyp i{position:absolute;height:14px;border-radius:3px;background:var(--night)}
.hyp .lb{position:absolute;left:0;font:400 11px var(--ui);color:var(--t3)}
.bars7{display:flex;gap:12px;align-items:flex-end;height:90px;padding:0 var(--gut)}
.bars7 .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bars7 .c i{width:100%;max-width:28px;border-radius:4px;background:rgba(var(--tx),.2)}
.bars7 .c.on i{background:var(--night)}
.bars7 .c.gap i{background:none;border:1px dashed var(--t4);height:10px!important}
.bars7 .c span{font:400 11px var(--ui);color:var(--t3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:4px var(--gut) 0}
.stats .s .l{font:400 13px var(--ui);color:var(--t3)}
.stats .s .v{font:400 24px var(--disp);margin-top:4px;font-variant-numeric:tabular-nums}
.splitrows{padding:0 var(--gut)}
.splitrows .r{display:grid;grid-template-columns:34px 1fr 52px;gap:10px;align-items:center;height:30px;font:400 13.5px var(--ui);color:var(--t2)}
.splitrows .r i{height:8px;border-radius:4px;background:rgba(var(--tx),.25)}
.splitrows .r.best i{background:var(--cream)}
.splitrows .r .v{text-align:right;color:var(--cream);font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:10px;margin:0 var(--gut);height:48px;border-radius:15px;background:rgba(var(--tx),.07);padding:0 14px;color:var(--t3)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--cream);font:400 16px var(--ui)}
.note{margin:14px var(--gut) 0;font:400 13px/1.45 var(--ui);color:var(--t3)}
textarea.field,input.field{display:block;width:calc(100% - 40px);margin:0 var(--gut);background:rgba(var(--tx),.07);border:0;border-radius:15px;padding:14px;color:var(--cream);font:400 15.5px var(--ui);outline:0;resize:none}

/* =====================================================================
   NEUMORPHIC SURFACE (today-neu). One warm graphite surface, var(--surf).
   Light comes from the top left, everywhere: every raised thing throws a
   soft dark shadow down-right and catches a faint warm light up-left; every
   pressed thing is the reverse, inside. No gloss, no gradients pretending to
   be a material, no bevel lines. Depth means state:
     raised  = a control you can press
     pressed = what is chosen, or done (with a check or fill as well, never colour alone)
     flat    = disabled, or not a control
   ===================================================================== */
:root{
  --surf:var(--surf); --surfHi:#2F2B26; --surfLo:#27231F;
  --ink:var(--surf); --ink2:var(--surf); --ink3:var(--surf);
  --t2:rgba(var(--tx),.68); --t3:rgba(var(--tx),.57); --t4:rgba(var(--tx),.30);
  --rec:#A39C92; --line:rgba(var(--sd),calc(.28 * var(--sda))); --line2:rgba(var(--tx),.10);
  --dk:rgba(var(--sd),calc(.62 * var(--sda))); --dk2:rgba(var(--sd),calc(.42 * var(--sda))); --lt:rgba(var(--sl),calc(.085 * var(--sla))); --lt2:rgba(var(--sl),calc(.055 * var(--sla)));
  /* raised, three heights */
  --r1:3px 3px 7px var(--dk2),-2px -2px 6px var(--lt2);
  --r2:6px 6px 14px var(--dk),-5px -5px 12px var(--lt);
  --r3:10px 10px 26px var(--dk),-8px -8px 20px var(--lt);
  /* pressed, two depths */
  --p1:inset 2px 2px 5px var(--dk),inset -2px -2px 5px var(--lt);
  --p2:inset 4px 4px 10px var(--dk),inset -3px -3px 9px var(--lt);
  --zero:0 0 0 transparent,0 0 0 transparent;
  --zeroi:inset 0 0 0 transparent;
  --press:cubic-bezier(.3,.7,.4,1); --back:cubic-bezier(.34,1.45,.55,1);
}
html,body{background:#1C1916}
.app{background:var(--surf)}
/* surface grain: one fine monochrome noise over everything, so no face reads as plastic */
.grain{position:absolute;inset:0;z-index:60;pointer-events:none;opacity:.07;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");background-size:160px 160px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--sun2);outline-offset:3px;border-radius:14px}
.sky{opacity:.55}

/* the shared press: down sinks (raised -> pressed) fast, release springs back */
.nm-r{box-shadow:var(--r2);transition:box-shadow .32s var(--back),transform .32s var(--back),background-color .2s}
.nm-r:active,.nm-r.down{box-shadow:var(--p1);transform:scale(.975);transition:box-shadow .09s var(--press),transform .09s var(--press)}

/* status + scrolled bar */
.sbar .ddata{background:var(--surf);border:0;box-shadow:var(--r1);color:var(--t2);transition:box-shadow .3s var(--back)}
.sbar .ddata:active{box-shadow:var(--p1)}
.topbar{background:rgba(var(--surfRGB),.97);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:0;box-shadow:0 8px 18px -6px var(--dk)}

/* header icons: small raised wells; active ones pressed */
.hicons{gap:8px;margin-right:-2px;margin-top:-2px}
.ib{width:38px;height:38px;border-radius:50%;background:var(--surf);box-shadow:var(--r1);color:var(--t2);transition:box-shadow .3s var(--back),transform .3s var(--back)}
.ib:active{background:var(--surf);box-shadow:var(--p1);transform:scale(.96);transition:box-shadow .08s,transform .08s}
.ib.on{color:var(--cream);box-shadow:var(--p1)}
.ib .n{top:-3px;right:-3px;background:var(--surf);color:var(--cream);box-shadow:var(--r1);font-weight:700}
.ctxchip{border:0;background:var(--surf);box-shadow:var(--p1);height:32px;padding:0 14px}

/* the day arc sits on the surface itself: it is light on the surface, not an object */
.arc .lbl{fill:var(--t3)}

/* results strip: each panel a low raised slab */
.strip{gap:14px;padding:6px var(--gut) 14px;margin-top:0;scroll-padding:0 var(--gut)}
.panel{flex-basis:80%;border-right:0;border-radius:24px;background:var(--surf);box-shadow:var(--r2);padding:11px 15px 11px}
.panel .mini{padding-top:6px}
.panel .big{margin-top:6px}
.panel .ln{margin-top:6px}
.panel .ttl{margin-top:6px}
.sec{margin-top:12px}
.row{padding:12px 0}
.strip+.sec,.strip+*{margin-top:12px}
.panel:last-child{flex-basis:80%}
.panel.solo{flex-basis:100%}
.panel .x{top:6px;right:6px;width:34px;height:34px;border-radius:50%;color:var(--t3);background:var(--surf);box-shadow:var(--r1);transition:box-shadow .3s var(--back)}
.panel .x:active{box-shadow:var(--p1)}
.nights,.splits{padding:5px 7px 3px;border-radius:11px;box-shadow:var(--p1);height:auto;width:max-content}
.nights i,.splits i{max-height:28px}
.nights i{background:rgba(var(--tx),.26)}
.nights i.gap{border-color:var(--t3)}
.prange .t:before{height:4px;top:3px;border-radius:2px;background:var(--surf);box-shadow:var(--p1)}
.weekd{padding:5px 9px 3px;border-radius:12px;box-shadow:var(--p1);height:auto;width:max-content}
.panel .act{background:var(--surf);color:var(--cream);box-shadow:var(--r1);transition:box-shadow .3s var(--back)}
.panel .act:active{box-shadow:var(--p1)}

/* rows: grooves instead of hairlines (a dark line with a faint light under it) */
.row{border-top:0}
.row+.row:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(var(--dk2) 0 1px,var(--lt) 1px 2px);pointer-events:none}
.rows .row:first-child:before{display:none}
.row.leaving{border-color:transparent}

/* row keys. Not done: raised, with a plus. Done: pressed in, filled, with a check. */
.keyw{min-width:60px}
.key{transition:transform .3s var(--back),box-shadow .3s var(--back)}
.key.down{transform:scale(.955);transition:transform .08s var(--press),box-shadow .08s var(--press)}
.key.rel{animation:none}
.k-round{width:48px;height:48px;border:0;background:var(--surf);box-shadow:var(--r2)}
.k-round.down{box-shadow:var(--p2)}
.k-round .fill{left:0;right:0;bottom:0;border-radius:0}
.k-round.done{border:0;box-shadow:var(--p2)}
.k-round.done .fill{height:100%;background:var(--sun);box-shadow:inset 3px 3px 7px rgba(90,25,5,.55),inset -2px -2px 6px rgba(255,190,150,.22)}
.k-round.done.anim .fill{animation:nrise .6s var(--ease)}
@keyframes nrise{0%{height:0;border-radius:50% 50% 0 0/10px 10px 0 0}70%{border-radius:50% 50% 0 0/4px 4px 0 0}100%{height:100%;border-radius:0}}
.k-round .pl{stroke:var(--cream)}
.k-round .ck.ghost{stroke:rgba(var(--tx),.34)}
.k-seg{border:0;background:var(--surf);box-shadow:var(--r2);height:48px;padding:0 12px;gap:5px}
.k-seg.down{box-shadow:var(--p1)}
.k-seg i{width:9px;height:24px;border-radius:5px;background:var(--surf);box-shadow:inset 1.5px 1.5px 3px var(--dk),inset -1px -1px 2px var(--lt)}
.k-seg i.on:after{border-radius:5px;background:var(--sun);box-shadow:inset 1px 1px 2px rgba(90,25,5,.5)}
.k-pill{border:0;background:var(--surf);box-shadow:var(--r2);height:48px;color:var(--cream)}
.k-pill.down{box-shadow:var(--p1)}
.k-pill.on{border:0;box-shadow:var(--p2);color:var(--sun2)}
.k-word{border:0;background:var(--surf);box-shadow:var(--r2);height:48px;transition:box-shadow .3s var(--back),transform .3s var(--back)}
.k-word:active{box-shadow:var(--p1);transform:scale(.97)}

/* water presets: raised tiles; a tap presses one in, light rises inside it and drains */
.amt{gap:10px;margin-top:14px}
.amt .key{height:46px;border-radius:15px;background:var(--surf);box-shadow:var(--r2)}
.amt .key.down{box-shadow:var(--p2)}
.amt .key.last{box-shadow:var(--r2)}
.amt .key.last span:after{content:"";position:absolute;left:50%;bottom:-8px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--t3)}
.amt .key.pour{box-shadow:var(--p2)}
.amt .key .fill{border-radius:0}
.level{height:6px;border-radius:3px;background:var(--surf);box-shadow:var(--p1);margin-top:12px}
.level i{top:1px;bottom:1px;left:1px;border-radius:2px}

/* Later: small raised keys inside the set type */
.tok .tk{width:38px;height:34px;border-radius:12px;background:var(--surf);box-shadow:var(--r1);transition:box-shadow .3s var(--back),transform .3s var(--back)}
.tok .tk.down{background:var(--surf);box-shadow:var(--p1);transform:scale(.95);transition:box-shadow .08s,transform .08s}
.tok.done .tk{box-shadow:var(--p1);color:var(--sun2)}

/* chips: raised; chosen ones pressed in, with the text brighter and a mark */
.chip{border:0;background:var(--surf);box-shadow:var(--r1);color:var(--t2);transition:box-shadow .3s var(--back),color .2s}
.chip:active{box-shadow:var(--p1)}
.chip.on{background:var(--surf);color:var(--cream);box-shadow:var(--p1);border:0}
.chip.on:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sun2);margin-right:7px;vertical-align:1px}
.chips{gap:10px;padding-top:8px}
.settled button i{width:8px;height:8px;background:var(--sun);box-shadow:inset 1px 1px 2px rgba(90,25,5,.6)}
.dateline{border-radius:16px;padding:0 12px;margin-left:calc(var(--gut) - 12px);width:calc(100% - 2 * var(--gut) + 24px);transition:box-shadow .3s var(--back)}
.dateline:active{box-shadow:var(--p1)}

/* suggestion: a low raised slab with a raised primary */
.sug{background:var(--surf);box-shadow:var(--r2);border-radius:24px;padding:18px}
.sug .sb{gap:10px}
.sug .sb .primary,.sug .sb .sec2,.sug .sb .dots{background:var(--surf);box-shadow:var(--r1);transition:box-shadow .3s var(--back),transform .3s var(--back)}
.sug .sb .primary{color:var(--cream);font-weight:600;box-shadow:var(--r2)}
.sug .sb .sec2{color:var(--t2)}
.sug .sb .primary:active,.sug .sb .sec2:active,.sug .sb .dots:active{box-shadow:var(--p1);transform:scale(.98)}
.addbtn{background:var(--surf);color:var(--cream);box-shadow:var(--r2);transition:box-shadow .3s var(--back),transform .3s var(--back)}
.addbtn svg{color:var(--sun2)}
.addbtn:active{box-shadow:var(--p2);transform:scale(.985)}
.foot button{border:0;background:var(--surf);box-shadow:var(--r1);color:var(--t2)}
.foot button:active{box-shadow:var(--p1)}

/* tab bar: flush with the surface, lifted by one soft edge; the current tab is pressed in; Log is the one big raised key */
.tabbar{background:var(--surf);backdrop-filter:none;-webkit-backdrop-filter:none;border-top:0;box-shadow:0 -10px 22px -8px var(--dk),0 -1px 0 var(--lt2)}
.tab{border-radius:16px;margin:0 4px;height:52px;padding-top:7px;color:var(--t3);transition:box-shadow .3s var(--back)}
.tab.on{box-shadow:var(--p1);color:var(--cream)}
.tab:active{box-shadow:var(--p1)}
.logkey{width:60px;height:60px;margin-top:-14px;background:var(--surf);color:var(--sun2);box-shadow:var(--r3);transition:box-shadow .34s var(--back),transform .34s var(--back)}
.logkey:active{transform:scale(.95);box-shadow:var(--p2);transition:box-shadow .08s var(--press),transform .08s var(--press)}

/* live bar and toast: raised slabs that float a little higher than everything else */
.livebar{background:var(--surf);border:0;box-shadow:var(--r3);border-radius:22px;height:64px}
.livebar .lp{left:18px;right:18px;bottom:7px;height:4px;border-radius:2px;background:var(--surf);box-shadow:var(--p1)}
.livebar .lp i{border-radius:2px}
.livebar button{background:var(--surf);box-shadow:var(--r1);color:var(--t2);transition:box-shadow .3s var(--back),transform .3s var(--back)}
.livebar button.end{background:var(--surf);color:var(--cream);box-shadow:var(--r2)}
.livebar button:active{box-shadow:var(--p1);transform:scale(.97)}
.toast{background:var(--surf);border:0;box-shadow:var(--r3),0 18px 40px rgba(var(--sd),calc(.35 * var(--sda)));border-radius:26px}
.toast .undo{background:var(--surf);color:var(--sun2);box-shadow:var(--r1);transition:box-shadow .3s var(--back)}
.toast .undo:active{box-shadow:var(--p1)}
.toast .bar{left:26px;right:26px;bottom:5px;height:3px;border-radius:2px;opacity:.8}

/* sheets: the same surface, risen; the grab is a groove */
.scrim{background:rgba(var(--sd),.55)}
.sheet{background:var(--surf);border-top:0;border-radius:32px 32px 0 0;box-shadow:0 -14px 40px rgba(var(--sd),calc(.45 * var(--sda))),0 -1px 0 var(--lt)}
.grab{width:42px;height:6px;background:var(--surf);box-shadow:var(--p1)}
.sh .close{width:40px;height:40px;margin:-6px -4px 0 0;border-radius:50%;background:var(--surf);box-shadow:var(--r1);color:var(--t2);transition:box-shadow .3s var(--back)}
.sh .close:active{box-shadow:var(--p1)}
.slist .li{border-top:0;position:relative}
.slist .li+.li:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(var(--dk2) 0 1px,var(--lt) 1px 2px)}
.slist .li .rm{padding:8px 12px;margin-left:6px;border-radius:12px;background:var(--surf);box-shadow:var(--r1);transition:box-shadow .3s var(--back)}
.slist .li .rm:active{box-shadow:var(--p1)}
.slist .li .dot{box-shadow:0 0 0 3px var(--surf),0 0 0 4px rgba(var(--sd),calc(.2 * var(--sda)))}
.btns{gap:12px}
.btn{background:var(--surf);box-shadow:var(--r2);color:var(--t2);transition:box-shadow .32s var(--back),transform .32s var(--back)}
.btn.primary{background:var(--surf);color:var(--cream);font-weight:600;box-shadow:var(--r2)}
.btn.primary:before{content:"";display:inline-block;width:6px;height:6px;margin-right:9px;border-radius:50%;background:var(--sun2);vertical-align:1px}
.btn.ghost{box-shadow:none;color:var(--t2)}
.btn:active{box-shadow:var(--p2);transform:scale(.985);transition:box-shadow .08s var(--press),transform .08s var(--press)}
.btn.ghost:active{box-shadow:var(--p1)}
.btn:disabled,.chip:disabled,.key[disabled]{box-shadow:none;color:var(--t4)}
.scrub{gap:12px;padding:10px var(--gut) 14px}
.scrub button{background:var(--surf);box-shadow:var(--r2);transition:box-shadow .3s var(--back),transform .3s var(--back)}
.scrub button:active,.scrub button.on{box-shadow:var(--p2)}
.scrub button.on{color:var(--sun2)}
.stepper{background:var(--surf);box-shadow:var(--p2);border-radius:22px;padding:9px}
.stepper button{border-radius:50%;background:var(--surf);box-shadow:var(--r2);color:var(--cream);transition:box-shadow .3s var(--back),transform .3s var(--back)}
.stepper button:active{box-shadow:var(--p1);transform:scale(.95);transition:box-shadow .07s,transform .07s}
.bars7{padding:10px 14px 6px;margin:0 var(--gut);border-radius:18px;box-shadow:var(--p1)}
.bars7 .c i{background:rgba(var(--tx),.24)}
.bars7 .c.gap i{border-color:var(--t3)}
.splitrows .r i{background:var(--surf);box-shadow:var(--p1);position:relative}
.splitrows .r.best i{background:var(--cream);box-shadow:none}
.search{background:var(--surf);box-shadow:var(--p2)}
textarea.field,input.field{background:var(--surf);box-shadow:var(--p2)}
.hyp{padding:0 4px}

/* a neumorphic switch, for any on/off (used by the options sheet's "every time" when present) */
.sw{position:relative;width:52px;height:30px;border-radius:15px;background:var(--surf);box-shadow:var(--p1);flex:none}
.sw:after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--surf);box-shadow:var(--r1);transition:transform .34s var(--back)}
.sw.on{background:var(--sun)}
.sw.on:after{transform:translateX(22px)}

/* the same pressed looks, as classes, so script-driven presses (and the press study shots) match :active */
.logkey.down{transform:scale(.95);box-shadow:var(--p2)}
.btn.down{box-shadow:var(--p2);transform:scale(.985)}
.chip.down,.ib.down,.tab.down,.tok .tk.down,.sh .close.down,.slist .li .rm.down,.toast .undo.down,.livebar button.down{box-shadow:var(--p1)}
.stepper button.down{box-shadow:var(--p1);transform:scale(.95)}
.scrub button.down{box-shadow:var(--p2)}
.k-round.down,.k-seg.down,.k-pill.down{transform:scale(.955)}

/* =====================================================================
   v2: ONE SURFACE, AND COLOUR WITH MEANING
   Everything is formed from the one page: nothing is a card laid on it.
     plateau  a broad, low rise with a soft fillet: something to act on now (Now rows, the suggestion, a date)
     well     a broad, shallow hollow: something to read or browse (results, Later)
     key      a small, crisp rise: the thing you press. Pressed in = chosen or done (with a check or fill too)
     engraved type and grooves: labels and divisions, never controls
   Colour is light inside the surface: a routine's hue fills its groove, its key when done, its bumps on the arc.
   ===================================================================== */
:root{
  --night:#98A2FC; --nightT:#B3BDFF;
  /* plateau: a wide soft rise plus a tight fillet where it leaves the page */
  --pl:12px 12px 28px rgba(var(--sd),calc(.46 * var(--sda))),-9px -9px 22px rgba(var(--sl),calc(.052 * var(--sla))),2px 2px 5px rgba(var(--sd),calc(.20 * var(--sda))),-1px -1px 3px rgba(var(--sl),calc(.035 * var(--sla)));
  --pl0:6px 6px 16px rgba(var(--sd),calc(.40 * var(--sda))),-5px -5px 13px rgba(var(--sl),calc(.045 * var(--sla))),1px 1px 3px rgba(var(--sd),calc(.18 * var(--sda))),-1px -1px 2px rgba(var(--sl),calc(.03 * var(--sla)));
  /* well: a shallow hollow with soft walls */
  --wl:inset 7px 7px 16px rgba(var(--sd),calc(.46 * var(--sda))),inset -6px -6px 14px rgba(var(--sl),calc(.045 * var(--sla))),inset 1px 1px 2px rgba(var(--sd),calc(.2 * var(--sda)));
  /* keys: tighter and crisper than plateaus, so a key never reads as a region */
  --r1:3px 3px 7px rgba(var(--sd),calc(.50 * var(--sda))),-2px -2px 6px rgba(var(--sl),calc(.06 * var(--sla)));
  --r2:5px 5px 12px rgba(var(--sd),calc(.58 * var(--sda))),-4px -4px 10px rgba(var(--sl),calc(.075 * var(--sla)));
  --deb:-1px -1px 0 rgba(var(--sd),calc(.45 * var(--sda))),1px 1px 0 rgba(var(--sl),calc(.06 * var(--sla)));
  --emb:2px 2px 5px rgba(var(--sd),calc(.55 * var(--sda))),-1px -1px 1px rgba(var(--sl),calc(.07 * var(--sla)));
  --groove:linear-gradient(rgba(var(--sd),calc(.5 * var(--sda))) 0 1px,rgba(var(--sl),calc(.06 * var(--sla))) 1px 2px);
}
.sky{opacity:.32}

/* header: the day is embossed out of the page, the date engraved into it */
.head h1{font-size:34px;text-shadow:var(--emb)}
.head .sub{text-shadow:var(--deb);color:var(--t2)}
.ib{box-shadow:var(--pl0)}
.ib svg{filter:drop-shadow(-.6px -.6px 0 rgba(var(--sd),calc(.5 * var(--sda)))) drop-shadow(.6px .6px 0 rgba(var(--sl),calc(.07 * var(--sla))))}
.ib .n{box-shadow:var(--pl0);color:var(--cream)}
.sbar .ddata{box-shadow:var(--pl0);text-shadow:var(--deb);padding:8px 12px}
.topbar{box-shadow:none}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--groove)}

/* section labels: engraved, small capitals. They name a group; they are never content or controls */
.sec{margin-top:14px}
.sech{margin-bottom:8px;align-items:center}
.sech h2{font:650 12px/1 var(--ui);letter-spacing:.11em;text-transform:uppercase;color:var(--t2);text-shadow:var(--deb)}
.sech .aside{font:500 13px var(--ui);color:var(--t2);text-shadow:var(--deb)}

/* results: wells you read, formed into the page; the hue of what they're about lights their kicker */
.strip{gap:12px;padding:4px var(--gut) 2px}
.panel .ln{font-size:13.5px;line-height:1.32}
.panel .mini{padding-top:6px}
.nights i,.splits i{max-height:24px}
.panel .ttl{font-size:20px}
.panel{background:var(--surf);box-shadow:var(--wl);border-radius:26px;padding:11px 16px 11px;transition:box-shadow .3s var(--back)}
.panel:active{box-shadow:inset 9px 9px 20px rgba(var(--sd),calc(.55 * var(--sda))),inset -6px -6px 14px rgba(var(--sl),calc(.04 * var(--sla)))}
.panel .k{color:var(--ht,var(--t2));font-weight:600}
.panel .k .just{color:var(--sun2)}
.panel .k:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hf,var(--t3));box-shadow:0 0 6px var(--hf,transparent);flex:none}
.panel .big{font-weight:300}
.panel .x{box-shadow:var(--pl0)}
.nights,.splits,.weekd{box-shadow:none;padding:0}
.nights i.on{background:var(--night);box-shadow:0 0 8px rgba(152,162,252,.45)}
.splits i.best{background:var(--hf,var(--cream));box-shadow:0 0 8px var(--hf,transparent)}
.prange .t:before{box-shadow:inset 1px 1px 2px rgba(var(--sd),calc(.6 * var(--sda))),inset -1px -1px 1px rgba(var(--sl),calc(.06 * var(--sla)))}
.prange .t .m{background:var(--cream)}
.prange .r.b .t .m{background:var(--night)}

/* Now: each row a plateau risen out of the page, its routine's groove on the left */
.rows{display:grid;gap:10px;padding:0 var(--gut) 8px}
.row{padding:11px 12px 11px 32px;border-radius:24px;background:var(--surf);box-shadow:var(--pl)}
.row+.row:before{display:none}
.row .open{inset:0 84px 0 0;border-radius:24px}
.row.full .open{right:0;bottom:62px}
.row.full .amt{margin-top:12px}
.row .nm{font-size:21px;font-weight:550}
.row.lead .nm{font-size:26px}
.row .st{color:var(--t2)}
.row .st b{color:var(--cream);font-weight:550}
.inl{position:absolute;left:13px;top:15px;bottom:15px;width:7px;border-radius:4px;background:color-mix(in oklab,var(--hd,var(--surf)) 80%,var(--surf));box-shadow:inset 1.5px 1.5px 3px rgba(var(--sd),calc(.75 * var(--sda))),inset -1px -1px 2px rgba(var(--sl),calc(.07 * var(--sla)));overflow:hidden;pointer-events:none}
.inl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:var(--hf);box-shadow:inset 1px 1px 2px rgba(var(--sd),calc(.35 * var(--sda))),0 0 10px var(--hf);transition:height .7s var(--ease)}
.row.task .inl{background:var(--surf)}
.row.leaving{box-shadow:none}
@keyframes leave{0%{max-height:200px;opacity:1}100%{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:-12px}}

/* keys take their routine's light when done or chosen; the check stays dark on it */
.k-round.done .fill{background:var(--hf,var(--sun));box-shadow:inset 3px 3px 7px rgba(var(--sd),calc(.32 * var(--sda))),inset -2px -2px 6px rgba(255,255,255,.16),0 0 0 transparent}
.k-round.done .ck{stroke:var(--onHue)}
.k-round.done{box-shadow:var(--p2),0 0 18px -4px var(--hf,transparent)}
.k-seg i.on:after{background:var(--hf,var(--sun));box-shadow:inset 1px 1px 2px rgba(var(--sd),calc(.35 * var(--sda))),0 0 6px var(--hf,transparent)}
.k-pill{color:var(--cream)}
.k-pill svg{color:var(--ht,var(--cream))}
.k-pill.on{color:var(--ht,var(--sun2))}
.k-pill.on .livedot{background:var(--hf,var(--sun));box-shadow:0 0 8px var(--hf,var(--sun))}
/* every key wears its routine's hue on its glyph, so a key says whose it is before it's pressed (glyph only: not lit, not done) */
.k-round .pl{stroke:var(--ht,var(--cream))}
.k-round .ck.ghost{stroke:color-mix(in oklab,var(--ht,var(--cream)) 60%,transparent)}
.k-seg i{background:color-mix(in oklab,var(--hd,var(--surf)) 40%,var(--surf))}
.tok .tk{color:var(--ht,var(--cream))}
/* secondary keys: lower, quieter text */
.k-word{box-shadow:var(--r1);color:var(--t2);height:42px}
.amt .key .fill{background:var(--hf,var(--sun))}
.amt .key.last span:after{background:var(--hf,var(--t3))}
.level{height:7px;border-radius:4px;box-shadow:inset 1.5px 1.5px 3px rgba(var(--sd),calc(.75 * var(--sda))),inset -1px -1px 2px rgba(var(--sl),calc(.07 * var(--sla)))}
.level i{background:var(--hf,var(--sun));box-shadow:0 0 10px var(--hf,transparent);top:1px;bottom:1px}
@keyframes pourtx{0%,45%{color:var(--onHue)}100%{color:var(--cream)}}

/* a date: a low plateau, neutral (dated tasks have no hue) */
.dateline{background:var(--surf);box-shadow:var(--pl0);margin:14px var(--gut) 0;width:calc(100% - 2 * var(--gut));padding:0 16px;border-radius:20px;min-height:52px}
.dateline:active{box-shadow:var(--p1)}

/* Later: one well; each routine marked by a small lit pit in its hue, lit only once there's something this period */
.later{margin:0 var(--gut);padding:6px 16px 10px;border-radius:26px;box-shadow:var(--wl)}
.lg .h{text-shadow:var(--deb);font-size:12.5px;color:var(--t3)}
.tok{gap:6px}
.tok .hp{width:9px;height:9px;border-radius:50%;flex:none;background:color-mix(in oklab,var(--hd,var(--surf)) 90%,var(--surf));box-shadow:inset 1px 1px 2px rgba(var(--sd),calc(.6 * var(--sda))),inset -1px -1px 1px rgba(var(--sl),calc(.08 * var(--sla)))}
.tok .hp.some,.tok.done .hp{background:var(--hf);box-shadow:inset 1px 1px 1px rgba(var(--sd),calc(.3 * var(--sda))),0 0 7px var(--hf)}
.tok .tn{color:var(--cream)}
.tok.done .tn{color:var(--ht,var(--sun2))}
.tok.done .tk{color:var(--ht,var(--sun2))}

/* Settled: no form at all. Done things recede into the page; the lit pit says it's done */
.settled button{color:var(--t2);text-shadow:var(--deb)}
.settled button i{background:var(--hf,var(--sun));box-shadow:0 0 6px var(--hf,transparent)}

/* suggestion: a plateau; the primary key carries the routine's hue, the others don't */
.sug{box-shadow:var(--pl);border-radius:26px}
.sug .sn{display:flex;align-items:center;gap:9px}
.sug .sn:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hf,var(--t3));box-shadow:0 0 7px var(--hf,transparent)}
.sug .sb .primary{color:var(--ht,var(--cream))}
.sug .sb .primary:before{content:"";display:inline-block;width:6px;height:6px;margin-right:8px;border-radius:50%;background:var(--hf,var(--sun2));vertical-align:1px}
.sug .sb .sec2,.sug .sb .dots{box-shadow:var(--r1);color:var(--t2)}

/* tab bar: the same page, divided by one groove; the current tab pressed in */
.tabbar{box-shadow:none}
.tabbar:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--groove)}
.tab svg{filter:drop-shadow(-.6px -.6px 0 rgba(var(--sd),calc(.5 * var(--sda)))) drop-shadow(.6px .6px 0 rgba(var(--sl),calc(.06 * var(--sla))))}
.tab.on{box-shadow:var(--p1)}
.tab.on svg{color:var(--sun2);filter:none}
.logkey{margin-top:-16px;box-shadow:var(--pl),0 0 0 6px var(--surf)}
.livebar{box-shadow:var(--pl)}
.livebar .lp i{background:var(--hf,var(--sun));box-shadow:0 0 8px var(--hf,transparent)}
.livebar button.end{color:var(--ht,var(--cream))}

/* sheets: colour where it identifies; a routine's sheet gives its primary key the routine's hue */
.sheet .btn.primary{color:var(--ht,var(--cream))}
.sheet .btn.primary:before{background:var(--hf,var(--sun2))}
.sheet .scrub button.on{color:var(--ht,var(--sun2))}
.hdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:4px;box-shadow:0 0 8px currentColor}
.swatches{display:flex;gap:12px;padding:4px var(--gut) 2px;flex-wrap:wrap}
.sw8{width:44px;height:44px;border-radius:50%;background:var(--surf);box-shadow:var(--r1);display:grid;place-items:center;transition:box-shadow .3s var(--back)}
.sw8 i{width:20px;height:20px;border-radius:50%;background:var(--hf);box-shadow:inset 1px 1px 2px rgba(var(--sd),calc(.35 * var(--sda)))}
.sw8.on{box-shadow:var(--p2)}
.sw8.on i{box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--hf),0 0 10px var(--hf)}
.sw8:active{box-shadow:var(--p1)}


/* =====================================================================
   v3: hero variants and the dock
   ===================================================================== */
/* the hero switcher: a tiny pressed track with raised keys, only for this prototype */
.hsw{pointer-events:auto;display:flex;gap:3px;padding:3px;border-radius:12px;box-shadow:var(--p1);margin-left:auto;margin-right:8px}
.hsw button{height:24px;min-width:26px;padding:0 6px;border-radius:9px;font:600 11px/1 var(--ui);color:var(--t3)}
.hsw button.on{background:var(--surf);box-shadow:var(--r1);color:var(--cream)}
.arc.hero{height:160px}
.arc.hero > div{position:absolute;inset:0}

/* Hero 1, the dial */
.hero-dial{display:flex;align-items:center;gap:18px;padding:0 var(--gut)}
.dl-disc{position:relative;flex:none;width:150px;height:150px;border-radius:50%;background:var(--surf);box-shadow:var(--pl)}
.dl-disc svg{position:absolute;left:0;top:0;width:150px;height:150px;overflow:visible}
.dl-well{position:absolute;left:41px;top:41px;width:68px;height:68px;border-radius:50%;box-shadow:var(--p2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dl-well b{font:500 17px/1 var(--disp);color:var(--sun2);letter-spacing:-.01em}
.dl-well span{font:500 10.5px/1 var(--ui);color:var(--t2)}
.dl-h{position:absolute;transform:translate(-50%,-50%);font:600 8.5px/1 var(--ui);color:var(--t3);text-shadow:var(--deb)}
.dl-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.dl-night{font:500 13px/1.25 var(--ui);color:var(--nightT);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.dl-night span{color:var(--t2);margin-left:-7px}
.dl-night i{width:7px;height:7px;border-radius:50%;background:var(--night);box-shadow:0 0 7px var(--night);flex:none;align-self:center}
.dl-night.miss{color:var(--t2)}
.dl-night.miss i{background:none;border:1.5px dashed var(--t3);box-shadow:none;width:8px;height:8px}
.dl-list{display:grid;gap:6px}
.dl-r{display:grid;grid-template-columns:9px 1fr auto;align-items:center;gap:8px;font:400 13.5px/1.1 var(--ui);color:var(--cream)}
.dl-r i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor}
.dl-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-r .v{color:var(--t2);font-size:13px}
.dl-more,.dl-empty{font:400 12.5px/1.35 var(--ui);color:var(--t3)}

/* Hero 2, the hours */
.hero-hours > *{position:absolute}
.hr-night{border-radius:12px;box-shadow:var(--p2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(rgba(152,162,252,.16),rgba(152,162,252,.30));overflow:hidden}
.hr-night:after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:inset 3px 3px 7px rgba(var(--sd),calc(.6 * var(--sda))),inset -2px -2px 5px rgba(var(--sl),calc(.05 * var(--sla)))}
.hr-night b{font:500 17px/1 var(--disp);color:var(--nightT)}
.hr-night b small{font:500 11px var(--ui);margin-left:1px}
.hr-night.miss{background:none;box-shadow:inset 0 0 0 1.5px rgba(var(--tx),.18)}
.hr-night.miss:after{display:none}
.hr-night.miss b{color:var(--t3)}
.hr-c{border-radius:7px;overflow:hidden}
.hr-c.past,.hr-c.cur{box-shadow:inset 2.5px 2.5px 5px rgba(var(--sd),calc(.7 * var(--sda))),inset -2px -2px 4px rgba(var(--sl),calc(.06 * var(--sla)))}
.hr-c.fut{box-shadow:inset 1px 1px 2px rgba(var(--sd),calc(.45 * var(--sda))),inset -1px -1px 1px rgba(var(--sl),calc(.04 * var(--sla)));opacity:.75}
.hr-c.cur{box-shadow:inset 2.5px 2.5px 5px rgba(var(--sd),calc(.7 * var(--sda))),inset -2px -2px 4px rgba(var(--sl),calc(.06 * var(--sla))),inset 0 0 0 1.5px rgba(255,143,94,.65)}
.hr-elapsed{position:absolute;left:0;right:0;top:0;background:rgba(255,143,94,.10)}
.hr-s{position:absolute;left:3px;right:3px;border-radius:3px;box-shadow:inset 1px 1px 1px rgba(255,255,255,.18),inset -1px -1px 1px rgba(var(--sd),calc(.25 * var(--sda))),0 0 6px currentColor}
.hr-rec{width:4px;height:4px;border-radius:50%;background:var(--rec)}
.hr-lb{font:500 11px/1 var(--ui);color:var(--t3);text-shadow:var(--deb);white-space:nowrap}
.hr-lb.nt{color:var(--nightT)}
.hr-sun{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:2px 2px 4px rgba(var(--sd),calc(.7 * var(--sda))),0 0 12px rgba(255,107,61,.6),inset -2px -2px 3px rgba(120,30,5,.35),inset 2px 2px 3px rgba(255,210,180,.35)}
.hr-now{font:600 12px/1 var(--ui);color:var(--sun2);white-space:nowrap;margin-top:1px}

/* Hero 3, the lanes */
.hero-lanes > *{position:absolute}
.ln-night{height:10px;border-radius:5px;background:var(--night);box-shadow:0 0 9px rgba(152,162,252,.55),inset 1px 1px 1px rgba(255,255,255,.2),inset -1px -1px 1px rgba(var(--sd),calc(.25 * var(--sda)))}
.ln-night.miss{height:2px;background:none;border-top:2px dotted rgba(var(--tx),.3);box-shadow:none}
.ln-nt{font:500 12px/1 var(--ui);color:var(--nightT);white-space:nowrap}
.ln-nt.miss{color:var(--t2)}
.ln-g{height:8px;border-radius:4px;box-shadow:inset 1.5px 1.5px 3px rgba(var(--sd),calc(.75 * var(--sda))),inset -1px -1px 2px rgba(var(--sl),calc(.07 * var(--sla)))}
.ln-g.fut{box-shadow:inset 1px 1px 1.5px rgba(var(--sd),calc(.45 * var(--sda))),inset -1px -1px 1px rgba(var(--sl),calc(.04 * var(--sla)));border-radius:0 4px 4px 0;opacity:.7}
.ln-name{font:500 12px/16px var(--ui);white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ln-b,.ln-cap{height:10px;border-radius:5px;box-shadow:1.5px 1.5px 3px rgba(var(--sd),calc(.7 * var(--sda))),0 0 7px currentColor,inset 1px 1px 1px rgba(255,255,255,.25),inset -1px -1px 1px rgba(var(--sd),calc(.25 * var(--sda)))}
.ln-b{width:10px}
.ln-rec{width:5px;height:5px;border-radius:50%;background:var(--rec)}
.ln-lb{font:500 11px/1 var(--ui);color:var(--t3);transform:translateX(-50%);text-shadow:var(--deb)}
.ln-needle{width:2px;border-radius:1px;background:linear-gradient(rgba(255,143,94,.9),rgba(255,143,94,.35));box-shadow:0 0 6px rgba(255,107,61,.5)}
.ln-sun{width:13px;height:13px;border-radius:50%;background:var(--sun);box-shadow:2px 2px 4px rgba(var(--sd),calc(.7 * var(--sda))),0 0 12px rgba(255,107,61,.6),inset -2px -2px 3px rgba(120,30,5,.35),inset 2px 2px 3px rgba(255,210,180,.35)}
.ln-now{font:600 12px/1 var(--ui);color:var(--sun2);white-space:nowrap}
.ln-empty{font:400 13px/1.35 var(--ui);color:var(--t3);max-width:240px;white-space:normal}

/* the dock: a plateau formed from the page, holding engraved tabs; the current tab pressed in and lit; + the one primary key, risen from a carved collar */
.tabfade{position:absolute;left:0;right:0;bottom:0;height:118px;z-index:24;pointer-events:none;background:linear-gradient(rgba(var(--surfRGB),0),var(--surf) 52%)}
.tabbar{left:12px;right:12px;bottom:14px;height:68px;border-radius:26px;background:var(--surf);box-shadow:var(--pl);padding:7px 6px;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center}
.tabbar:before{display:none}
.tab{height:54px;margin:0 3px;padding-top:8px;gap:5px;border-radius:19px;color:var(--t3);font:550 10.5px/1 var(--ui);text-shadow:var(--deb);transition:box-shadow .3s var(--back),color .2s}
.tab svg{filter:drop-shadow(-.7px -.7px 0 rgba(var(--sd),calc(.55 * var(--sda)))) drop-shadow(.7px .7px 0 rgba(var(--sl),calc(.07 * var(--sla))))}
.tab:active,.tab.down{box-shadow:var(--p1)}

/* =====================================================================

   tilt and every shadow on the page follows. Heights, in px of imagined lift:

   a long key-light shadow that lengthens with height, a soft ambient, a faint bounce

/* =====================================================================
   ELEVATION AS A FUNCTION. Each form has one number, --h (registered, so it animates):
   +1 plateau, 0 page, -1 well; keys, the dock, sheets and toasts higher. Its shadow,
   rim and tone are computed from --h and the light direction --lx/--ly (on the root).
   1 unit of --h = 6 px of imagined lift. Raised parts scale with max(h,0), carved
   parts with max(-h,0), so animating --h through 0 turns a rise into a hollow smoothly.
   ===================================================================== */
@property --h { syntax: '<number>'; inherits: false; initial-value: 0; }
@property --lx { syntax: '<number>'; inherits: true; initial-value: .6; }
@property --ly { syntax: '<number>'; inherits: true; initial-value: .8; }
.app{--lx:.6;--ly:.8}
*{
  --eR:max(var(--h),0); --eD:max(calc(var(--h) * -1),0); --eR1:min(var(--eR),1); --eD1:min(var(--eD),1);
  --elev:
    calc(var(--lx) * var(--eR) * .72px) calc(var(--ly) * var(--eR) * .72px) calc(var(--eR) * 1.5px + var(--eR1) * 1px) rgba(var(--sd),calc(.46 * var(--sda))),
    calc(var(--lx) * var(--eR) * 5.1px) calc(var(--ly) * var(--eR) * 5.1px) calc(var(--eR) * 9px) rgba(var(--sd),calc(.36 * var(--sda))),
    0 calc(var(--eR) * 1.8px) calc(var(--eR) * 14.4px) rgba(var(--sd),calc(.14 * var(--sda))),
    calc(var(--lx) * var(--eR) * -2.7px) calc(var(--ly) * var(--eR) * -2.7px) calc(var(--eR) * 7.2px) rgba(var(--sl),calc(.042 * var(--sla))),
    inset calc(var(--lx) * var(--eR1) * -1px) calc(var(--ly) * var(--eR1) * -1px) 0 rgba(var(--sl),calc(.06 * var(--sla))),
    inset calc(var(--lx) * var(--eR1) * 1px) calc(var(--ly) * var(--eR1) * 1px) calc(var(--eR1) * 1px) rgba(var(--sd),calc(.16 * var(--sda))),
    inset calc(var(--lx) * var(--eD) * 5.6px) calc(var(--ly) * var(--eD) * 5.6px) calc(var(--eD) * 12.6px) rgba(var(--sd),calc(.62 * var(--sda))),
    inset calc(var(--lx) * var(--eD) * -4.2px) calc(var(--ly) * var(--eD) * -4.2px) calc(var(--eD) * 10.5px) rgba(var(--sl),calc(.055 * var(--sla))),
    inset calc(var(--lx) * var(--eD1) * 1px) calc(var(--ly) * var(--eD1) * 1px) calc(var(--eD1) * 1px) rgba(var(--sd),calc(.28 * var(--sda)));
  /* closer to the light is a touch lighter; deeper is a touch darker */
  --tone:color-mix(in oklab,color-mix(in oklab,var(--surf),var(--lift) calc(var(--eR) * 1.1%)),var(--deep) calc(var(--eD) * 4%));
}
/* every form: its height, and the one recipe */
.row,.sug,.dateline,.dl-disc,.panel,.later,.hsw,.hsw button,
.k-word,.tok .tk,.ib,.ib .n,.sbar .ddata,.panel .x,.chip,.sug .sb .primary,.sug .sb .sec2,.sug .sb .dots,.sh .close,.slist .li .rm,.toast .undo,.livebar button,.foot button,
.k-round,.k-seg,.k-pill,.amt .key,.btn,.stepper,.stepper button,.scrub button,.sw8,.addbtn,.search,textarea.field,input.field,.grab,
.tabbar,.tab,.logkey,.logkey:before,.livebar,.toast,
.f,.fk,.tabbar .tw,.hero-dial .dl-well{box-shadow:var(--elev);background-color:var(--tone)}
/* morph-lab hooks: .f regions and .fk keys take the same recipe; the engine sets --h per frame (never a CSS transition on --h);
   .tw is the dock's pressed well the engine places under the current tab; .held is the + while the Log sheet is open */
.tabbar .tw{position:absolute;border-radius:19px;--h:-.55;pointer-events:none}
.logkey.held{--h:-.64}
.row,.sug,.dateline,.dl-disc{--h:1}
.panel,.later{--h:-1}
.panel:active{--h:-1.3}
.k-word,.tok .tk,.ib,.ib .n,.sbar .ddata,.panel .x,.chip,.sug .sb .sec2,.sug .sb .dots,.sh .close,.slist .li .rm,.toast .undo,.livebar button,.foot button,.hsw button.on{--h:.85}
.hsw button{--h:0}
.hsw button.on{--h:.85}
.k-round,.k-seg,.k-pill,.amt .key,.amt .key.last,.btn,.btn.primary,.stepper button,.scrub button,.livebar button.end,.sug .sb .primary,.sw8,.addbtn{--h:1.5}
.btn.ghost,.btn:disabled,.chip:disabled,.key[disabled]{--h:0}
.tabbar{--h:2.3}
.tab{--h:0}
.livebar{--h:3}
.logkey{--h:3.3}
.logkey:before{--h:-.55}
.toast{--h:5.7}
/* carved: tracks, fields, the grab, the switcher */
.hsw,.grab{--h:-.36}
.stepper,.search,textarea.field,input.field{--h:-.64}
/* pressed in: chosen, done, or held down */
.k-seg.down,.k-word:active,.k-word.down,.chip.on,.chip:active,.chip.down,.ib.on,.ib:active,.ib.down,.tab.on,.tab:active,.tab.down,.tok .tk.down,.tok.done .tk,.sh .close:active,.sh .close.down,.slist .li .rm:active,.slist .li .rm.down,.toast .undo:active,.toast .undo.down,.livebar button:active,.livebar button.down,.stepper button:active,.stepper button.down,.panel .x:active,.sbar .ddata:active,.sug .sb .sec2:active,.sug .sb .dots:active,.btn.ghost:active,.foot button:active,.sw8:active{--h:-.36}
.k-round.down,.k-round.done,.k-pill.down,.k-pill.on,.amt .key.down,.amt .key.pour,.btn:active,.btn.down,.scrub button:active,.scrub button.on,.scrub button.down,.logkey:active,.logkey.down,.sw8.on,.addbtn:active,.sug .sb .primary:active,.dateline:active{--h:-.64}
.tab.on{--h:-.55}
.row.leaving{--h:0}
/* tabs and switcher keys share their bar's tone; only the shadow says pressed */
.tab,.tab.on,.hsw button{background-color:transparent}
.hsw button.on{background-color:var(--tone)}
/* a done key keeps its routine's light glowing out of its hollow */
.k-round.done{box-shadow:var(--elev),0 0 18px -4px var(--hf,transparent)}
.sw8.on i{box-shadow:0 0 0 3px var(--tone),0 0 0 5px var(--hf),0 0 10px var(--hf)}


/* =====================================================================
   v4: the dial, screen-wide
   ===================================================================== */
.arc.hero.h1{height:auto;cursor:default}
.arc.hero.h1 > .hero-dial{position:relative;inset:auto;display:flex;justify-content:center;align-items:flex-start;padding:6px 0 8px}
.hero-dial .dl-disc{position:relative;flex:none;border-radius:50%;touch-action:pan-y;--h:1.2}
.hero-dial .dl-disc svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.hero-dial .dl-h{position:absolute;transform:translate(-50%,-50%);font:600 12px/1 var(--ui);color:var(--t2);text-shadow:var(--deb);pointer-events:none}
.hero-dial .dl-h.m{font-size:13.5px;color:var(--cream)}
.hero-dial .dl-well{position:absolute;border-radius:50%;--h:-.9;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;cursor:pointer}
.hero-dial .dl-well #dlc{display:flex;flex-direction:column;align-items:center;gap:5px;max-width:100%}
.hero-dial .dl-well b{font:400 34px/1 var(--disp);letter-spacing:-.02em;color:var(--cream)}
.hero-dial .dl-well b.now{color:var(--sun2);font-weight:450}
.hero-dial .dl-well .s{font:500 13px/1.2 var(--ui);color:var(--cream)}
.hero-dial .dl-well .s.nt{color:var(--nightT)}
.hero-dial .dl-well .s.nt.miss{color:var(--t2)}
.hero-dial .dl-well .k{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--ui);color:var(--cream)}
.hero-dial .dl-well .k i,.hero-dial .dl-well .li i{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.hero-dial .dl-well .hint{font:400 11px/1.25 var(--ui);color:var(--t3);max-width:130px}
.hero-dial .dl-well .ls{display:grid;gap:5px;margin-top:2px}
.hero-dial .dl-well .li{display:grid;grid-template-columns:8px auto auto;align-items:center;gap:6px;font:500 13px/1.15 var(--ui);color:var(--cream);white-space:nowrap}
.hero-dial .dl-well .li em{font-style:normal;color:var(--t2);font-weight:400}
.hero-dial .dl-well .more{font:400 11.5px var(--ui);color:var(--t3)}
.hero-dial .db{cursor:pointer;transition:opacity .25s}
.hero-dial .db.dim,.hero-dial .drec.dim{opacity:.16}
.hero-dial.focused .dlv,.hero-dial.scrubbing .dlv{opacity:.45}
.hero-dial .dbn{font:700 9.5px var(--ui);fill:var(--onHue);pointer-events:none}
.hero-dial .db:focus-visible{outline:none}
.hero-dial .db:focus-visible circle:first-child{stroke:var(--sun2);stroke-width:2}


/* =====================================================================
   v4: surfaces. The page colour, text tones, shadow and light balance all come from
   a handful of variables set on .app by applySurface() (?surface=0..3)
   ===================================================================== */
.app{--cream:rgb(var(--tx));--t2:rgba(var(--tx),var(--a2));--t3:rgba(var(--tx),var(--a3));--t4:rgba(var(--tx),var(--a4));--ink:var(--surf);
  --line:rgba(var(--sd),calc(.28 * var(--sda)));--line2:rgba(var(--tx),.10);background:var(--surf);color:var(--cream)}
.ssw{pointer-events:auto;display:flex;gap:4px;margin-left:10px;padding:3px;border-radius:12px;box-shadow:var(--elev);--h:-.36}
.ssw button{width:19px;height:24px;display:grid;place-items:center;border-radius:8px}
.ssw button i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(var(--tx),.35)}
.ssw button.on{box-shadow:var(--elev);--h:.85;background-color:var(--tone)}
.ssw button.on i{box-shadow:0 0 0 1.5px var(--sun2)}
.hsw{margin-left:6px}
.sbar{padding-left:26px;padding-right:14px}
.sbar .ddata{padding:8px 9px;white-space:nowrap}
.sbar .clk{color:var(--cream)}
/* a light page: light can't glow on light, so glows turn to soft tinted shadows and the grain is quieter */
.lightsurf .grain{opacity:.05}
.lightsurf .tab.on svg,.lightsurf .logkey svg{filter:none}
.lightsurf .head h1{text-shadow:-1px -1px 1px rgba(255,255,255,.85),1px 1px 2px rgba(var(--sd),.28)}


/* v5: Ink is the page. The scrub knob is a moulded ring riding the groove, with a lit pit; the hour it reads glows in the groove */
.hero-dial .dlk{fill:var(--s9)}
.hero-dial .dlkr{stroke:var(--cream);opacity:.85}
.hero-dial .dlkp{fill:var(--sun2)}
.hero-dial .dlhour{stroke:rgba(var(--tx),.16)}

  const a = arcModel(scrollEl.clientWidth || 390); const x = a.X(Math.max(a.start, Math.min(a.end, n))), y = a.Y(Math.max(a.start, Math.min(a.end, n)));

// ---------- results strip ----------
function panels() {
  const out = [];
  S.moments.filter(m => !U.dismissed.has(m.id)).forEach(m => {
    const x = `<span class="x" role="button" tabindex="0" data-act="dismiss" data-id="${m.id}" aria-label="Hide for now"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2l-8 8"/></svg></span>`;
    if (m.kind === 'night') { const sl = S.sleep; const mx = Math.max(480, ...sl.nights.filter(Boolean));
      out.push(`<button class="panel" style="--hf:var(--night);--ht:var(--nightT)" data-act="sheet" data-s="sleep" aria-label="Last night, ${dur(sl.asleep)} asleep. Open the night">${x}<span class="k">Last night, ${dur(sl.asleep)}</span><span class="ttl">${esc(sl.head)}</span><span class="ln">${esc(sl.line)}</span><span class="mini"><span class="nights">${sl.nights.map((v, i) => `<i class="${v == null ? 'gap' : i === sl.nights.length - 1 ? 'on' : ''}" style="height:${v ? Math.max(8, 30 * v / mx) : 6}px"></i>`).join('')}</span></span></button>`); }
    if (m.kind === 'nightmiss') out.push(`<div class="panel solo"><span class="k">Last night</span><span class="ttl" style="color:var(--t2)">Not in yet</span><span class="ln">It arrives from your Watch once you’re up. Nothing is counted until it does.</span></div>`);
    if (m.kind === 'run') { const mx = Math.max(...m.splits), mn = Math.min(...m.splits);
      out.push(`<button class="panel"${hs('run')} data-act="sheet" data-s="run" data-id="${m.id}" aria-label="${esc(m.kick)}: ${m.dist} km run. Open the report">${x}<span class="k">${m.just ? `<span class="just">${esc(m.kick)}</span>` : esc(m.kick)}</span><span class="big tnum">${m.dist}<small>km run</small></span><span class="ln"><b>${m.pace} /km</b>. ${esc(m.fact)}.</span><span class="mini"><span class="splits">${m.splits.map(s => `<i class="${s === mn ? 'best' : ''}" style="height:${10 + 24 * (mx - s) / Math.max(1, mx - mn)}px"></i>`).join('')}</span></span></button>`); }
    if (m.kind === 'pattern') { const lo = Math.min(m.a[2], m.b[2]) - 10, hi = Math.max(m.a[3], m.b[3]) + 10, p = v => (v - lo) / (hi - lo) * 100;
      const r = (q, c) => `<span class="r ${c}"><span>${q[0]}</span><span class="t"><i class="s" style="left:${p(q[2])}%;width:${p(q[3]) - p(q[2])}%"></i><i class="m" style="left:${p(q[1])}%"></i></span><span class="v tnum">${dur(q[1])}</span></span>`;
      out.push(`<button class="panel" style="--hf:var(--night);--ht:var(--nightT)" data-act="sheet" data-s="pattern" aria-label="Observation about sleep. Open">${x}<span class="k">An observation, ${m.to.toLowerCase()}</span><span class="ttl">${esc(m.title)}</span><span class="mini"><span class="prange">${r(m.a, 'b')}${r(m.b, 'a')}</span><span class="ln" style="margin-top:8px">From ${m.n} days on record. A hint, not proof.</span></span></button>`); }
    if (m.kind === 'week') { out.push(`<button class="panel" data-act="sheet" data-s="week" aria-label="Play this week back">${x}<span class="k">${m.range}, so far</span><span class="ttl">${esc(m.title)}</span><span class="mini"><span class="weekd">${m.days.map((d, i) => `<span class="c${i === 6 ? ' now' : ''}">${'<i></i>'.repeat(Math.round(d[1] / 1.5))}<span>${d[0]}</span></span>`).join('')}</span></span></button>`); }
    if (m.kind === 'sick') out.push(`<div class="panel"><span class="k">Sick, since yesterday</span><span class="ttl">Routines rest. Nothing is expected of you.</span><span class="ln">Dates you set still show. Everything else waits, and nothing counts against you.</span></div>`);
    if (m.kind === 'day1') out.push(`<div class="panel solo"><span class="k">Day one</span><span class="ttl">Start with one thing</span><span class="ln">Log anything below and it gathers on the arc above. Last night appears here once sleep is connected.</span></div>`);
    if (m.kind === 'back') out.push(`<button class="panel" data-act="sheet" data-s="back">${x}<span class="k">Since you’re back</span><span class="ttl">Water and Stretch, already</span><span class="ln">1 to 21 Nov is set aside, not missed. Your totals are where you left them.</span></button>`);
  });
  if (!out.length) return '';

// ---------- rows ----------
function rowHtml(id, i, leadId, firstId) {
  const n = intent(id);
  if (n) {
    const done = U.fx.key === n.id ? ' done anim' : '';
    return `<div class="row task" data-row="${n.id}"><span class="inl" aria-hidden="true"></span><button class="open" data-act="sheet" data-s="intent" data-id="${n.id}" aria-label="${esc(n.title)}: done, start or a new date"></button><div><div class="nm">${esc(n.title)}</div><div class="st"><b>${esc(n.when)}</b>${n.repeat ? `, ${esc(n.repeat)}` : ''}${n.started ? ', started' : ''}</div></div>
      <div class="keyw"><button class="key k-word" data-act="onit" data-id="${n.id}">${n.est ? `${n.est} min` : 'On it'}</button><button class="key k-round${done}" data-act="idone" data-id="${n.id}" aria-label="Mark done: ${esc(n.title)}"><span class="fill"></span>${done ? CK : CK.replace('class="ck"', 'class="ck ghost"')}</button></div></div>`;
  }
  const x = byId(id); if (!x) return '';
  const cls = ['row', x.id === leadId ? 'lead' : '', U.completing === x.id ? 'completing' : '', U.leaving === x.id ? 'leaving' : '', x.m === 'amount' ? 'full' : ''].filter(Boolean).join(' ');
  let body = `<div><div class="nm">${esc(x.name)}</div><div class="st" data-st="${x.id}">${stateLine(x)}</div>`;
  if (x.m === 'amount') body += `<div class="level"><i style="width:${Math.min(100, 100 * x.v / x.aim)}%"></i></div>`;
  if (firstId === x.id && x.first) body += `<div class="first"><em>First step:</em> ${esc(x.first)}</div>`;
  body += '</div>';
  let tail = x.m === 'amount' ? `<div class="amt" role="group" aria-label="Log a familiar amount of water">${x.presets.map(p => `<button class="key${p === x.lastAmt ? ' last' : ''}${U.fx.pour === x.id + p ? ' pour' : ''}" data-key="${x.id}" data-amt="${p}" aria-label="Log ${p} ml of water"><span class="fill"></span><span>${p}</span></button>`).join('')}</div>` : keyHtml(x);
  return `<div class="${cls}" data-row="${x.id}"${hs(x.id)}><span class="inl" aria-hidden="true"><i style="height:${(100 * progOf(x)).toFixed(0)}%"></i></span><button class="open" data-act="sheet" data-s="item" data-id="${x.id}" aria-label="Open ${esc(x.name)}"></button>${body}${tail}</div>`;
}
function nowList() {
  const ids = S.order.filter(id => { const n = intent(id); if (n) return n.place === 'now' && !n.done; const x = byId(id); return x && (x.group === 'now' || U.completing === id || U.leaving === id); });
  // water is never the lead: an amount row gives the first place to the next one (rule 6)
  if (ids.length > 1 && byId(ids[0]) && byId(ids[0]).m === 'amount') { const j = ids.findIndex(id => !(byId(id) && byId(id).m === 'amount')); if (j > 0) ids.unshift(ids.splice(j, 1)[0]); }
  return ids;
}

// ---------- Later as set type ----------

  return `<button class="key tk${/^[+L]|End/.test(t) ? ' w' : ''}" data-key="${x.id}"${x.m === 'amount' ? ` data-amt="${x.lastAmt}"` : ''} aria-label="${esc(keyLabel(x))}">${t}</button>`;
}
function laterHtml() {
  const L = S.items.filter(x => x.group === 'later' && !(U.sugState === 'show' && S.sug && S.sug.id === x.id));
  if (!L.length) return '';
  const groups = WHEN.map(([k, h]) => [h, L.filter(x => (S.calm ? 'any' : x.when || 'any') === k)]).filter(g => g[1].length);

}

// ---------- render ----------
function render() {
  const sv = scrollEl.scrollTop;
  const a = arcSvg();
  const nowIds = nowList();
  const leadId = nowIds.find(id => byId(id) && byId(id).m !== 'amount');
  const MAX = 4; const shown = U.more || nowIds.length <= MAX + 1 ? nowIds : nowIds.slice(0, Math.max(MAX, ...nowIds.map((id, i) => (intent(id) || (S.live && S.live.id === id)) ? i + 1 : 0)));
  const firstId = shown.find(id => { const x = byId(id); return x && x.first && !x.v && !(S.live && S.live.id === id); });
  const dates = S.intents.filter(n => n.place === 'date' && !n.done);
  const settled = S.items.filter(x => x.group === 'settled');
  const heldN = S.intents.filter(n => !n.done).length ? S.held : 0;
  let h = '';
  h += `<header class="head"><div><h1>${S.dow}</h1><div class="sub">${S.date}${S.dayOne ? ', day one' : ''}</div>${S.ctx ? `<button class="ctxchip" data-act="sheet" data-s="context" aria-label="Context: ${S.ctx.label}, ${S.ctx.to}. Change"><i></i>${S.ctx.label}, ${S.ctx.to}</button>` : ''}</div>
    <div class="hicons">
      <button class="ib${S.ctx ? ' on' : ''}" data-act="sheet" data-s="context" aria-label="Context"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7.5"/><path d="M11 3.5v15M3.5 11h15" opacity=".55"/></svg></button>
      <button class="ib" data-act="sheet" data-s="feel" aria-label="How you feel"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 12c2.2-4 4.4-4 6.6 0s4.4 4 6.6 0c.9-1.6 1.8-2.4 2.8-2.6"/></svg></button>
      ${heldN ? `<button class="ib" data-act="sheet" data-s="held" aria-label="Held, ${heldN}"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 19V3.5h11l-2.5 4 2.5 4H5"/></svg><span class="n">${heldN}</span></button>` : ''}
      <button class="ib" data-act="logsheet" aria-label="Search everything"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9.5" cy="9.5" r="6"/><path d="M14 14l4.5 4.5"/></svg></button>
    </div></header>`;
  const W0 = scrollEl.clientWidth || 390;
  h += (HERO === 1 ? `<div class="arc hero h1" role="group" aria-label="Your day so far: ${S.entries.length} entries. Tap a bead to show one routine, drag the ring to read an hour, tap the centre for the whole day">` : `<div class="arc${HERO ? ' hero h' + HERO : ''}" data-act="sheet" data-s="day" role="button" aria-label="Your day so far: ${S.entries.length} entries. Open the day">`) + `${HERO === 1 ? heroDial(W0) : HERO === 2 ? heroHours(W0) : HERO === 3 ? heroLanes(W0) : a.svg}${!S.entries.length && S.dayOne && !HERO ? '<div class="arcnote">What you log gathers on the day.</div>' : ''}</div>`;
  h += panels();
  if (S.welcome) h += `<p class="welcome">${S.welcome}</p>`;
  // Now

  if (shown.length) h += `<div class="rows${Date.now() < U.lock ? ' locked' : ''}" id="rows">${shown.map((id, i) => rowHtml(id, i, leadId, firstId)).join('')}</div>`;

  if (S.tonight) h += `<section class="sec" style="margin-top:22px"><div class="sech"><h2>Tonight</h2></div><div class="chips">${S.tonight.map(t => `<button class="chip${U.tonight[t.id] ? ' on' : ''}" data-act="tonight" data-id="${t.id}" aria-pressed="${!!U.tonight[t.id]}">${U.tonight[t.id] ? 'Noted: ' + t.label.toLowerCase() : t.label}</button>`).join('')}</div></section>`;
  h += laterHtml();
  h += sugHtml();
  if (settled.length) h += `<section class="sec"><div class="sech"><h2>Settled</h2></div><div class="settled">${settled.map(x => `<button data-act="sheet" data-s="item" data-id="${x.id}" class="${U.fx.settled === x.id ? 'pop' : ''}"${hs(x.id)}><i></i>${esc(x.name)}</button>`).join('')}</div></section>`;
  if (S.dayOne) h += `<button class="addbtn" data-act="toast-add"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>Add a routine</button>`;

function sugHtml() {

  if (S.noSug || (!S.sug && !S.sugEmpty)) return '';
