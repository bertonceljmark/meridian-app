<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0D0C; --ink2:#161513; --ink3:#1F1D1A; --line:rgba(243,237,228,.09); --line2:rgba(243,237,228,.16);
  --cream:#F3EDE4; --t2:rgba(243,237,228,.62); --t3:rgba(243,237,228,.40); --t4:rgba(243,237,228,.22);
  --sun:#FF6B3D; --sun2:#FF8F5E; --sunInk:#2A0E04; --night:#8E93E8; --rec:#8F887E;
  --sky:#FF8A5B;
  --disp:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --ui:"Geist", ui-sans-serif, system-ui, sans-serif;
  --gut:20px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--cream);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.app{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--ink)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:180px;scroll-padding:100px 0 170px}
.scroll::-webkit-scrollbar{display:none}
.tnum{font-variant-numeric:tabular-nums}

/* status bar + scrolled bar */
.sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:6px 22px 0 34px;pointer-events:none}
.sbar .clk{font:600 16px/1 var(--ui);letter-spacing:-.01em}
.sbar .ddata{pointer-events:auto;font:500 12px/1 var(--ui);color:var(--t2);padding:7px 10px;border-radius:99px;background:rgba(243,237,228,.07);border:1px solid var(--line)}
.sbar .ddata b{color:var(--cream);font-weight:600}
.topbar{position:absolute;top:0;left:0;right:0;height:92px;z-index:20;background:rgba(14,13,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font:600 16px/1 var(--disp);opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .25s var(--ease);pointer-events:none}
.topbar.on{opacity:1;transform:none}

/* sky: a flat light at the sun's place, coloured by the hour */
.sky{position:absolute;left:0;right:0;top:0;height:520px;pointer-events:none;opacity:.9;transition:background .6s}

/* header */
.head{position:relative;padding:58px var(--gut) 0;display:flex;align-items:flex-start;justify-content:space-between}
.head h1{font:600 34px/1 var(--disp);font-variation-settings:"wdth" 88;letter-spacing:-.02em}
.head .sub{margin-top:6px;font:400 15px/1.2 var(--ui);color:var(--t2)}
.head .sub .ctx{color:var(--cream)}
.hicons{display:flex;gap:2px;margin-top:-4px;margin-right:-10px}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--t2)}
.ib:active{background:rgba(243,237,228,.06)}
.ib.on{color:var(--cream)}
.ib .n{position:absolute;top:6px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--cream);color:var(--ink);font:700 10px/16px var(--ui);text-align:center}
.ctxchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font:500 13px/1 var(--ui);color:var(--cream)}
.ctxchip i{width:6px;height:6px;border-radius:50%;background:var(--night)}

/* the day arc */
.arc{position:relative;margin-top:0;height:160px;cursor:pointer}
.arc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc .cap{position:absolute;left:var(--gut);right:var(--gut);bottom:2px;display:flex;justify-content:space-between;font:400 12px/1 var(--ui);color:var(--t3)}
.arc .lbl{font:500 11.5px var(--ui);fill:var(--t3)}
.arc .lbl.now{fill:var(--sun2);font-weight:600}
.arc .lbl.nt{fill:var(--night)}
.arc .lbl.miss{fill:var(--t3)}
.arc .ray{stroke:var(--cream);stroke-linecap:round;stroke-width:3.6}
.arc .ray.new{stroke:var(--sun2);animation:ray .7s var(--spring) both, rayc 2.2s .7s ease forwards}
@keyframes ray{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}
@keyframes rayc{to{stroke:var(--cream)}}
.arc .sess{stroke:var(--cream);stroke-width:6;stroke-linecap:round;fill:none}
.arc .rec{fill:var(--rec)}
.arc .halo{fill:var(--sun);opacity:.16;transform-box:fill-box;transform-origin:center}
.arc .halo.pulse{animation:halo .9s var(--ease)}
@keyframes halo{0%{transform:scale(1);opacity:.16}35%{transform:scale(1.9);opacity:.3}100%{transform:scale(1);opacity:.16}}
.arc .arc3d{position:absolute;left:0;top:0;display:block;touch-action:pan-y}
.arc.is3d svg{display:none}
.arc.is3d{overflow:hidden;height:330px;margin-top:-72px;z-index:0;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 70px,#000 calc(100% - 36px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 70px,#000 calc(100% - 36px),transparent 100%)}
.head{z-index:2}
.arc.is3d .arcnote{top:auto;bottom:44px}
.l3{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:500 11.5px var(--ui);color:var(--t3);will-change:transform}
.l3.now{color:var(--sun2);font-weight:600}
.l3.nt{color:var(--night)}
.arcnote{position:absolute;right:var(--gut);top:132px;text-align:right;font:400 14px/1.35 var(--ui);color:var(--t3);pointer-events:none}

/* results strip */
.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:10px;padding:0 0 4px}
.strip::-webkit-scrollbar{display:none}
.panel{position:relative;flex:0 0 78%;scroll-snap-align:start;padding:2px 22px 4px var(--gut);border-right:1px solid var(--line);text-align:left;min-height:0;display:flex;flex-direction:column}
.panel:last-child{border-right:0;flex-basis:86%}
.panel.solo{flex-basis:100%}
.panel .k{font:500 13px/1 var(--ui);color:var(--t2);display:flex;gap:6px;align-items:center}
.panel .k .just{color:var(--sun2)}
.panel .big{margin-top:8px;font:300 40px/1 var(--disp);font-variation-settings:"wdth" 90;letter-spacing:-.03em}
.panel .big small.u{margin:0 6px 0 3px;font-size:16px}
.panel .big small{font:400 17px var(--ui);letter-spacing:0;color:var(--t2);margin-left:6px}
.panel .ttl{margin-top:8px;font:500 21px/1.15 var(--disp);letter-spacing:-.01em}
.panel .ln{margin-top:8px;font:400 14px/1.35 var(--ui);color:var(--t2)}
.panel .ln b{color:var(--cream);font-weight:500}
.panel .mini{margin-top:auto;padding-top:10px}
.panel .x{position:absolute;top:-8px;right:4px;width:36px;height:36px;display:grid;place-items:center;color:var(--t4);border-radius:12px}
.nights{display:flex;align-items:flex-end;gap:5px;height:34px}
.nights i{width:7px;border-radius:2px;background:rgba(243,237,228,.22)}
.nights i.on{background:var(--night)}
.nights i.gap{height:6px!important;background:none;border:1px dashed var(--t4)}
.splits{display:flex;align-items:flex-end;gap:5px;height:30px}
.splits i{width:9px;border-radius:2px 2px 0 0;background:rgba(243,237,228,.22)}
.splits i.best{background:var(--cream)}
.prange{display:grid;gap:7px}
.prange .r{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:8px;font:400 12.5px var(--ui);color:var(--t2)}
.prange .t{position:relative;height:10px}
.prange .t:before{content:"";position:absolute;left:0;right:0;top:4.5px;height:1px;background:var(--line)}
.prange .t .s{position:absolute;top:3px;height:4px;border-radius:2px;background:rgba(243,237,228,.3)}
.prange .t .m{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--cream)}
.prange .r.b .t .m{background:var(--sun2)}
.prange .v{text-align:right;color:var(--cream)}
.weekd{display:flex;gap:10px;align-items:flex-end;height:40px}
.weekd .c{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;width:18px}
.weekd .c i{width:6px;height:3px;border-radius:1px;background:rgba(243,237,228,.5)}
.weekd .c span{font:500 10px var(--ui);color:var(--t3);margin-top:3px}
.weekd .c.sick span{color:var(--night)}
.weekd .c.now i{background:var(--sun2)}
.panel .act{margin-top:12px;align-self:flex-start;height:40px;padding:0 16px;border-radius:12px;background:var(--cream);color:var(--ink);font:600 14px var(--ui)}

/* sections */
.welcome{margin:22px var(--gut) 0;font:400 15px/1.4 var(--ui);color:var(--t2)}
.welcome b{color:var(--cream);font-weight:500}
.sec{margin-top:24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;padding:0 var(--gut);margin-bottom:4px}
.sech h2{font:600 15px/1 var(--disp);color:var(--t2);letter-spacing:.005em}
.sech .aside{font:500 13px var(--ui);color:var(--t2);padding:10px 0 10px 12px;margin:-10px 0}
.none{padding:10px var(--gut) 0;font:400 15px/1.4 var(--ui);color:var(--t3)}

/* Now rows */
.rows{padding:0 var(--gut)}
.row{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:14px;padding:15px 0 15px;border-top:1px solid var(--line);transition:opacity .3s}
.row:first-child{border-top:0}
.row .open{position:absolute;inset:0 76px 0 0;border-radius:6px}
.row .nm{position:relative;pointer-events:none;font:500 21px/1.1 var(--disp);font-variation-settings:"wdth" 94;letter-spacing:-.012em}
.row.lead .nm{font-size:27px;font-weight:500}
.row .st{position:relative;pointer-events:none;margin-top:5px;font:400 14px/1.35 var(--ui);color:var(--t2)}
.row .st b{color:var(--cream);font-weight:500}
.row .st .pv{color:var(--sun2);font-weight:500}
.row .first{position:relative;pointer-events:none;margin-top:8px;font:400 13.5px/1.4 var(--ui);color:var(--t3);max-width:30ch}
.row .first em{font-style:normal;color:var(--t2)}
.row.full{grid-template-columns:1fr}
.row.full .open{right:0;bottom:56px}
.row .tag{font:500 12px var(--ui);color:var(--sun2)}
.row.completing .nm{color:var(--sun2);transition:color .25s}
.row.leaving{animation:leave .42s var(--ease) forwards;overflow:hidden}
@keyframes leave{0%{max-height:160px;opacity:1}100%{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-color:transparent}}
.row.arrive{animation:arrive .5s var(--ease) both}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}}
.rows.locked .keyw{pointer-events:none}
.more{display:block;margin:6px var(--gut) 0;height:44px;font:500 14px var(--ui);color:var(--t2);text-align:left}
.more b{color:var(--cream);font-weight:500}

/* keys: flat forms; the feel is in the motion */
.keyw{position:relative;display:flex;align-items:center;justify-content:flex-end;min-width:56px;min-height:52px}
.key{position:relative;display:grid;place-items:center;transition:transform .07s ease-out}
.key.down{transform:translateY(2px) scale(.93)}
.key.rel{animation:rel .38s var(--spring)}
@keyframes rel{0%{transform:translateY(2px) scale(.93)}100%{transform:none}}
.k-round{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(243,237,228,.34);overflow:hidden}
.k-round .fill{position:absolute;left:-2px;right:-2px;bottom:-2px;height:0;background:var(--sun)}
.k-round.done{border-color:var(--sun)}
.k-round.done .fill{height:calc(100% + 4px)}
.k-round.done.anim .fill{animation:rise .55s var(--ease)}
@keyframes rise{0%{height:0;border-radius:50% 50% 0 0/14px 14px 0 0}70%{border-radius:50% 50% 0 0/6px 6px 0 0}100%{height:calc(100% + 4px);border-radius:0}}
.k-round svg{position:relative;z-index:1}
.k-round .ck{stroke:var(--sunInk);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22}
.k-round.done .ck{stroke-dashoffset:0}
.k-round .ck.ghost{stroke:rgba(243,237,228,.28);stroke-dashoffset:0}
.k-round.done.anim .ck{animation:ck .35s .32s var(--ease) both}
@keyframes ck{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.k-round .pl{stroke:var(--cream);stroke-width:2;stroke-linecap:round}
.k-seg{height:46px;padding:0 9px;gap:4px;display:flex;align-items:center;border-radius:15px;border:1.5px solid rgba(243,237,228,.34)}
.k-seg i{position:relative;width:9px;height:22px;border-radius:3px;background:rgba(243,237,228,.13);overflow:hidden}
.k-seg i.on:after{content:"";position:absolute;inset:0;background:var(--sun);border-radius:3px}
.k-seg i.on.anim:after{animation:segrise .5s var(--ease) both}
@keyframes segrise{from{transform:translateY(100%)}to{transform:none}}
.k-pill{height:46px;padding:0 16px 0 13px;gap:7px;display:flex;align-items:center;border-radius:15px;border:1.5px solid rgba(243,237,228,.34);font:600 15px var(--ui)}
.k-pill.on{border-color:var(--sun);color:var(--sun2)}
.k-pill .tm{font-variant-numeric:tabular-nums}
.livedot{width:7px;height:7px;border-radius:50%;background:var(--sun);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.k-word{height:46px;padding:0 14px;display:flex;align-items:center;border-radius:15px;border:1.5px solid rgba(243,237,228,.34);font:600 14px var(--ui);margin-right:8px}

/* amount row */
.amt{margin-top:12px;display:flex;gap:7px;grid-column:1/-1}
.amt .key{flex:1;height:44px;border-radius:13px;background:rgba(243,237,228,.07);font:500 16px/1 var(--disp);font-variant-numeric:tabular-nums;overflow:hidden}
.amt .key span{position:relative;z-index:1}
.amt .key.last{box-shadow:inset 0 0 0 1.5px rgba(243,237,228,.28)}
.amt .key .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--sun);opacity:0}
.amt .key.pour .fill{animation:pour .7s var(--ease)}
@keyframes pour{0%{height:0;opacity:.95}45%{height:100%;opacity:.95}100%{height:100%;opacity:0}}
.amt .key.pour span{animation:pourtx .7s var(--ease)}
@keyframes pourtx{0%,45%{color:var(--sunInk)}100%{color:var(--cream)}}
.level{position:relative;margin-top:9px;height:2px;border-radius:2px;background:rgba(243,237,228,.1);max-width:220px;pointer-events:none}
.level i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--sun);transition:width .7s var(--ease)}
.roll{display:inline-block;animation:roll .45s var(--spring)}
@keyframes roll{from{transform:translateY(.45em);opacity:0}}

/* Later as set type */
.later{padding:0 var(--gut)}
.lg{padding:10px 0 4px}
.lg .h{font:400 13px/1 var(--ui);color:var(--t3);margin-bottom:6px}
.para{display:flex;flex-wrap:wrap;column-gap:20px;row-gap:2px;align-items:center}
.tok{display:inline-flex;align-items:center;gap:4px;min-height:48px}
.tok .tn{font:400 19px/1.1 var(--disp);font-variation-settings:"wdth" 92;color:rgba(243,237,228,.86);padding:12px 0;text-align:left}
.tok .tf{font:400 13.5px/1 var(--ui);color:var(--t3);margin-left:5px;pointer-events:none}
.tok .tk{width:36px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(243,237,228,.08);color:var(--cream);font:600 12px var(--ui);margin-left:4px;position:relative}
.tok .tk:before{content:"";position:absolute;inset:-6px}
.tok .tk.w{width:auto;padding:0 10px}
.tok .tk.down{background:rgba(255,107,61,.25)}
.tok.done .tn{color:var(--sun2)}

/* By a date, tonight, settled */
.dateline{display:flex;align-items:center;gap:12px;margin:8px var(--gut) 0;min-height:48px;text-align:left;font:400 15px/1.3 var(--ui);color:var(--t2);width:calc(100% - 40px)}
.dateline b{color:var(--cream);font-weight:500}
.dateline svg{flex:none;color:var(--t2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px var(--gut) 0}
.chip{height:40px;padding:0 15px;border-radius:13px;border:1px solid var(--line2);font:500 14px var(--ui);color:var(--cream)}
.chip.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.chip.sm{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.settled{padding:4px var(--gut) 0;display:flex;flex-wrap:wrap;column-gap:16px;row-gap:0}
.settled button{display:inline-flex;align-items:center;gap:8px;min-height:40px;font:400 16px var(--disp);color:var(--t2)}
.settled button i{width:7px;height:7px;border-radius:50%;background:var(--sun)}
.settled button.pop{animation:pop .6s var(--spring)}
@keyframes pop{0%{transform:scale(.6);opacity:0;color:var(--sun2)}60%{color:var(--sun2)}100%{transform:none;opacity:1}}

/* suggestion */
.sug{margin:6px var(--gut) 0;padding:16px 16px 14px;border-radius:22px;background:rgba(243,237,228,.045)}
.sug .sn{font:500 21px/1.15 var(--disp);letter-spacing:-.01em;text-align:left;display:block}
.sug .sr{margin-top:5px;font:400 14px var(--ui);color:var(--t2)}
.sug .sb{display:flex;gap:8px;margin-top:14px}
.sug .sb .primary{flex:1;height:44px;border-radius:13px;background:var(--cream);color:var(--ink);font:600 14.5px var(--ui)}
.sug .sb .sec2{height:44px;padding:0 16px;border-radius:13px;background:rgba(243,237,228,.08);font:500 14.5px var(--ui)}
.sug .sb .dots{width:44px;height:44px;border-radius:13px;background:rgba(243,237,228,.08);display:grid;place-items:center}
.sughold{padding:2px var(--gut) 0;font:400 14.5px/1.45 var(--ui);color:var(--t3)}
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px var(--gut) 0;height:52px;width:calc(100% - 40px);border-radius:16px;background:var(--cream);color:var(--ink);font:600 15.5px var(--ui)}
.foot{margin:36px var(--gut) 0;display:flex;justify-content:center}
.foot button{font:500 13px var(--ui);color:var(--t3);height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px}

/* tab bar, live bar, toast */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;z-index:25;background:rgba(14,13,12,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;padding:6px 6px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;font:500 10.5px var(--ui);color:var(--t3);height:50px}
.tab.on{color:var(--cream)}
.logkey{justify-self:center;width:58px;height:58px;margin-top:-4px;border-radius:50%;background:var(--cream);color:var(--ink);display:grid;place-items:center;transition:transform .08s}
.logkey:active{transform:scale(.92)}
.livebar{position:absolute;left:10px;right:10px;bottom:94px;z-index:24;height:62px;border-radius:20px;background:#22201D;border:1px solid var(--line2);display:flex;align-items:center;gap:12px;padding:0 8px 0 16px;transform:translateY(130%);opacity:0;transition:transform .45s var(--spring),opacity .25s}
.livebar.on{transform:none;opacity:1}
.livebar .lt{flex:1;min-width:0}
.livebar .lt .a{font:500 16px var(--disp)}
.livebar .lt .b{font:400 13px var(--ui);color:var(--t2);margin-top:2px}
.livebar .lp{position:absolute;left:16px;right:16px;bottom:0;height:2px;background:rgba(243,237,228,.08);border-radius:2px;overflow:hidden}
.livebar .lp i{position:absolute;left:0;top:0;bottom:0;background:var(--sun)}
.livebar button{height:44px;padding:0 14px;border-radius:13px;background:rgba(243,237,228,.08);font:600 14px var(--ui)}
.livebar button.end{background:var(--cream);color:var(--ink)}
.toast{position:absolute;left:10px;right:10px;top:8px;z-index:35;min-height:58px;border-radius:24px;background:#26231F;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;transform:translateY(-130%) scale(.9);opacity:0;transition:transform .45s var(--spring),opacity .2s;transform-origin:top center}
.toast.on{transform:none;opacity:1}
.toast .tt{flex:1;min-width:0}
.toast .a{font:500 16px/1.2 var(--disp)}

// ---------- keys ----------

// ---------- the day arc ----------
function arcModel(W) {
  const H = 160, pad = 18, hz = 118, amp = 86, dep = 22;

function arcSvg() {

  g += `<path d="${pathOf(A, A.bed, A.end)}" stroke="rgba(243,237,228,.16)" stroke-width="1.3" fill="none" stroke-dasharray="2 5"/>`;
  // sessions thicken the arc over their span

    if (Math.abs(A.X(A.wake) - sx) > 70) lbl.push(`<text class="lbl" x="${A.X(A.wake) + 4}" y="${A.hz + 22}">woke ${hm(A.wake)}</text>`);

    recs: S.entries.filter(e => e.k !== 'b').map(e => ({ t: e.t, isNew: U.fx.ray === e.id })), pulse: !!U.fx.sun, mid,
    labels: { now: hm(now), night: noData ? (sl.none ? 'No sleep record' : 'Last night not in yet') : `${dur(sl.asleep)} asleep`, woke: !noData && Math.abs(A.X(A.wake) - sx) > 70 ? `woke ${hm(A.wake)}` : '' } };

}
function skyTint() {

  constructor() {
