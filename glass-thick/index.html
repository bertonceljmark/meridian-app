<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>Meridian thick glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=Geist:wght@400..600&display=swap" rel="stylesheet">
<style>
/* One phone, full width. The Today behind is the real Ink Today, pre-rendered once;
   the glass is one WebGL pass that only runs while something moves. */
:root{
  --ink:#1D2633; --cream:#F3EDE4; --t2:rgba(243,237,228,.74); --t3:rgba(243,237,228,.58);
  --sun:#FF8F5E;
  --disp:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --ui:"Geist", ui-sans-serif, system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:#000;margin:0}
body{display:flex;justify-content:center;font-family:var(--ui);color:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--ink);touch-action:none}
#cv{position:absolute;left:0;top:0;display:block;visibility:hidden}
.hot{position:absolute;border-radius:50%;z-index:2}
.hot:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.g{position:absolute;left:0;top:0;z-index:5;overflow:hidden;display:none;contain:layout paint}
.g.on{display:block}
.gi{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity}
.catch{position:absolute;inset:0;z-index:4;display:none}
.catch.on{display:block}

/* on glass: controls are frosted into the glass, never clay */
.chip,.btn,.field{background:rgba(220,232,255,.075);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(220,232,255,.10);border-radius:18px}
.chip:active,.btn:active{background:rgba(220,232,255,.16);transform:scale(.97)}
.chip:focus-visible,.btn:focus-visible,.x:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:2px}

#sheet .gi{padding:12px 30px 34px;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#sheet .gi::-webkit-scrollbar{display:none}
.grab,.sh{touch-action:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(230,238,255,.34);margin:2px auto 16px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh h2{font:600 30px/1.05 var(--disp);letter-spacing:-.015em;margin:0}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(220,232,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(220,232,255,.10)}
.field{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;margin-top:18px;color:var(--t3);font-size:16px;background:rgba(0,6,16,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(220,232,255,.07),0 1px 0 rgba(255,255,255,.06)}
.lab{font:600 14px var(--ui);color:var(--t2);margin:24px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{height:44px;padding:0 17px;font:500 15.5px var(--ui);border-radius:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row b{display:block;font:500 17px var(--ui)} .row span{font-size:14px;color:var(--t2)}
.btn{height:50px;width:100%;font:500 16px var(--ui);margin-top:4px}
.btn.s{width:auto;height:40px;padding:0 16px;font-size:14.5px;border-radius:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun);margin-right:8px;vertical-align:1px}

#pop .gi{padding:34px 32px 30px}
#pop h3{font:600 23px/1.15 var(--disp);margin:0}
#pop p{font-size:15px;line-height:1.42;color:var(--t2);margin:9px 0 0}
#pop .two{display:flex;gap:10px;margin-top:22px}
#pop .two .btn{flex:1}

#toast .gi{display:flex;align-items:center;gap:10px;padding:0 12px 0 28px;height:100%}
#toast .tt{flex:1;min-width:0;font:500 15.5px var(--ui)}
#toast .tt small{display:block;font-size:13px;color:var(--t2);font-weight:400}
#toast .btn{color:var(--sun)}

.fps{position:absolute;right:10px;top:calc(4px + env(safe-area-inset-top,0px));z-index:9;font:500 11px var(--ui);color:rgba(243,237,228,.5);display:none}
.fps.on{display:block}
</style>

<div class="app" id="app">
  <canvas id="cv" aria-label="Today, Tuesday 27 October" role="img"></canvas>
  <button class="hot" id="hPlus" aria-label="Log something"></button>
  <button class="hot" id="hX" aria-label="Hide this reading"></button>
  <div class="catch" id="catch"></div>

  <div class="g" id="sheet" role="dialog" aria-modal="true" aria-label="Log anything"><div class="gi">
    <div class="grab"></div>
    <div class="sh"><h2>Log anything</h2><button class="x" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
    <div class="field"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="5.5"/><path d="M12.2 12.2L16 16" stroke-linecap="round"/></svg>Routines, records, settings</div>
    <div class="lab">Recent</div>
    <div class="chips"><button class="chip" data-log="Espresso">Espresso</button><button class="chip" data-log="Turkish coffee">Turkish coffee</button><button class="chip" data-log="Water, 250 ml">Water 250</button></div>
    <div class="lab">Medication</div>
    <div class="row"><div><b>Cetirizine 10 mg</b><span>Not yet today</span></div><button class="btn s" data-log="Cetirizine 10 mg">Took it</button></div>
    <div class="lab">Observations</div>
    <div class="chips"><button class="chip" data-log="Red Bull">Red Bull</button><button class="chip" data-log="Beer">Beer</button><button class="chip" data-log="Wine">Wine</button></div>
    <div class="lab">How you feel</div>
    <button class="btn" data-log="A note on how you feel">Note how you feel</button>
  </div></div>

  <div class="g" id="pop" role="alertdialog" aria-modal="true" aria-label="Hide this reading?"><div class="gi">
    <h3>Hide this reading?</h3>
    <p>It stays in Time, where you can bring it back.</p>
    <div class="two"><button class="btn" data-close>Keep</button><button class="btn" data-close><span class="dot"></span>Hide</button></div>
  </div></div>

  <div class="g" id="toast" role="status"><div class="gi">
    <div class="tt" id="tt"></div><button class="btn s" data-close>Undo</button>
  </div></div>
  <div class="fps" id="fps"></div>
</div>

const IW = 390, IH = 844, SPLIT = 738;     // SPLIT: where the tab bar strip starts in the image                         // the size the Today image was rendered at (css px)
const app = document.getElementById('app'), cv = document.getElementById('cv');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const sp = (resp, z) => ({ k: (2 * Math.PI / resp) ** 2, c: 4 * Math.PI * z / resp });

/* ---------- GL ---------- */
const gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
const FS = `precision highp float;
uniform sampler2D uImg,uBlur;
uniform vec2 uView; uniform float uDpr,uSc,uDim;
uniform vec4 uR[3]; uniform vec4 uQ[3]; uniform int uN;
const vec3 INK=vec3(.114,.149,.2);
float sq(float x){return x*x;}
vec3 sq(vec3 x){return x*x;}
float sdRB(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
// the Today image: its top is pinned to the top of the screen and its tab bar to the bottom,
// so it fits any screen height (the in-app viewer is shorter than a phone)
vec3 img(sampler2D t,vec2 p){ vec2 uv=p/(vec2(${IW}.,${IH}.)*uSc); return uv.y>1.||uv.y<0.?INK:texture2D(t,clamp(uv,.0005,.9995)).rgb; }
vec3 two(sampler2D t,vec2 p){
  float off=uView.y-${IH}.*uSc, top=uView.y-(${IH}.-${SPLIT}.)*uSc;
  if(p.y<top-28.) return img(t,p);
  vec3 b=img(t,vec2(p.x,p.y-off));
  return p.y>=top?b:mix(img(t,p),b,smoothstep(top-28.,top,p.y));
}
vec3 bg(vec2 p){ return two(uImg,p); }
vec3 bgb(vec2 p){ return two(uBlur,p); }
float lum(vec3 c){return dot(c*c,vec3(.2126,.7152,.0722));}
// the room Ink sits in: a long warm softbox high on the left (the clay's own light) and a cool strip low on the right.
// Each is a band of elevation, so on a domed edge it reflects as a line that follows the rim.
vec3 room(vec3 R){
  vec2 h=R.xy/max(length(R.xy),1e-4);
  float ka=smoothstep(.35,.98,dot(h,normalize(vec2(-.55,-.83))));
  float ba=smoothstep(.55,.98,dot(h,normalize(vec2(.55,.83))));
  return vec3(1.,.95,.86)*ka*(smoothstep(.16,.0,abs(R.z-.06))*9.+smoothstep(.5,.0,abs(R.z-.3))*.8)
       + vec3(.72,.84,1.)*ba*smoothstep(.12,.0,abs(R.z+.05))*4.
       + vec3(.55,.60,.70)*exp(-sq((R.z+.1)/.25))*.30;
}
vec3 glass(vec2 p,vec2 q,vec2 hs,float r,float d,float B,float st){

  float s=clamp(-d/B,0.,1.), t=1.-s;
  float h=sqrt(max(1.-t*t,0.));                 // a domed edge: a quarter circle B wide
  float g=min(t/max(h,.13),7.5)*st;             // its slope
  vec3 N=normalize(vec3(n*g,1.));
  vec2 L2=normalize(vec2(-.55,-.83)); float facing=max(dot(n,L2),0.), away=max(dot(n,-L2),0.);
  vec3 col;
  vec3 soft=bgb(p);
  if(t<.002){ col=soft; }                       // the flat face: one tap
  else {
    // the edge bends the Today beyond it, squeezed and split into colour (n 1.44 / 1.50 / 1.57)
    float th=B*(.45+.55*h)*.62;
    vec3 Tr=refract(vec3(0.,0.,-1.),N,1./1.44), Tg=refract(vec3(0.,0.,-1.),N,1./1.50), Tb=refract(vec3(0.,0.,-1.),N,1./1.57);
    vec3 sharp=vec3(bg(p-Tr.xy/max(-Tr.z,.3)*th).r, bg(p-Tg.xy/max(-Tg.z,.3)*th).g, bg(p-Tb.xy/max(-Tb.z,.3)*th).b);
