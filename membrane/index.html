<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Membrane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--surf:#1D2633;--tx:232,239,248}
html,body{margin:0;height:100%;background:var(--surf);overflow:hidden;font-family:Inter,system-ui,sans-serif;color:rgb(var(--tx))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* the real, native scroll container: invisible, it only supplies the offset (iOS momentum and rubber band) */
#sc{position:fixed;inset:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;z-index:1;scrollbar-width:none;overscroll-behavior-y:auto}
#sc::-webkit-scrollbar{display:none}
#sp{width:1px}
#dbg{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;display:flex;gap:8px;align-items:center;font:500 12px Inter,sans-serif}
#dbg button{font:600 12px Inter,sans-serif;color:rgb(var(--tx));background:rgba(10,14,20,.78);border:1px solid rgba(var(--tx),.18);border-radius:12px;padding:8px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#dbg label{display:none;align-items:center;gap:6px;background:rgba(10,14,20,.78);border:1px solid rgba(var(--tx),.18);border-radius:12px;padding:6px 10px;color:rgba(var(--tx),.85)}
#dbg.on label{display:flex}
#dbg input{width:90px}
#msg{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:15px;z-index:4}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="sc"><div id="sp"></div></div>
<div id="dbg"><label>band <input id="band" type="range" min="72" max="104" step="1"><span id="bandv"></span></label><button id="mode" type="button">Shaded</button></div>
<div id="msg">This page needs WebGL2.</div>
<script>
(()=>{
'use strict';
/* =====================================================================================
   MEMBRANE. One stationary full-screen surface: an elastic Ink membrane stretched over
   actuators that move with the content. The page never moves; a hidden native scroll
   container supplies the offset, so momentum and rubber band are the platform's own.
   h(p) = edge(p) * ( Σ balanced kernels of the scrolling forms at p + s  +  lagging residual )
          + Σ kernels of the fixed hero (header keys and dial), which the scroll field never enters.
   ===================================================================================== */
const Q=new URLSearchParams(location.search);
const CFG={band:clamp(+(Q.get('band')||96),72,104),hres:clamp(+(Q.get('hres')||1),.25,1),mode:clamp(+(Q.get('debug')||0)|0,0,3)};
function clamp(x,a,b){return Math.min(b,Math.max(a,x))}
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const U=6;// one height unit = 6 px
const HUE={water:'#56B6FF',meals:'#F2B13C',stretch:'#6BD18C',sleep:'#A99CFF',read:'#F28CC2',ember:'#FF6B3D'};
const TX='rgb(232,239,248)',T2='rgba(232,239,248,.70)',TK='rgba(232,239,248,.85)';

const cv=document.getElementById('cv'),sc=document.getElementById('sc'),sp=document.getElementById('sp');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl){document.getElementById('msg').style.display='grid';return}
const FLOATRT=!!gl.getExtension('EXT_color_buffer_float');
const MAXS=36,MAXH=8;

/* ---------------- layout: hero (fixed, screen space) and list (scrolls, content space) ---------------- */
let L=null;
function layout(){
 const Wv=innerWidth,Hv=innerHeight,Wc=Math.min(Wv,430),X0=(Wv-Wc)/2,g=18;
 const hero=[],list=[],inkH=[],inkS=[];
 const F=(arr,x,y,w,h,r,rest,sig)=>{r=Math.min(r,w/2,h/2);const px=rest*U,sh=3+Math.abs(px)*.45,sg=sig||40;
  // volume balance: the trough is the form's own footprint blurred wide, scaled so its integral equals the mound's
  const ia=Math.max(0,w-sh),ib=Math.max(0,h-sh),ir=Math.max(0,r-sh/2),tq=(ia*ib-(4-Math.PI)*ir*ir)/(w*h);
  arr.push({x,y,w,h,r,rest:px,sh,sg,tq})};
 const T=(arr,x,y,s,font,col,align)=>arr.push({k:'t',x,y,s,font,col,align});
 // hero: header + dial, fixed
 T(inkH,X0+g,28,'Thursday','700 28px Inter',TX);T(inkH,X0+g,64,'29 October','400 14px Inter',T2);
 [[Wc-g-42,'⌕'],[Wc-g-94,'+']].forEach(([x,c])=>{F(hero,X0+x,30,42,42,21,1.5,30);T(inkH,X0+x+21,39,c,'500 20px Inter',TK,'center')});
 const hdrB=86,D=Math.round(Math.min(Wc*.58,236)),cx=X0+Wc/2,cy=hdrB+12+D/2;
 F(hero,cx-D/2,cy-D/2,D,D,D/2,1.2,46);const g1=D-30,g2=D-56,ww=Math.round(D*.42);
 F(hero,cx-g1/2,cy-g1/2,g1,g1,g1/2,-.8,30);F(hero,cx-g2/2,cy-g2/2,g2,g2,g2/2,.8,30);F(hero,cx-ww/2,cy-ww/2,ww,ww,ww/2,-1.6,24);
 [[24,'sleep'],[52,'sleep'],[80,'sleep'],[122,'water'],[146,'meals'],[172,'stretch'],[200,'water'],[230,'meals'],[258,'read']].forEach(([a,hh])=>{const R=(D-43)/2,t=a*Math.PI/180;inkH.push({k:'b',x:cx+R*Math.sin(t),y:cy-R*Math.cos(t),r:5,col:HUE[hh]})});
 T(inkH,cx,cy-24,'17:30','600 30px Inter','#FF8F5E','center');T(inkH,cx,cy+12,'9 logged today','400 12px Inter',T2,'center');
 const regionB=Math.round(cy+D/2+14),heroH=Math.ceil(cy+D/2+40);
 // list: 10 rows of varied heights, a few keys
 let y=regionB+80;const cw=Wc-2*g,x0=X0+g;
 const key=(x,yy,lab,small)=>{F(list,x,yy,42,42,21,1,30);T(inkS,x+21,yy+(small?13:9),lab,small?'500 13px Inter':'500 20px Inter',TK,'center')};
 const bar=(yy,hh,fill,col)=>{F(list,x0+14,yy,5,hh,2.5,-.7,20);if(fill)inkS.push({k:'r',x:x0+14,y:yy+hh*(1-fill),w:5,h:hh*fill,r:2.5,col,glow:1})};
 const row=(n,s,h,o)=>{F(list,x0,y,cw,h,h>90?26:22,1,40);bar(y+14,h-28,o.fill,o.col);T(inkS,x0+32,y+(h>64?14:11),n,'600 17px Inter',TX);T(inkS,x0+32,y+(h>64?39:35),s,'400 13px Inter',T2);
  if(o.keys)o.keys.forEach((k,i)=>key(x0+cw-56-i*50,y+(h-42)/2,k,k.length>1));
  if(o.level){F(list,x0+32,y+h-30,cw-110,12,6,-.64,20);inkS.push({k:'r',x:x0+34,y:y+h-28,w:(cw-114)*o.level,h:8,r:4,col:o.col,glow:1})}
  y+=h+12};
 row('Water','580 ml of 2 L',72,{fill:.3,col:HUE.water,keys:['500','250']});
 row('Meals','1 of 3, last 08:20',72,{fill:.33,col:HUE.meals,keys:['+']});
 row('Stretch','Last yesterday, 21:40',60,{keys:['✓']});
 // card with a carved chart
 F(list,x0,y,cw,214,26,1,44);T(inkS,x0+20,y+16,'Last 7 nights','400 13px Inter',T2);T(inkS,x0+20,y+36,'Your usual night','600 17px Inter',TX);
 F(list,x0+16,y+70,cw-32,122,18,-1.4,30);for(let i=0;i<7;i++){const hg=40+((i*37)%56);inkS.push({k:'r',x:x0+34+i*((cw-68)/7),y:y+70+122-14-hg,w:14,h:hg,r:3,col:HUE.sleep,a:i===6?1:.6,glow:i===6})}
 y+=226;
 row('Reading','usually 35 min',72,{keys:['▶']});
 row('Push-ups','2 of 3 sets',104,{col:HUE.stretch,level:.66,keys:['+']});
 row('Bins out','Thursday, every week',60,{});
 row('Sketching','usually 40 min',72,{keys:['▶']});
 row('Pay rent','by Fri 30 Oct',60,{});
 row('Evening walk','usually 25 min',72,{keys:['+']});
 const total=y+CFG.band+40;
 L={Wv,Hv,Wc,X0,hero,list,inkH,inkS,regionB,heroH,total};
}

/* ---------------- GL ---------------- */
const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const COMMON=`
uniform float uH,uBand,uHdrB;
float erf_(float x){float s=sign(x),a=abs(x),t=1./(1.+.3275911*a);return s*(1.-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*exp(-a*a));}
float sdRR(vec2 p,vec2 c,vec2 b,float r){vec2 q=abs(p-c)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
// one actuator: positive rounded-rect mound with a soft shoulder, minus its own footprint blurred wide (equal integrals)
float kern(vec2 p,vec4 R,vec4 P,float q){float d=sdRR(p,R.xy+R.zw*.5,R.zw*.5,P.x);float t=clamp(-d/P.z,0.,1.);float m=t*t*(3.-2.*t);
 vec2 a=(p-R.xy)*(.70710678/P.w),b=(p-R.xy-R.zw)*(.70710678/P.w);return P.y*(m-q*.25*(erf_(a.x)-erf_(b.x))*(erf_(a.y)-erf_(b.y)));}
float sstep5(float x){x=clamp(x,0.,1.);return x*x*x*(x*(x*6.-15.)+10.);}
// the edge field: flat with zero slope at the bottom of the screen and at the lower edge of the fixed dial region
// (header + dial, full width), so the list never sums into the hero
float edgeC(vec2 sp){float e=min(sp.y-uHdrB,uH-sp.y);return sstep5(e/uBand);}
`;
const HFS=`#version 300 es
precision highp float;
${COMMON}
uniform vec4 uR[${MAXS}],uP[${MAXS}];uniform float uQ[${MAXS}];uniform int uN;
uniform vec4 uRH[${MAXH}],uPH[${MAXH}];uniform float uQH[${MAXH}];uniform int uNH;
uniform float uS,uK,uX0,uWc;uniform sampler2D uLag;
out vec4 o;
void main(){vec2 sp=vec2(gl_FragCoord.x,uK*uH-gl_FragCoord.y)/uK;vec2 cp=sp+vec2(0.,uS);
 float f=0.;for(int i=0;i<${MAXS};i++){if(i>=uN)break;f+=kern(cp,uR[i],uP[i],uQ[i]);}
 vec2 lu=vec2((sp.x-uX0)/uWc,sp.y/uH);if(lu.x>0.&&lu.x<1.)f+=texture(uLag,lu).r;
 float h=f*edgeC(sp);
 for(int i=0;i<${MAXH};i++){if(i>=uNH)break;h+=kern(sp,uRH[i],uPH[i],uQH[i]);}
#ifdef PACK
 float v=clamp((h+40.)/100.,0.,1.)*255.;float hi=floor(v);o=vec4(hi/255.,fract(v),0.,1.);
#else
 o=vec4(h,0.,0.,1.);
#endif
}`;
const LFS=`#version 300 es
precision highp float;
${COMMON}
uniform sampler2D uHt,uInkS,uInkH,uGrain;uniform float uK,uKh,uS,uTot,uX0,uWc,uHeroH,uW;uniform int uMode;uniform vec2 uHtSize;
out vec4 o;
float hAt(vec2 sp){
#ifdef PACK
 vec4 t=texelFetch(uHt,ivec2(clamp(vec2(sp.x,uH-sp.y)*uKh,vec2(0.),uHtSize-1.)),0);return (t.r*255.+t.g)/255.*100.-40.;
#else
 return texture(uHt,vec2(sp.x/uW,1.-sp.y/uH)).r;
#endif
}
float gr(vec2 sp){return texture(uGrain,sp/170.).r;}
void main(){vec2 sp=vec2(gl_FragCoord.x,uK*uH-gl_FragCoord.y)/uK;
 float h0=hAt(sp),e=max(1./uKh,.5);
 float gx=(hAt(sp+vec2(e,0.))-hAt(sp-vec2(e,0.)))/(2.*e),gy=(hAt(sp+vec2(0.,e))-hAt(sp-vec2(0.,e)))/(2.*e);
 vec3 n0=normalize(vec3(-gx,-gy,1.));
 // a matte clay tooth: screen-fixed micro relief, lit through the same normal
 float g0=gr(sp),ggx=(gr(sp+vec2(.8,0.))-g0)/.8,ggy=(gr(sp+vec2(0.,.8))-g0)/.8;
 vec3 n=normalize(vec3(-gx-ggx*.45,-gy-ggy*.45,1.));
 vec3 L=normalize(vec3(-.42,-.62,.66));
 float diff=dot(n,L)-L.z;vec3 Hh=normalize(L+vec3(0.,0.,1.));float spec=pow(max(dot(n,Hh),0.),10.)*.02;
 // cast shadow marched toward the light, ambient occlusion from a ring; both from the one field
 vec2 tl=normalize(vec2(-.42,-.62));float occ=0.;
 for(int k=1;k<=10;k++){float s=float(k)*3.;occ=max(occ,clamp((hAt(sp+tl*s)-h0-s*1.18)/7.,0.,1.)*(1.-float(k)/12.));}
 float ao=0.;for(int k=0;k<8;k++){float a=float(k)*.785+.39;vec2 d=vec2(cos(a),sin(a));ao+=max(hAt(sp+d*7.)-h0,0.)+.6*max(hAt(sp+d*18.)-h0,0.);}
 ao=clamp(ao/80.,0.,1.);float rim=sstep5(min(sp.y,uH-sp.y)/24.);occ*=rim;ao*=rim;
 vec3 surf=vec3(29.,38.,51.)/255.,lift=vec3(230.,240.,255.)/255.,sky=vec3(196.,220.,255.)/255.,deep=vec3(0.,3.,9.)/255.;
 vec3 col=h0>0.?mix(surf,lift,clamp(h0/6.,0.,4.)*.011):mix(surf,vec3(0.),clamp(-h0/6.*.04,0.,.2));
 col+=sky*max(diff,0.)*.40+sky*spec;
 col=mix(col,deep,clamp(-diff*.8,0.,.55));
 col=mix(col,deep,clamp(occ*.5+ao*.38,0.,.7));
 // markings on the forms: the list's revealed by the same edge field, a little behind the relief
 float c=edgeC(sp);float u=(sp.x-uX0)/uWc;
 if(u>0.&&u<1.){vec4 ik=texture(uInkS,vec2(u,(sp.y+uS)/uTot));float a=ik.a*smoothstep(.4,.9,c);col=mix(col,ik.rgb/max(ik.a,.001),a);
  if(sp.y<uHeroH){vec4 ih=texture(uInkH,vec2(u,sp.y/uHeroH));col=mix(col,ih.rgb/max(ih.a,.001),ih.a);}}
 if(uMode==1)col=vec3(clamp(.5+h0/24.,0.,1.));
 else if(uMode==2)col=n0*.5+.5;
 else if(uMode==3){float v=clamp(abs(h0)/10.,0.,1.);col=h0>=0.?mix(vec3(.08),vec3(1.,.55,.25),pow(v,.6)):mix(vec3(.08),vec3(.3,.62,1.),pow(v,.6));}
 o=vec4(col,1.);}`;
function prog(fs){const defs=FLOATRT?'':'#define PACK\n';const src=fs.replace('precision highp float;','precision highp float;\n'+defs);const p=gl.createProgram();
 for(const [t,s] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,src]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh)}
 gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
 const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i).name.replace('[0]','');u[a]=gl.getUniformLocation(p,a)}return {p,u}}
const HP=prog(HFS),LP=prog(LFS);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
function tex(w,h,ifmt,fmt,type,data,filter,wrap){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,ifmt,w,h,0,fmt,type,data);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,wrap);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,wrap);return t}
gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
// grain
const GN=170,gd=new Uint8Array(GN*GN);{let s=11;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};const raw=new Float32Array(GN*GN).map(()=>r());
 for(let y=0;y<GN;y++)for(let x=0;x<GN;x++){let a=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)a+=raw[((y+j+GN)%GN)*GN+(x+i+GN)%GN]*(i||j?1:2);gd[y*GN+x]=Math.round(a/10*255)}}
const grT=tex(GN,GN,gl.R8,gl.RED,gl.UNSIGNED_BYTE,gd,gl.LINEAR,gl.REPEAT);
let K=1,KH=1,PW=1,PH=1,HW=1,HHt=1,htT=null,fb=null,inkST=null,inkHT=null,lagT=null;
let GW=0,GH=0,N=0,hx,hv,tgt,dl,tmp,settled=true,dirty=true;

/* ---------------- ink atlases: drawn once, cached, sampled in the shader ---------------- */
function atlas(items,w,h,ox,oy){const k=Math.min(Math.min(2,devicePixelRatio||1),(gl.getParameter(gl.MAX_TEXTURE_SIZE)-2)/h);const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
 const x=c.getContext('2d');x.setTransform(k,0,0,k,-ox*k,-oy*k);x.textBaseline='top';
 for(const e of items){x.save();if(e.k==='t'){x.font=e.font;x.fillStyle=e.col;x.textAlign=e.align||'left';x.fillText(e.s,e.x,e.y)}
  else if(e.k==='b'){x.shadowColor=e.col;x.shadowBlur=9;x.fillStyle=e.col;x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill()}
  else{x.globalAlpha=e.a||1;if(e.glow){x.shadowColor=e.col;x.shadowBlur=8}x.fillStyle=e.col;x.beginPath();x.roundRect?x.roundRect(e.x,e.y,e.w,e.h,e.r):x.rect(e.x,e.y,e.w,e.h);x.fill()}x.restore()}
 const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,c);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}
function drawInk(){[inkST,inkHT].forEach(t=>t&&gl.deleteTexture(t));inkST=atlas(L.inkS,L.Wc,L.total,L.X0,0);inkHT=atlas(L.inkH,L.Wc,L.heroH,L.X0,0);dirty=true}

/* ---------------- the field in JS (for the residual grid only) ---------------- */
function erf(x){const s=Math.sign(x),a=Math.abs(x),t=1/(1+.3275911*a);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-a*a))}
function kern(px,py,f){const qx=Math.abs(px-(f.x+f.w/2))-f.w/2+f.r,qy=Math.abs(py-(f.y+f.h/2))-f.h/2+f.r;const d=Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-f.r;
 const t=clamp(-d/f.sh,0,1),m=t*t*(3-2*t),k=.70710678/f.sg;return f.rest*(m-f.tq*.25*(erf((px-f.x)*k)-erf((px-f.x-f.w)*k))*(erf((py-f.y)*k)-erf((py-f.y-f.h)*k)))}
const visible=s=>L.list.filter(f=>f.y+f.h+3*f.sg>s&&f.y-3*f.sg<s+L.Hv).slice(0,MAXS);

/* ---------------- residual: only shoulders, troughs and wake lag; the body follows exactly ---------------- */
const OM=2*Math.PI*9,ZE=.95,AMP=2.5;
function targetGrid(s){const vis=visible(s);for(let j=0;j<GH;j++){const py=(j+.5)*L.Hv/GH+s;for(let i=0;i<GW;i++){const px=L.X0+(i+.5)*L.Wc/GW;let h=0;for(const f of vis){if(py<f.y-3*f.sg||py>f.y+f.h+3*f.sg)continue;h+=kern(px,py,f)}tgt[j*GW+i]=h}}}
function settle(s){targetGrid(s);hx.set(tgt);hv.fill(0);dl.fill(0);settled=true;dirty=true}
function simStep(s,dt){targetGrid(s);let mx=0;const k=OM*OM,c=2*ZE*OM,n=Math.max(1,Math.ceil(dt*240)),h=dt/n;
 for(let it=0;it<n;it++)for(let i=0;i<N;i++){hv[i]+=(k*(tgt[i]-hx[i])-c*hv[i])*h;hx[i]+=hv[i]*h}
 for(let i=0;i<N;i++){const d=hx[i]-tgt[i];dl[i]=AMP*Math.tanh(d/AMP);mx=Math.max(mx,Math.abs(d),Math.abs(hv[i])*.01)}
 for(let pass=0;pass<2;pass++){for(let j=0;j<GH;j++){const o=j*GW;for(let i=0;i<GW;i++)tmp[o+i]=(dl[o+Math.max(0,i-1)]+2*dl[o+i]+dl[o+Math.min(GW-1,i+1)])*.25}
  for(let j=0;j<GH;j++){const a=Math.max(0,j-1)*GW,b=j*GW,cc=Math.min(GH-1,j+1)*GW;for(let i=0;i<GW;i++)dl[b+i]=(tmp[a+i]+2*tmp[b+i]+tmp[cc+i])*.25}}
 if(mx<.01){hx.set(tgt);hv.fill(0);dl.fill(0);settled=true}else settled=false;dirty=true}

/* ---------------- size everything ---------------- */
function resize(){layout();K=Math.min(2,devicePixelRatio||1);KH=K*CFG.hres;PW=Math.round(L.Wv*K);PH=Math.round(L.Hv*K);cv.width=PW;cv.height=PH;HW=Math.max(1,Math.round(L.Wv*KH));HHt=Math.max(1,Math.round(L.Hv*KH));
 if(htT)gl.deleteTexture(htT);if(fb)gl.deleteFramebuffer(fb);
 htT=FLOATRT?tex(HW,HHt,gl.R16F,gl.RED,gl.HALF_FLOAT,null,gl.LINEAR,gl.CLAMP_TO_EDGE):tex(HW,HHt,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,null,gl.NEAREST,gl.CLAMP_TO_EDGE);
 fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,htT,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 GW=40;GH=Math.round(40*L.Hv/L.Wc);N=GW*GH;hx=new Float32Array(N);hv=new Float32Array(N);tgt=new Float32Array(N);dl=new Float32Array(N);tmp=new Float32Array(N);
 if(lagT)gl.deleteTexture(lagT);lagT=tex(GW,GH,gl.R16F,gl.RED,gl.FLOAT,dl,gl.LINEAR,gl.CLAMP_TO_EDGE);
 sp.style.height=L.total+'px';drawInk();settle(sc.scrollTop);wake()}

/* ---------------- draw ---------------- */
const RA=new Float32Array(MAXS*4),PA=new Float32Array(MAXS*4),QA=new Float32Array(MAXS),RH=new Float32Array(MAXH*4),PHA=new Float32Array(MAXH*4),QH=new Float32Array(MAXH);
function common(P){gl.uniform1f(P.u.uH,L.Hv);gl.uniform1f(P.u.uBand,CFG.band);gl.uniform1f(P.u.uHdrB,L.regionB)}
function render(s){const vis=visible(s);RA.fill(0);PA.fill(0);QA.fill(0);vis.forEach((f,i)=>{RA.set([f.x,f.y,f.w,f.h],i*4);PA.set([f.r,f.rest,f.sh,f.sg],i*4);QA[i]=f.tq});
 L.hero.forEach((f,i)=>{RH.set([f.x,f.y,f.w,f.h],i*4);PHA.set([f.r,f.rest,f.sh,f.sg],i*4);QH[i]=f.tq});
 gl.bindTexture(gl.TEXTURE_2D,lagT);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,GW,GH,gl.RED,gl.FLOAT,dl);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.viewport(0,0,HW,HHt);gl.useProgram(HP.p);common(HP);
 gl.uniform4fv(HP.u.uR,RA);gl.uniform4fv(HP.u.uP,PA);gl.uniform1fv(HP.u.uQ,QA);gl.uniform1i(HP.u.uN,vis.length);
 gl.uniform4fv(HP.u.uRH,RH);gl.uniform4fv(HP.u.uPH,PHA);gl.uniform1fv(HP.u.uQH,QH);gl.uniform1i(HP.u.uNH,L.hero.length);
 gl.uniform1f(HP.u.uS,s);gl.uniform1f(HP.u.uK,KH);gl.uniform1f(HP.u.uX0,L.X0);gl.uniform1f(HP.u.uWc,L.Wc);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,lagT);gl.uniform1i(HP.u.uLag,0);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,PW,PH);gl.useProgram(LP.p);common(LP);
 [[htT,'uHt'],[inkST,'uInkS'],[inkHT,'uInkH'],[grT,'uGrain']].forEach(([t,n],i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(LP.u[n],i)});
 gl.uniform1f(LP.u.uK,K);gl.uniform1f(LP.u.uKh,KH);gl.uniform1f(LP.u.uS,s);gl.uniform1f(LP.u.uTot,L.total);gl.uniform1f(LP.u.uX0,L.X0);gl.uniform1f(LP.u.uWc,L.Wc);gl.uniform1f(LP.u.uHeroH,L.heroH);gl.uniform1f(LP.u.uW,L.Wv);
 gl.uniform1i(LP.u.uMode,CFG.mode);gl.uniform2f(LP.u.uHtSize,HW,HHt);gl.drawArrays(gl.TRIANGLES,0,3);gl.activeTexture(gl.TEXTURE0);dirty=false}

/* ---------------- loop: runs only while the offset moves or the residual is settling ---------------- */
let raf=0,last=0,lastS=NaN,awakeUntil=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000)||1/60;last=now;const s=sc.scrollTop;
 if(s!==lastS||!settled)simStep(s,dt);if(dirty||s!==lastS)render(s);lastS=s;
 raf=(!settled||now<awakeUntil)?requestAnimationFrame(frame):0}
function wake(){awakeUntil=performance.now()+250;if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
sc.addEventListener('scroll',wake,{passive:true});
sc.addEventListener('touchstart',wake,{passive:true});
let rw=innerWidth,rh=innerHeight;addEventListener('resize',()=>{if(innerWidth!==rw||Math.abs(innerHeight-rh)>80){rw=innerWidth;rh=innerHeight;resize()}});

/* ---------------- debug ---------------- */
const MODES=['Shaded','Height','Normals','Displacement ±'],mb=document.getElementById('mode'),dbg=document.getElementById('dbg'),bi=document.getElementById('band'),bv=document.getElementById('bandv');
const setMode=m=>{CFG.mode=m;mb.textContent=MODES[m];dbg.classList.toggle('on',m>0||Q.has('debug'));dirty=true;wake()};
mb.addEventListener('click',()=>setMode((CFG.mode+1)%4));
bi.value=CFG.band;bv.textContent=CFG.band;bi.addEventListener('input',()=>{CFG.band=+bi.value;bv.textContent=bi.value;dirty=true;wake()});
setMode(CFG.mode);
resize();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{drawInk();wake()});

// hooks for shots: jump to an offset at rest; or move the content at v px/s for ms (fixed 120 Hz) and draw that instant
window.MEM={jump(s){sc.scrollTop=s;settle(sc.scrollTop);render(sc.scrollTop);lastS=sc.scrollTop},
 sweep(s0,v,ms){settle(s0);let s=s0;const n=Math.round(ms/1000*120);for(let i=0;i<n;i++){s+=v/120;simStep(s,1/120)}render(s);lastS=NaN;return {s,maxLag:Math.max(...dl.map(Math.abs))}},
 mode:setMode,max:()=>L.total-L.Hv,info:()=>({floatRT:FLOATRT,hres:CFG.hres,band:CFG.band,rows:L.list.length,total:L.total})};
})();
</script>
