<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Meridian liquid glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=Geist:wght@400..600&display=swap" rel="stylesheet">
<style>
/* One phone, full width. The Ink Today behind is a still render of the real screen;
   the glass is liquidGL (naughtyduk/liquidGL, MIT) refracting it. */
:root{
  --ink:#1D2633; --cream:#F3EDE4; --t2:rgba(243,237,228,.76); --t3:rgba(243,237,228,.60); --sun:#FF8F5E;
  --disp:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --ui:"Geist", ui-sans-serif, system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#000}
body{font-family:var(--ui);color:var(--cream);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* #bg is what you see; #snap, the same Today pre-blurred, sits under it and is what the glass refracts.
   A clean gaussian here replaces liquidGL's 16-tap random frost, which reads as grain. */
.plate{position:absolute;left:50%;top:0;transform:translateX(-50%);width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--ink)}
#bg{z-index:1} #snap{z-index:0}
.plate img{position:absolute;left:0;width:100%;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
#top,.t{top:0} #bar,.b{bottom:0}
.hot{position:absolute;border-radius:50%;z-index:2}
.hot:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.catch{position:fixed;inset:0;z-index:40;display:none}
.catch.on{display:block}

/* the three pieces of glass. Closed, each waits off-screen (liquidGL stops drawing a lens it can't see) */
.lg{position:fixed;z-index:50;overflow:hidden;left:50%;width:calc(min(100vw, 430px) - 16px);margin-left:calc(min(100vw, 430px) / -2 + 8px);will-change:transform}
#sheet{bottom:8px;height:min(86%, 640px);border-radius:44px;transform:translateY(calc(100% + 40px))}
#pop{top:30%;width:calc(min(100vw, 430px) - 56px);margin-left:calc(min(100vw, 430px) / -2 + 28px);border-radius:34px;transform:translateY(-200vh)}
#toast{top:calc(10px + env(safe-area-inset-top,0px));height:62px;border-radius:31px;width:calc(min(100vw, 430px) - 24px);margin-left:calc(min(100vw, 430px) / -2 + 12px);transform:translateY(-140px)}

/* content on glass */
.in{position:relative;z-index:1;height:100%;pointer-events:auto;border-radius:inherit;background:rgba(205,218,240,.045)}
/* the rim: a hairline that catches the light top-left and again, fainter, bottom-right */
.in::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,.42),rgba(255,255,255,.10) 22%,rgba(255,255,255,.03) 55%,rgba(255,255,255,.07) 80%,rgba(255,255,255,.22));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}   /* liquidGL sets pointer-events:none on the lens itself */
#sheet .in{display:flex;flex-direction:column;padding:10px 0 0}
.grab{flex:none;width:38px;height:5px;border-radius:3px;background:rgba(235,242,255,.42);margin:2px auto 14px}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px}
.hd h2{font:600 28px/1.05 var(--disp);letter-spacing:-.015em;margin:0}
.scr{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 30px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10)}
.field{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;margin-top:14px;color:var(--t3);font-size:16px;border-radius:24px;background:rgba(0,0,0,.22)}
.lab{font:600 13.5px var(--ui);color:var(--t2);margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.btn{background:rgba(255,255,255,.10);border-radius:22px;transition:background .15s,transform .1s}
.chip{height:44px;padding:0 18px;font:500 15.5px var(--ui)}
.chip:active,.btn:active,.x:active{background:rgba(255,255,255,.2);transform:scale(.97)}
.chip:focus-visible,.btn:focus-visible,.x:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row b{display:block;font:500 17px var(--ui)} .row span{font-size:14px;color:var(--t2)}
.btn{height:50px;width:100%;font:500 16px var(--ui);border-radius:25px}
.btn.s{width:auto;height:40px;padding:0 18px;font-size:14.5px;border-radius:20px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun);margin-right:8px;vertical-align:1px}
#pop .in{padding:26px 24px 22px}
#pop h3{font:600 22px/1.15 var(--disp);margin:0}
#pop p{font-size:15px;line-height:1.42;color:var(--t2);margin:8px 0 0}
#pop .two{display:flex;gap:10px;margin-top:20px} #pop .two .btn{flex:1}
#toast .in{display:flex;align-items:center;gap:10px;padding:0 10px 0 24px}
#toast .tt{flex:1;min-width:0;font:500 15.5px/1.2 var(--ui)} #toast .tt small{display:block;font-size:13px;color:var(--t2);font-weight:400}
#toast .btn{color:var(--sun)}
.credit{position:fixed;left:0;right:0;bottom:calc(4px + env(safe-area-inset-bottom,0px));text-align:center;font:500 10.5px var(--ui);color:rgba(243,237,228,.36);z-index:3;pointer-events:none}
</style>

  const put = (el, x, y, w, h) => Object.assign(el.style, { left: r.left + x * sc + 'px', top: y + 'px', width: w * sc + 'px', height: h * sc + 'px' });
  put(hPlus, 166, r.height - (IH - 752) * sc, 58, 58);
  put(hX, 255, 485 * sc, 44, 44);
}
addEventListener('resize', place); place();

/* springs: the glass moves by transform only, so liquidGL never re-rasterises its content mid-motion */
const sp = (resp, z) => ({ k: (2 * Math.PI / resp) ** 2, c: 4 * Math.PI * z / resp });
function spring(from, to, cfg, on, done) {
  let x = from, v = cfg.v || 0, last = null, stop = false; const span = Math.max(Math.abs(to - from), .02);
  const f = now => { if (stop) return; if (last == null) last = now; const dt = Math.min(.034, (now - last) / 1000); last = now;
    for (let i = 0; i < 4; i++) { const h = dt / 4; v += (-cfg.k * (x - to) - cfg.c * v) * h; x += v * h; }
    if (Math.abs(x - to) < span * .002 && Math.abs(v) < span * .03) { on(to); done && done(); return; } on(x); requestAnimationFrame(f); };
  requestAnimationFrame(f); return { stop() { stop = true; } };
}
function mover(el, offY, cfgOpen, cfgClose) {
  let p = 0, s = null;
  const apply = x => { p = x; el.style.transform = x <= 0.0005 ? '' : `translateY(${((1 - x) * offY()).toFixed(2)}px)`; if (x <= .0005) el.style.transform = ''; };
  return {
    get p() { return p; },
    to(x, cfg, done) { s && s.stop(); if (RM) { apply(x); done && done(); return; } s = spring(p, x, cfg || (x ? cfgOpen : cfgClose), apply, done); },
    set(x) { s && s.stop(); apply(x); }
  };
}
// closed transforms live in CSS; while moving we drive translateY from the open position
const mSheet = mover(sheet, () => sheet.offsetHeight + 40, sp(.45, .86), sp(.38, 1));
const mToast = mover(toastEl, () => -140, sp(.42, .78), sp(.32, 1));
const mPop = mover(pop, () => 36, sp(.36, .8), sp(.24, 1));
let cur = null, tTimer = 0;
function open(which) {
  if (cur) return; cur = which; catcher.classList.add('on');
  if (which === 'sheet') { sheet.querySelector('.scr').scrollTop = 0; mSheet.set(0.0006); mSheet.to(1); }
  else { pop.style.opacity = 0; mPop.set(0.0006); fadeTo(pop, 1, 180); mPop.to(1); }
}
function close() {
  if (!cur) return; const w = cur; cur = null; catcher.classList.remove('on');
  if (w === 'sheet') mSheet.to(0, null, () => { sheet.style.transform = ''; });
  else { fadeTo(pop, 0, 140); mPop.to(0, null, () => { pop.style.transform = ''; pop.style.opacity = ''; }); }
}
function fadeTo(el, b, ms) { const a = +getComputedStyle(el).opacity, t0 = performance.now(); const f = n => { const k = Math.min(1, (n - t0) / ms); el.style.opacity = a + (b - a) * k; if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function toast(what) {
  $('tt').innerHTML = `${what}<small>Logged at 08:40</small>`;
  clearTimeout(tTimer); mToast.set(0.0006); mToast.to(1);
  tTimer = setTimeout(hideToast, 4000);
}
function hideToast() { clearTimeout(tTimer); mToast.to(0, null, () => { toastEl.style.transform = ''; }); }

hPlus.onclick = () => open('sheet'); hX.onclick = () => open('pop');
catcher.onclick = close;
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
document.addEventListener('click', e => {
  if (e.target.closest('[data-tclose]')) { hideToast(); return; }
  if (e.target.closest('[data-close]')) { close(); return; }
  const l = e.target.closest('[data-log]'); if (l && cur) { const w = l.dataset.log; close(); setTimeout(() => toast(w), RM ? 0 : 280); }
});
// drag the sheet down by its handle or header to close it
(() => { let on = false, sy = 0, ly = 0, lt = 0, v = 0, dy = 0;
  sheet.addEventListener('pointerdown', e => { if (cur !== 'sheet' || !e.target.closest('.grab,.hd') || e.target.closest('button')) return; on = true; sy = ly = e.clientY; lt = performance.now(); v = 0; dy = 0; sheet.setPointerCapture(e.pointerId); });
  sheet.addEventListener('pointermove', e => { if (!on) return; const n = performance.now(); v = (e.clientY - ly) / Math.max(1, n - lt) * 1000; ly = e.clientY; lt = n; dy = Math.max(0, e.clientY - sy); mSheet.set(1 - dy / (sheet.offsetHeight + 40)); });
  const up = () => { if (!on) return; on = false; if (dy > 110 || v > 650) close(); else mSheet.to(1); };
  sheet.addEventListener('pointerup', up); sheet.addEventListener('pointercancel', up);
})();

/* liquidGL: one shared canvas; each piece gets its own optics. Tuned for Apple's Liquid Glass on a dark ground:
   clear but with a little frost, refraction mostly at the rim, a thin specular edge, a light ink tint for text */
const base = { content: false, snapshot: '#snap', engine: 'auto', resolution: 2, zIndex: 50, shadow: true, specular: false, reveal: 'none', refraction: 0, frost: 0 };
function init() {
  liquidGL({ ...base, target: '#sheet', bevelDepth: .07, bevelWidth: .07, aberration: .12, tint: 'rgba(20, 28, 40, 0.30)' });
  liquidGL({ ...base, target: '#pop', bevelDepth: .08, bevelWidth: .12, aberration: .12, tint: 'rgba(20, 28, 40, 0.26)' });
  liquidGL({ ...base, target: '#toast', bevelDepth: .08, bevelWidth: .28, aberration: .12, tint: 'rgba(20, 28, 40, 0.24)' });
}
const imgs = [...document.querySelectorAll('.plate img')].map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve());
const loaded = new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', r));
Promise.all([...imgs, loaded, document.fonts ? document.fonts.ready : 0]).then(() => requestAnimationFrame(() => window.liquidGL ? init() : addEventListener('load', init)));
window.__lg = { open, close, toast };
})();
</script>
